<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connecting Facebook…</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f7fb;color:#1e2433}
  .box{text-align:center;max-width:360px;padding:28px}
  .sp{width:34px;height:34px;border:3px solid #d8dbe8;border-top-color:#4f46e5;border-radius:50%;margin:0 auto 16px;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:17px;margin:0 0 6px}
  p{font-size:13px;color:#6b7280;margin:0}
</style>
</head>
<body>
  <div class="box">
    <div class="sp"></div>
    <h1 id="t">Finishing Facebook connection…</h1>
    <p id="s">You can close this window if it doesn’t close automatically.</p>
  </div>
<script>
(function(){
  // NEXUNOVA RMS — Facebook OAuth redirect target. Hands the auth `code` back to the
  // portal window that opened this popup, then closes. No tokens are handled here.
  var q = new URLSearchParams(location.search);
  var msg = {
    source: 'nx-fb-oauth',
    code: q.get('code') || null,
    state: q.get('state') || null,
    error: q.get('error') || null,
    error_description: q.get('error_description') || q.get('error_reason') || null
  };
  try {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage(msg, location.origin);
    }
  } catch (e) { /* ignore */ }
  if (msg.error) {
    document.getElementById('t').textContent = 'Facebook connection cancelled';
    document.getElementById('s').textContent = msg.error_description || msg.error;
  }
  // give the opener a moment to receive the message, then close
  setTimeout(function(){ try { window.close(); } catch(e){} }, msg.error ? 2500 : 600);
})();
</script>
</body>
</html>
