<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Availability — Nexunova</title>
<link rel="icon" href="/assets/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/favicon-180.png">
<!-- supabase-js 2.34.0 vendored locally — jsDelivr .min.js path 301-loops (see login.html). -->
<!-- absolute path on purpose: this page is served at /a/<token>, so a relative
     src would resolve to /a/js/vendor/... and 404 -->
<script src="/js/vendor/supabase-js-2.34.0.umd.js?v=20260616"></script>
<style>
/* ══ PUBLIC AVAILABILITY ════════════════════════════════════════════════════
   A read-only tower behind a shareable link. No session, no portal code, no
   write of any kind — the only server call this page can make is
   get_public_availability(token), which never reads a client, a payment or an
   installment. See supabase/migrations/20260817f_public_availability_links.sql.

   The look is the availability concept's, carried over unchanged so the two
   surfaces stay one design. What is deliberately ABSENT: Reserve, Make a plan,
   role switch, inventory value, and anything that could name a buyer.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#F1F5F9; --card:#FFFFFF; --sub:#F8FAFC; --bd:#E2E8F0;
  --tx:#0F172A; --mut:#64748B; --pri:#4F46E5;
  --sky:#0284C7; --sky-soft:rgba(2,132,199,.13); --pri-soft:rgba(79,70,229,.24);
  --amb:#D97706; --amb-soft:rgba(217,119,6,.16);
  --sold:#C3CDDB; --sold-edge:rgba(15,23,42,.06); --sold-tx:#5A6B82;
  --fac-1:#E4EAF2; --fac-2:#DCE3EC; --core:#CBD5E1; --slab:rgba(15,23,42,.07);
  --pillar:#CFD8E4; --pillar-hi:rgba(255,255,255,.75); --pillar-lo:rgba(15,23,42,.14);
  --slab-face:#D3DCE8; --slab-edge:rgba(15,23,42,.16);
  --shaft:#C6D0DE; --shaft-line:rgba(15,23,42,.13);
  --night:#EAF0F7; --ground:#CBD5E1;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 6px 18px rgba(15,23,42,.08);
  --ease:cubic-bezier(.22,.61,.36,1);
}
html[data-theme="dark"]{
  --bg:#070C16; --card:#0F1726; --sub:#131C2E; --bd:#1E293B;
  --tx:#E7ECF5; --mut:#8B9AB4; --pri:#818CF8;
  --sky:#38BDF8; --sky-soft:rgba(56,189,248,.16); --pri-soft:rgba(129,140,248,.3);
  --amb:#FBBF24; --amb-soft:rgba(251,191,36,.16);
  --sold:#18202F; --sold-edge:rgba(255,255,255,.045); --sold-tx:#697B99;
  --fac-1:#0E1626; --fac-2:#0B121F; --core:#131E33; --slab:rgba(255,255,255,.05);
  --pillar:#162034; --pillar-hi:rgba(255,255,255,.10); --pillar-lo:rgba(0,0,0,.55);
  --slab-face:#121C2E; --slab-edge:rgba(0,0,0,.5);
  --shaft:#131D31; --shaft-line:rgba(255,255,255,.07);
  --night:#040810; --ground:#070C16;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);
  font:14px/1.5 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}

/* ── page frame ─────────────────────────────────────────────────────────── */
/* wide on purpose: this page's job is to put a whole project on one screen, and
   every px of width buys a bigger unit number */
.wrap{max-width:1720px;margin:0 auto;padding:22px 20px 60px}
.head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.h-t{font-size:18px;font-weight:700;letter-spacing:-.01em}
.h-s{font-size:12px;color:var(--mut);margin-top:2px}
.h-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{height:32px;padding:0 13px;border:1px solid var(--bd);border-radius:8px;background:var(--card);
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.18s var(--ease)}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
html[data-theme="dark"] .btn.pri{color:#0B1220}
.btn.pri:hover{filter:brightness(1.06)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;background:var(--card);overflow:hidden}
.seg button{height:32px;padding:0 12px;font-size:13px;font-weight:600;color:var(--mut);transition:.18s var(--ease)}
.seg button.on{background:var(--pri);color:#fff}
html[data-theme="dark"] .seg button.on{color:#0B1220}

/* ── the top of the page: two kinds of thing, told apart on sight ──────────
   INFO reads. CONTROLS click. The first version blurred them — the by-type
   breakdown was a filter that looked like a statistic, and the type filter
   existed twice, once as that breakdown and once as chips. So: the cards above
   state facts and cannot be pressed, everything below them is a button, and a
   rule between the two says where one ends and the other begins.
   ───────────────────────────────────────────────────────────────────────── */

/* ── 1 · summary: information only ──────────────────────────────────────── */
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{flex:1;min-width:150px;border:1px solid var(--bd);border-radius:12px;background:var(--card);
  padding:11px 14px 12px;box-shadow:var(--shadow);cursor:default}
.chip .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:6px}
.chip .k i{width:9px;height:9px;border-radius:3px;display:inline-block}
.chip .v{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.chip .s{font-size:11px;color:var(--mut);margin-top:2px;font-variant-numeric:tabular-nums}
.chip .m{height:4px;border-radius:99px;background:var(--sub);margin-top:9px;overflow:hidden}
.chip .m>span{display:block;height:100%;border-radius:99px;width:0;transition:width 1.4s var(--ease) .4s}

/* ── 2 · filter: everything here is pressable ───────────────────────────── */
.hunt{border:1px solid var(--bd);border-radius:12px;background:var(--card);
  box-shadow:var(--shadow);padding:0;margin-bottom:16px;overflow:hidden}
.hunt-h{display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--bd);
  background:var(--sub)}
.hunt-h b{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx)}
.hunt-h span{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.hunt-h .clr{margin-left:auto;height:28px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;
  background:var(--card);font-size:12px;font-weight:600;color:var(--pri)}
.hunt-h .clr:hover{border-color:var(--pri)}

/* one row per question, each with its own label and its own rule */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 15px}
.filters+.filters{border-top:1px solid var(--bd);padding-bottom:18px}
.f-lb{width:58px;flex:none;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--mut)}

/* a chip that is unmistakably a button: border, fill, lift on hover */
.pill{height:38px;padding:0 15px;border:1px solid var(--bd);border-radius:10px;background:var(--sub);
  font-size:13px;font-weight:600;color:var(--tx);display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 1px 0 rgba(0,0,0,.04);transition:.16s var(--ease)}
.pill:hover{border-color:var(--pri);background:var(--card);transform:translateY(-1px)}
.pill:active{transform:none}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 4px 14px var(--pri-soft)}
html[data-theme="dark"] .pill.on{color:#0B1220}
/* the count rides in its own little slug, so the label stays the label */
.pill b{font-weight:700;font-size:12px;padding:2px 7px;border-radius:99px;background:var(--bd);
  color:var(--mut);font-variant-numeric:tabular-nums}
.pill.on b{background:rgba(255,255,255,.24);color:#fff}
html[data-theme="dark"] .pill.on b{background:rgba(11,18,32,.22);color:#0B1220}
.pill.tog{margin-left:auto}
.pill.tog.on{background:var(--sky);border-color:var(--sky);color:#04283B;box-shadow:0 4px 14px var(--sky-soft)}
.pill.tog.on b{background:rgba(4,40,59,.18);color:#04283B}

.num-in{width:84px;height:38px;border:1px solid var(--bd);border-radius:10px;background:var(--sub);color:var(--tx);
  padding:0 11px;font:inherit;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.num-in.wide{width:126px}
.num-in:focus{outline:0;border-color:var(--pri);background:var(--card)}
.f-unit{font-size:12px;color:var(--mut);font-weight:600}
.f-sep{width:1px;height:22px;background:var(--bd);margin:0 4px}
/* the figure read back in words, so a typo of one zero is visible instantly */
.rs{position:relative;display:inline-flex}
.rs em{position:absolute;right:11px;bottom:-14px;font-style:normal;font-size:10px;font-weight:600;
  color:var(--sky);font-variant-numeric:tabular-nums;pointer-events:none}

/* what the current filter actually yields — one line, under the controls */
.f-out{padding:10px 15px;border-top:1px solid var(--bd);background:var(--sub);
  font-size:12px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.f-out b{color:var(--tx);font-weight:700;font-variant-numeric:tabular-nums}
.f-out .rng{margin-left:auto;font-variant-numeric:tabular-nums}

/* nothing matched — say so on the building itself, do not leave a dark tower */
.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;text-align:center;
  background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 22px;box-shadow:var(--shadow)}
.empty b{display:block;font-size:14px}
.empty span{font-size:12px;color:var(--mut)}

/* filtered-out glass: still part of the facade, just not part of the answer.
   !important because a running animation outranks a plain declaration. */
.win.off{opacity:.15!important;filter:grayscale(1) brightness(.85)!important;box-shadow:none!important}
.win.gone{opacity:.06!important;filter:none!important;box-shadow:none!important;color:transparent!important}

/* ── night stage ────────────────────────────────────────────────────────── */
.stage{position:relative;border:1px solid var(--bd);border-radius:14px;overflow:hidden;
  background:var(--night);box-shadow:var(--shadow)}
.stage::before{content:"";position:absolute;left:50%;bottom:70px;width:960px;height:820px;
  transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(closest-side,var(--sky-soft),transparent 72%)}
/* flex-start + auto margins: the tower is centred while it fits, and scrolls
   from its left edge once the zoom makes it wider than the stage */
.stage-in{position:relative;padding:34px 14px 0;display:flex;justify-content:flex-start;overflow-x:auto}
.tower{width:100%;max-width:820px;position:relative;margin:0 auto;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.42)) drop-shadow(0 2px 0 rgba(0,0,0,.25))}
html[data-theme="light"] .tower{filter:drop-shadow(0 16px 26px rgba(15,23,42,.20))}

/* one grid keeps labels, facade and counters on the same rails */
/* the rails are deliberately mean: every px they give back is a px of glass,
   and glass is where the unit numbers have to fit */
.rw{display:grid;grid-template-columns:40px minmax(0,1fr) 54px;align-items:stretch;gap:10px}


/* roof — parapet, machine room, mast */
/* the parapet: a wall that overhangs the facade slightly, with a lit coping on
   top — that overhang is what makes a roof read as a roof and not as a lid */
.roof .cap{position:relative;height:20px;border-radius:5px 5px 0 0;background:var(--fac-2);
  margin:0 calc(var(--over, 7px) * -1);
  box-shadow:inset 0 3px 0 var(--slab-face),inset 0 4px 0 var(--slab-edge),
             inset 10px 0 0 var(--pillar),inset -10px 0 0 var(--pillar),
             inset 11px 0 0 var(--pillar-hi),inset -11px 0 0 var(--pillar-lo)}
.roof .cap::after{content:"";position:absolute;left:-4px;right:-4px;top:-4px;height:5px;
  border-radius:3px;background:var(--slab-face);box-shadow:0 1px 0 var(--slab-edge)}
.mast{position:relative;height:44px}
.mast::before{content:"";position:absolute;left:50%;bottom:0;width:2px;height:44px;background:var(--bd)}
.mast::after{content:"";position:absolute;left:calc(50% - 4px);top:-2px;width:9px;height:9px;border-radius:50%;
  background:var(--amb);box-shadow:0 0 14px var(--amb);animation:beacon 2.8s ease-in-out infinite}
.hut{position:absolute;left:50%;bottom:0;width:120px;height:22px;transform:translateX(-50%);
  background:var(--fac-2);border:1px solid var(--bd);border-bottom:0;border-radius:4px 4px 0 0}
@keyframes beacon{0%,100%{opacity:.22}50%{opacity:1}}

/* a floor: label · facade plate · counter */
.fl-name{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right;
  font-size:11px;color:var(--mut);transition:color .2s var(--ease)}
.fl-name b{color:var(--tx);font-weight:700;font-size:14px;letter-spacing:-.01em}
/* THE SHELL.
   The verticals are painted per floor rather than as one overlay: the rows stack
   with no gap, so a pillar drawn on every plate at the same x reads as one
   column running the whole height — and it survives any number of floors, any
   zoom, and the mobile rail widths, none of which an absolutely-positioned
   overlay would follow without being told. */
.plate{position:relative;background:var(--fac-1);
  padding:9px calc(var(--pil) + 5px);display:flex;align-items:center;gap:7px;
  --pil:8px;
  /* left pillar, its lit edge, right pillar, its shaded edge, and the slab */
  box-shadow:
    inset  var(--pil) 0 0 var(--pillar),
    inset  calc(var(--pil) + 1px) 0 0 var(--pillar-hi),
    inset  calc(var(--pil) * -1) 0 0 var(--pillar),
    inset  calc((var(--pil) + 1px) * -1) 0 0 var(--pillar-lo),
    inset 0 -3px 0 var(--slab-face),
    inset 0 -4px 0 var(--slab-edge);
  transition:background .25s var(--ease)}
.rw:nth-child(even) .plate{background:var(--fac-2)}

/* the lift / stair shaft — one continuous column of masonry down the middle.
   Only drawn where the floor really has a central corridor: a floor laid in
   several courses has none, and inventing one would be a lie about the plan. */
.tower:not(.wide) .plate::before{content:"";position:absolute;left:50%;top:0;bottom:0;
  width:var(--shaft-w,12px);transform:translateX(-50%);pointer-events:none;z-index:0;
  background:var(--shaft);
  box-shadow:inset 1px 0 0 var(--shaft-line),inset -1px 0 0 var(--shaft-line)}
/* cylindrical shading — the facade reads as a solid mass, not a flat band */
.plate::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,.05),transparent 16%,transparent 76%,rgba(0,0,0,.30))}
html[data-theme="light"] .plate::after{background:linear-gradient(90deg,rgba(255,255,255,.6),transparent 18%,transparent 76%,rgba(15,23,42,.10))}
.rw:hover .plate{background:var(--core)}
.rw:hover .fl-name{color:var(--tx)}
.wing{display:flex;flex-wrap:nowrap;gap:var(--gap);align-content:center;justify-content:center;flex:1}
.tower.wide .wing,.tower.courses .wing{flex-wrap:wrap}
.core{width:12px;flex:none;align-self:stretch}   /* the gap; the shaft paints it */
.fl-stat{display:flex;flex-direction:column;justify-content:center;font-size:13px;font-weight:700}
.fl-stat span{font-weight:500;color:var(--mut);font-size:11px}

/* base — plinth, canopy, lobby light, shadow on the ground */
/* the base carries the building: a plinth wider than the shaft above it, and a
   canopy over the lobby light */
.plinth{position:relative;height:46px;margin:0 calc(var(--over, 7px) * -1);background:var(--fac-2);
  border-radius:0 0 3px 3px;
  box-shadow:inset 0 3px 0 var(--slab-face),inset 0 4px 0 var(--slab-edge),
             inset 10px 0 0 var(--pillar),inset -10px 0 0 var(--pillar),
             inset 11px 0 0 var(--pillar-hi),inset -11px 0 0 var(--pillar-lo)}
.plinth::before{content:"";position:absolute;left:50%;bottom:0;width:150px;height:26px;transform:translateX(-50%);
  background:var(--core);border:1px solid var(--bd);border-bottom:0;border-radius:3px 3px 0 0}
.plinth::after{content:"";position:absolute;left:50%;bottom:0;width:86px;height:15px;transform:translateX(-50%);
  background:var(--sky);opacity:.75;border-radius:2px 2px 0 0;box-shadow:0 0 26px var(--sky)}
.ground{height:86px;background:linear-gradient(180deg,var(--ground),transparent);position:relative}
.ground::before{content:"";position:absolute;left:50%;top:0;width:78%;height:1px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,var(--bd),transparent)}
/* the shadow the building casts on its own plot — the thing that stops the
   whole drawing floating */
.ground::after{content:"";position:absolute;left:50%;top:-6px;width:min(62%,620px);height:26px;
  transform:translateX(-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent 72%)}
html[data-theme="light"] .ground::after{background:radial-gradient(closest-side,rgba(15,23,42,.22),transparent 72%)}

/* the footing: a slab wider than the plinth, sitting on the ground */
.foot-slab{position:relative;height:10px;margin:0 calc(var(--over-foot, 8px) * -1);border-radius:2px;background:var(--slab-face);
  box-shadow:0 1px 0 var(--slab-edge),inset 0 1px 0 var(--pillar-hi)}

/* ── narrow screens — declared AFTER the shell so these actually win ───── */
@media (max-width:560px){
  .wrap{padding:14px 10px 40px}
  .rw{grid-template-columns:28px minmax(0,1fr) 46px;gap:6px}
  .fl-name b{font-size:12px}
  .fl-name{font-size:10px}
  .fl-stat span{font-size:9px;letter-spacing:-.02em}
  .fl-stat{font-size:12px}
  .stage-in{padding:22px 8px 0}
  .tower{--over:4px;--over-foot:4px}
  .plate{--pil:5px;padding:8px calc(var(--pil) + 3px);gap:4px;--shaft-w:6px}
  .roof .cap,.plinth{box-shadow:inset 0 3px 0 var(--slab-face),inset 0 4px 0 var(--slab-edge),
    inset 7px 0 0 var(--pillar),inset -7px 0 0 var(--pillar)}
  .core{width:6px}
  .f-lb{width:100%}
}
/* ── the windows ────────────────────────────────────────────────────────── */
/* Every pane carries its own unit number. The number is the point of the page —
   the glow only says WHICH ones to read first. */
.win{width:var(--w);height:var(--h);border-radius:2.5px;position:relative;flex:none;
  display:grid;place-items:center;overflow:hidden;
  font-size:var(--fs);font-weight:600;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--wtx);
  background:var(--sold);box-shadow:inset 0 0 0 1px var(--sold-edge);
  opacity:0;transform:translateY(3px);
  animation:powerOn .55s var(--ease) forwards;animation-delay:var(--d);
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),filter .18s var(--ease)}
.win span{position:relative;z-index:2}
@keyframes powerOn{to{opacity:1;transform:none}}
/* SOLID, on purpose. The panes used to twinkle — each on its own random clock —
   and on a phone that reads as restlessness rather than as a building at night.
   Every pane now holds one steady colour: available bright, taken dark, and (in
   the back-office view) reserved amber. The power-on sweep on load stays; it
   runs once and then everything is still.
   Removed on purpose — do not put the pulse back without asking. */
.win.available{background:var(--sky);box-shadow:0 0 5px var(--sky),0 0 15px var(--sky-soft);--wtx:#04283B}
/* the public link knows TWO states. "taken" is sold and reserved together —
   nobody outside the company needs to be told which. */
.win.sold,.win.taken{--wtx:var(--sold-tx)}
/* glass: a pane catches light at its top-left corner (behind the number) */
.win.available::after{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(155deg,rgba(255,255,255,.42),rgba(255,255,255,.02) 55%)}
.win:hover,.win:focus-visible{transform:scale(1.35);z-index:6;outline:0}
.win.available:hover{box-shadow:0 0 12px var(--sky),0 0 32px var(--sky)}
.win.sold:hover,.win.taken:hover{filter:brightness(1.9)}
.win.pick{transform:scale(1.35);z-index:6;box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--pri)}
@media (prefers-reduced-motion:reduce){.win,.win.available{animation:none;opacity:1;transform:none}}

/* hover tag */
.tag{position:fixed;z-index:30;pointer-events:none;opacity:0;transform:translate(-50%,-142%);
  background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:5px 9px;
  font-size:12px;font-weight:600;white-space:nowrap;box-shadow:var(--shadow);transition:opacity .14s var(--ease)}
.tag.on{opacity:1}
.tag em{font-style:normal;font-weight:500;color:var(--mut);margin-left:7px}
.tag em+em{color:var(--sky);font-weight:600}

/* legend */
.legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;padding:16px 0 4px;
  font-size:12px;color:var(--mut);position:relative;z-index:2}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}

/* ── detail card (slide-in) ─────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(2,6,16,.5);opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.card{position:fixed;top:0;right:0;bottom:0;width:min(390px,92vw);background:var(--card);
  border-left:1px solid var(--bd);z-index:50;transform:translateX(102%);
  transition:transform .42s var(--ease);display:flex;flex-direction:column;box-shadow:var(--shadow)}

  font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}

.badge.sold,.badge.taken{background:var(--sub);color:var(--mut)}
.c-note{padding:0 20px 16px;font-size:12px;color:var(--mut)}

/* ── cheapest-first list (on demand — the tower stays the page) ─────────── */
.card.list{width:min(430px,94vw)}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;width:100%;text-align:left;
  padding:10px 20px;border-bottom:1px solid var(--bd);transition:background .15s var(--ease)}

  color:var(--mut);font-size:10px;font-weight:700;margin-right:8px;vertical-align:1px}
.lrow:first-child .rank{background:var(--sky);color:#04283B}


/* ── public-only chrome ─────────────────────────────────────────────────── */
.boot{min-height:70vh;display:grid;place-items:center;text-align:center;padding:40px 20px}

.ro{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:99px;
  background:var(--sub);border:1px solid var(--bd);font-size:11px;font-weight:600;color:var(--mut)}
</style>
</head>
<body>
<div id="boot" class="boot"><div><b>Loading availability…</b><span>One moment.</span></div></div>

  <div class="c-body" id="lbody" style="padding:0"></div>

<script>
/* ── the only server call this page can make ──────────────────────────────
   get_public_availability(token) returns unit_no, floor, type, area, state and
   — for AVAILABLE units only — price. It never reads clients, payments or
   installments, so there is no buyer name, phone or due on the wire to hide.
   No session is created, nothing is written, and reserve_unit is unreachable. */
const SUPABASE_URL = 'https://itqxljtfbrppntgyfush.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_OkIT2ttNgBiOm-E4HJLnFw_OmIz-8VG';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:false } });

/* the token rides in the path (/a/<token>) or as ?t=<token> */
const TOKEN = (function () {
  var q = new URLSearchParams(location.search).get('t');
  if (q) return q;
  var m = location.pathname.match(/\/a\/([A-Za-z0-9_-]{8,})/);
  return m ? m[1] : '';
})();

var P = null, SEL = null, ZOOM = 1;
var FILTER = { type: null, availOnly: false, min: null, max: null, band: null };
var L = 100000, CR = 10000000;
var BANDS = [
  { k: 'u50',   t: 'Under 50 L',  min: null,   max: 50 * L },
  { k: '50-75', t: '50 - 75 L',   min: 50 * L, max: 75 * L },
  { k: '75-1c', t: '75 L - 1 Cr', min: 75 * L, max: CR },
  { k: '1c+',   t: '1 Cr +',      min: CR,     max: null }
];
var CVAR = { available:'var(--sky)', taken:'var(--sold)' };
var SAY  = { available:'Available', taken:'Not available' };
var money = function (n) { return n ? Number(n).toLocaleString('en-US') : '—'; };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
  return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); };
var $ = function (id) { return document.getElementById(id); };

function dead(t, m){
  $('app').style.display = 'none';
  $('boot').style.display = 'grid';
  $('boot').innerHTML = '<div><b>' + esc(t) + '</b><span>' + esc(m) + '</span></div>';
}

(async function load(){
  if (!TOKEN) return dead('This link is not complete',
    'The address is missing its code. Please use the full link you were sent.');
  var r;
  try { r = await sb.rpc('get_public_availability', { p_token: TOKEN }); }
  catch (e) { return dead('Could not reach the server', 'Please check your connection and try again.'); }
  var d = r.data;
  /* revoked, expired and never-existed all answer the same way, so a stranger
     poking at tokens learns nothing from the difference */
  if (r.error || !d || !d.success)
    return dead('This link is no longer active',
      'It may have been turned off or replaced. Please ask for a current link.');

  P = { name: d.project, company: d.company, floors: (d.floors || []).map(function (f) {
    return { no: f.floor_no, label: f.floor_label, units: (f.units || []).map(function (u) {
      return { n: u.n, s: u.s, t: u.t || null,
               a: u.a == null ? null : Number(u.a), p: u.p == null ? null : Number(u.p) }; }) };
  }) };
  $('boot').style.display = 'none';
  $('app').style.display = '';
  $('foot').textContent = 'Availability only · shared by ' + P.company +
    ' · figures change as units are sold — please confirm before committing.';
  paint();
})();

/* ── the tower, carried over from the availability concept ───────────────── */
function typeRank(k){
  if (k === '—') return 999;
  if (/studio/i.test(k)) return 0;
  var m = k.match(/(\d+)\s*bed/i);
  return m ? Number(m[1]) : 100;
}
function types(){
  var m = new Map();
  P.floors.forEach(function (f) { f.units.forEach(function (u) {
    var k = u.t || '—'; m.set(k, (m.get(k) || 0) + 1); }); });
  return Array.from(m.entries()).sort(function (a, b) {
    return typeRank(a[0]) - typeRank(b[0]) || a[0].localeCompare(b[0]); });
}
function matches(u){
  if (FILTER.availOnly && u.s !== 'available') return false;
  if (FILTER.type && (u.t || '—') !== FILTER.type) return false;
  if (budgetOn()) {
    if (u.s !== 'available' || !u.p) return false;
    if (FILTER.min != null && u.p < FILTER.min) return false;
    if (FILTER.max != null && u.p > FILTER.max) return false;
  }
  return true;
}
function budgetOn(){ return FILTER.min != null || FILTER.max != null; }
function lakh(n){ return n >= CR ? (n / CR).toFixed(2).replace(/\.00$/, '') + ' Cr' : Math.round(n / L) + ' L'; }
function cssq(s){ return String(s).replace(/"/g, '\\"'); }
function tally(){
  var t = { available:0, taken:0, total:0 };
  P.floors.forEach(function (f) { f.units.forEach(function (u) {
    if (t[u.s] != null) t[u.s]++; t.total++; }); });
  return t;
}

function drawFilters(){
  var t = types(), total = t.reduce(function (a, x) { return a + x[1]; }, 0);
  $('filters').innerHTML =
    '<span class="f-lb">Type</span>' +
    '<button class="pill' + (FILTER.type ? '' : ' on') + '" data-t="">All <b>' + total + '</b></button>' +
    t.map(function (x) { return '<button class="pill' + (FILTER.type === x[0] ? ' on' : '') +
      '" data-t="' + esc(x[0]) + '">' + esc(x[0] === '—' ? 'No type' : x[0]) +
      ' <b>' + x[1] + '</b></button>'; }).join('') +
    '<button class="pill tog' + (FILTER.availOnly ? ' on' : '') + '" data-avail="1">Only available</button>';
}
function drawBudget(){
  $('budget').innerHTML =
    '<span class="f-lb">Budget</span>' +
    '<button class="pill' + (budgetOn() ? '' : ' on') + '" data-b="">Any</button>' +
    BANDS.map(function (b) { return '<button class="pill' + (FILTER.band === b.k ? ' on' : '') +
      '" data-b="' + b.k + '">' + b.t + '</button>'; }).join('') +
    '<span class="f-sep"></span>' +
    '<span class="rs"><input class="num-in wide" id="bmin" type="number" min="0" step="100000" placeholder="min PKR" value="' +
      (FILTER.min != null ? FILTER.min : '') + '"><em id="bmine">' + (FILTER.min != null ? lakh(FILTER.min) : '') + '</em></span>' +
    '<span class="f-unit">–</span>' +
    '<span class="rs"><input class="num-in wide" id="bmax" type="number" min="0" step="100000" placeholder="max PKR" value="' +
      (FILTER.max != null ? FILTER.max : '') + '"><em id="bmaxe">' + (FILTER.max != null ? lakh(FILTER.max) : '') + '</em></span>';
}
function applyFilter(){
  var shown = 0, total = 0;
  P.floors.forEach(function (f) { f.units.forEach(function (u) {
    var el = document.querySelector('.win[data-u="' + cssq(u.n) + '"]'); if (!el) return;
    total++;
    var hit = matches(u); if (hit) shown++;
    el.classList.toggle('off', !hit && !(FILTER.availOnly && u.s !== 'available'));
    el.classList.toggle('gone', !hit && FILTER.availOnly && u.s !== 'available');
  }); });
  var any = FILTER.type || FILTER.availOnly || budgetOn();
  $('huntsub').textContent = any ? filterWords() : '';
  $('clr').style.visibility = any ? 'visible' : 'hidden';

  /* One line that answers the filter: how many units it leaves, how many of
     those can actually be sold, and what they cost. This is where the by-type
     card's price ranges went — the same fact, once, next to the control that
     changes it. */
  var sale = [];
  P.floors.forEach(function (f) { f.units.forEach(function (u) {
    if (u.s === 'available' && u.p && matches(u)) sale.push(u.p); }); });
  sale.sort(function (a, b) { return a - b; });
  $('fout').innerHTML =
    '<span>Showing <b>' + shown + '</b> of ' + total + ' units</span>' +
    '<span><b>' + sale.length + '</b> priced and available</span>' +
    (sale.length ? '<span class="rng">' + money(sale[0]) + ' – ' + money(sale[sale.length - 1]) +
       '  (' + lakh(sale[0]) + ' – ' + lakh(sale[sale.length - 1]) + ')</span>' : '');

  var stage = document.querySelector('.stage-in'), old = $('nores');
  if (old) old.remove();
  if (shown === 0 && stage) {
    var e = document.createElement('div');
    e.id = 'nores'; e.className = 'empty';
    e.innerHTML = '<b>Nothing in this filter</b><span>' + esc(filterWords()) + '</span>';
    stage.appendChild(e);
  }
}
function filterWords(){
  var s = [];
  if (FILTER.type) s.push(FILTER.type);
  if (budgetOn()) s.push((FILTER.min != null ? lakh(FILTER.min) : 'any') + ' – ' +
                         (FILTER.max != null ? lakh(FILTER.max) : 'any'));
  if (FILTER.availOnly) s.push('available only');
  return s.join(' · ') || 'no filter';
}
function relist(){ if ($('list').classList.contains('on')) drawList(); }

function paint(){
  var t = tally();
  $('ttl').textContent = P.name;
  $('sub').textContent = P.company + ' · ' + P.floors.length + ' floors · ' + t.total + ' units';

  $('chips').innerHTML =
    chip('Total units', t.total, 'transparent', 0, 'transparent', P.floors.length + ' floors') +
    chip('Available', t.available, 'var(--sky)', t.total ? t.available / t.total : 0, 'var(--sky)',
      'ready to sell right now') +
    chip('Not available', t.taken, 'var(--sold)', t.total ? t.taken / t.total : 0, 'var(--mut)', '');

  var max = Math.max.apply(null, P.floors.map(function (f) { return f.units.length; }));
  var wide = max > 34, perRow = wide ? 26 : max;
  var stage = $('tower').parentElement;
  var narrow = stage.clientWidth < 560;
  // ask the stylesheet what the rails cost — never remember it (see _rails)
  var rails = _rails(wide);
  var room = Math.max(narrow ? 250 : 360, stage.clientWidth - (narrow ? 16 : 30)) - rails;

  var longest = '';
  P.floors.forEach(function (f) { f.units.forEach(function (u) {
    if (u.n.length > longest.length) longest = u.n; }); });
  var need = textW(longest, 12);

  var courses = 1, slot, gap, w, h, fs;
  measure();
  /* A floor that cannot hold its units on one readable row is laid in courses —
     but the courses must be EVEN. Wrapping 15 panes at whatever happened to fit
     left a row of seven, a row of seven and a lonely one, which reads as a
     mistake rather than as a building. So each wing is given an exact width in
     panes and wraps on that. */
  var perWing = Math.ceil(max / 2), balanced = perWing;
  if (!wide && fs < 9 && ZOOM <= 1.25) {
    courses = narrow ? 3 : 2;
    balanced = Math.ceil(perWing / courses);
    perRow = balanced * 2;
    measure(46);
  }
  function measure(cap){
    slot = Math.round(Math.max(16, Math.min(cap || 58, Math.floor(room / perRow))) * ZOOM);
    gap = slot >= 30 ? 4 : 3;
    w = slot - gap;
    h = Math.max(17, Math.min(38, Math.round(w * 0.74)));
    fs = Math.min(12, Math.floor((w - 6) / need * 12 * 2) / 2);
  }
  var full = fs >= 7.5;
  if (!full) fs = Math.max(7.5, Math.min(11, Math.floor((w - 5) / textW(tailOf(longest), 12) * 12 * 2) / 2));

  // an exact wing width is what makes the courses even
  var wingW = courses > 1 ? 'flex:none;width:' + (balanced * slot) + 'px' : '';
  var order = P.floors.slice().reverse();
  var html = '<div class="rw roof"><span></span><div><div class="mast"><span class="hut"></span></div>' +
             '<div class="cap"></div></div><span></span></div>';
  order.forEach(function (f, i) {
    var fromBottom = order.length - 1 - i;
    var av = f.units.filter(function (u) { return u.s === 'available'; }).length;
    var half = Math.ceil(f.units.length / 2);
    html += '<div class="rw" style="--gap:' + gap + 'px">' +
      '<div class="fl-name"><b>' + esc(shortLabel(f.label)) + '</b>' + f.units.length + ' units</div>' +
      '<div class="plate">' +
        (wide
          ? '<div class="wing">' + wins(f.units, fromBottom, 0, w, h, fs, full) + '</div>'
          : '<div class="wing" style="' + wingW + '">' + wins(f.units.slice(0, half), fromBottom, 0, w, h, fs, full) + '</div>' +
            '<div class="core"></div>' +
            '<div class="wing" style="' + wingW + '">' + wins(f.units.slice(half), fromBottom, half, w, h, fs, full) + '</div>') +
      '</div>' +
      '<div class="fl-stat">' + av + '<span>/' + f.units.length + ' free</span></div>' +
    '</div>';
  });
  html += '<div class="rw"><span></span><div class="plinth"></div><span></span></div>' +
          '<div class="rw"><span></span><div class="foot-slab"></div><span></span></div>';
  var tw = $('tower');
  tw.innerHTML = html;
  // .wide means "no central corridor": one wing, wrapped. A multi-course floor
  // still has two wings around the shaft, so it must NOT get this class.
  tw.classList.toggle('wide', wide);
  tw.classList.toggle('courses', courses > 1);
  tw.style.maxWidth = (rails + perRow * slot) + 'px';
  $('lgt').textContent = 'Every pane is one unit, numbered';

  drawFilters(); drawBudget(); applyFilter();
  requestAnimationFrame(function () {
    document.querySelectorAll('.chip .m>span').forEach(function (s) { s.style.width = s.dataset.w; }); });
}
/* Ask the stylesheet, do not remember it. The rails used to be three constants
   copied out of the CSS by hand, so when the narrow media block stopped applying
   the JS carried on sizing for a layout the browser was not using and the glass
   spilled over the free-count. This builds one throwaway row, reads what the
   browser actually computed for the label column, the counter column, the grid
   gaps, the plate's padding and the core, and throws it away. Any future CSS
   change is followed for free. */
function _rails(wide){
  var tw = $('tower'), probe = document.createElement('div');
  probe.className = 'rw';
  probe.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;width:600px';
  probe.innerHTML = '<div class="fl-name"><b>9</b>x</div>' +
    '<div class="plate"><div class="wing"></div><div class="core"></div><div class="wing"></div></div>' +
    '<div class="fl-stat">9<span>/9 free</span></div>';
  tw.appendChild(probe);
  var cs = getComputedStyle(probe), plate = probe.querySelector('.plate'), ps = getComputedStyle(plate);
  var num = function (v, d) { var n = parseFloat(v); return isFinite(n) ? n : d; };
  var cols = String(cs.gridTemplateColumns).split(' ');
  var out = num(cols[0], 40) + num(cols[2], 54) + num(cs.columnGap, 10) * 2 +
            num(ps.paddingLeft, 13) + num(ps.paddingRight, 13) +
            (wide ? 0 : probe.querySelector('.core').getBoundingClientRect().width + num(ps.columnGap, 7) * 2);
  tw.removeChild(probe);
  return Math.ceil(out);
}

function chip(k, v, dot, frac, bar, sub){
  return '<div class="chip"><div class="k"><i style="background:' + dot +
    (dot === 'var(--sky)' ? ';box-shadow:0 0 8px var(--sky)' : '') + '"></i>' + k + '</div>' +
    '<div class="v num">' + v + '</div>' +
    (sub ? '<div class="s">' + esc(sub) + '</div>' : '') +
    '<div class="m"><span data-w="' + Math.round(frac * 100) + '%" style="background:' + bar + '"></span></div></div>';
}
function shortLabel(l){
  var m = l.match(/^(\d+)/);
  return /upper ground/i.test(l) ? 'UG' : /^ground$/i.test(l) ? 'G'
       : m ? m[1] + suffix(+m[1]) : l.replace(/\s*floor$/i, '');
}
function suffix(n){ return n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th'; }
function tailOf(no){ var s = String(no); return s.indexOf('-') > 0 ? s.slice(s.indexOf('-') + 1) : s; }
var MEAS = document.createElement('canvas').getContext('2d');
function textW(s, px){
  MEAS.font = '600 ' + px + "px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif";
  return MEAS.measureText(s).width;
}
function wins(units, floorFromBottom, offset, w, h, fs, full){
  return units.map(function (u, i) {
    var d = (floorFromBottom * 100 + (offset + i) * 6) + 'ms';
        return '<button class="win ' + u.s + '" data-u="' + esc(u.n) + '" style="--w:' + w + 'px;--h:' + h +
      'px;--fs:' + fs + 'px;--d:' + d + '"><span>' + esc(full ? u.n : tailOf(u.n)) + '</span></button>';
  }).join('');
}

/* ── interactions — every one of them read-only ──────────────────────────── */
$('filters').onclick = function (e) {
  var b = e.target.closest('.pill'); if (!b) return;
  if (b.dataset.avail) FILTER.availOnly = !FILTER.availOnly; else FILTER.type = b.dataset.t || null;
  drawFilters(); applyFilter(); relist();
};
$('clr').onclick = function () {
  FILTER = { type:null, availOnly:false, min:null, max:null, band:null };
  drawFilters(); drawBudget(); applyFilter(); relist();
};
$('budget').onclick = function (e) {
  var b = e.target.closest('.pill'); if (!b) return;
  var band = BANDS.filter(function (x) { return x.k === b.dataset.b; })[0];
  FILTER.band = band ? band.k : null;
  FILTER.min = band ? band.min : null;
  FILTER.max = band ? band.max : null;
  drawBudget(); applyFilter(); relist();
};
var BT;
$('budget').addEventListener('input', function (e) {
  if (!/^b(min|max)$/.test(e.target.id)) return;
  clearTimeout(BT);
  BT = setTimeout(function () {
    var mn = $('bmin').value, mx = $('bmax').value;
    FILTER.min = mn === '' ? null : Number(mn);      // plain rupees, as typed
    FILTER.max = mx === '' ? null : Number(mx);
    FILTER.band = (BANDS.filter(function (b) {
      return b.min === FILTER.min && b.max === FILTER.max; })[0] || {}).k || null;
    $('bmine').textContent = FILTER.min != null ? lakh(FILTER.min) : '';
    $('bmaxe').textContent = FILTER.max != null ? lakh(FILTER.max) : '';
    document.querySelectorAll('#budget .pill').forEach(function (p) {
      p.classList.toggle('on', (p.dataset.b || '') === (FILTER.band || '') &&
        (budgetOn() ? !!p.dataset.b : !p.dataset.b)); });
    applyFilter(); relist();
  }, 220);
});
$('zoom').onclick = function (e) {
  var b = e.target.closest('button'); if (!b) return;
  ZOOM = Math.max(0.7, Math.min(2, ZOOM + (+b.dataset.z) * 0.25));
  closeCard(); closeList(); paint();
};
$('theme').onclick = function () {
  var h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
};

var TAG = $('tag');
$('tower').addEventListener('mouseover', function (e) {
  var b = e.target.closest('.win'); if (!b) return;
  var h = find(b.dataset.u); if (!h) return;
  var u = h.u;
  TAG.innerHTML = esc(u.n) +
    '<em>' + esc(u.t || '—') + (u.a ? ' · ' + Math.round(u.a) + ' sq ft' : '') + '</em>' +
    '<em>' + (u.s !== 'available' ? SAY.taken : (u.p ? 'PKR ' + money(u.p) : 'rate pending')) + '</em>';
  var r = b.getBoundingClientRect();
  TAG.style.left = (r.left + r.width / 2) + 'px'; TAG.style.top = r.top + 'px';
  TAG.classList.add('on');
});
$('tower').addEventListener('mouseout', function (e) {
  if (e.target.closest('.win')) TAG.classList.remove('on'); });
function find(no){
  var f = P.floors.filter(function (f) {
    return f.units.some(function (u) { return u.n === no; }); })[0];
  return f ? { f:f, u:f.units.filter(function (u) { return u.n === no; })[0] } : null;
}

$('tower').addEventListener('click', function (e) {
  var b = e.target.closest('.win'); if (!b) return;
  var h = find(b.dataset.u); if (h) openUnit(h.f, h.u, b);
});
/* The card is a FACT SHEET, not a workspace: no Reserve, no plan, no buyer.
   A sold unit says it is sold and stops there — the server sent no price for it,
   and never sends who bought it. */
function openUnit(f, u, el){
  SEL = { f:f, u:u };
  document.querySelectorAll('.win.pick').forEach(function (x) { x.classList.remove('pick'); });
  el.classList.add('pick');
  var dot = $('cdot');
  dot.style.background = CVAR[u.s];
  dot.style.boxShadow = u.s === 'sold' ? 'none' : '0 0 10px ' + CVAR[u.s];
  $('cno').textContent = u.n;
  $('cfl').textContent = f.label + ' · ' + P.name;
  var rows =
    row('Status', '<span class="badge ' + u.s + '">' + SAY[u.s] + '</span>') +
    row('Floor', esc(f.label)) +
    row('Type', esc(u.t || '—')) +
    row('Area', u.a ? '<b class="num">' + u.a.toFixed(2) + '</b> sq ft' : '—');
  if (u.s === 'available') {
    rows += row('Rate', u.a && u.p ? '<b class="num">PKR ' + money(Math.round(u.p / u.a)) + '</b> / sq ft' : '—') +
            row('Price', u.p ? '<b class="num">PKR ' + money(u.p) + '</b>' : '<b>Rate pending</b>');
  }
  $('cbody').innerHTML = rows;
  $('cnote').textContent = u.s === 'available'
    ? 'Available at the time this page was opened. Ask your contact to confirm and hold it.'
    : 'Already taken — this one is not for sale.';
  $('card').classList.add('on'); $('scrim').classList.add('on');
}
function row(k, v){ return '<div class="row"><span>' + k + '</span><span>' + v + '</span></div>'; }
function closeCard(){
  $('card').classList.remove('on');
  if (!$('list').classList.contains('on')) $('scrim').classList.remove('on');
  document.querySelectorAll('.win.pick').forEach(function (x) { x.classList.remove('pick'); });
  SEL = null;
}
$('cx').onclick = closeCard;
$('scrim').onclick = function () { closeCard(); closeList(); };

function drawList(){
  var rows = [];
  P.floors.forEach(function (f) { f.units.forEach(function (u) {
    if (u.s !== 'available') return;
    if (FILTER.type && (u.t || '—') !== FILTER.type) return;
    if (budgetOn() && (!u.p || (FILTER.min != null && u.p < FILTER.min) ||
                              (FILTER.max != null && u.p > FILTER.max))) return;
    rows.push({ u:u, f:f });
  }); });
  rows.sort(function (a, b) {
    var pa = a.u.p || 0, pb = b.u.p || 0;
    if (!pa !== !pb) return pa ? -1 : 1;
    return pa - pb || a.u.n.localeCompare(b.u.n);
  });
  $('lsub').textContent = rows.length + ' available' + (FILTER.type ? ' · ' + FILTER.type : '') +
    (budgetOn() ? ' · ' + (FILTER.min != null ? lakh(FILTER.min) : 'any') + '–' +
                               (FILTER.max != null ? lakh(FILTER.max) : 'any') : '') +
    ' · ' + P.name;
  $('lbody').innerHTML = rows.length ? rows.map(function (r, i) {
    return '<button class="lrow" data-u="' + esc(r.u.n) + '">' +
      '<span class="ln"><span class="rank">' + (i + 1) + '</span>' + esc(r.u.n) + '</span>' +
      '<span class="lp">' + (r.u.p ? 'PKR ' + money(r.u.p) : '<span class="pend">Rate pending</span>') + '</span>' +
      '<span class="lt">' + esc(r.u.t || '—') + ' · ' + esc(r.f.label) + '</span>' +
      '<span class="lr">' + (r.u.a ? Math.round(r.u.a) + ' sq ft' +
        (r.u.p && r.u.a ? ' · ' + money(Math.round(r.u.p / r.u.a)) + '/ft' : '') : '') + '</span></button>';
  }).join('') : '<div style="padding:24px;text-align:center;color:var(--mut)">Nothing available in this filter.</div>';
}
$('cheap').onclick = function () {
  var l = $('list');
  if (l.classList.contains('on')) return closeList();
  closeCard(); drawList();
  l.classList.add('on'); $('scrim').classList.add('on');
};
function closeList(){
  $('list').classList.remove('on');
  if (!$('card').classList.contains('on')) $('scrim').classList.remove('on');
}
$('lx').onclick = closeList;
$('lbody').onclick = function (e) {
  var b = e.target.closest('.lrow'); if (!b) return;
  var h = find(b.dataset.u); if (!h) return;
  var el = document.querySelector('.win[data-u="' + cssq(h.u.n) + '"]');
  closeList();
  if (el) { el.scrollIntoView({ block:'center', behavior:'smooth' }); openUnit(h.f, h.u, el); }
};

var RS;
window.addEventListener('resize', function () {
  clearTimeout(RS);
  RS = setTimeout(function () { if (P) { closeCard(); paint(); } }, 160);
});
</script>
</body>
</html>
