  /* One quiet line, because the seven chips above already carry the weight
     and screen one has to stay whole on a phone. */
  $('allrow').innerHTML =
    '<button class="all-chip" data-all="1">' +
      '<span class="ac-w">' +
        '<span class="ac-t">All units</span>' +
        '<span class="ac-m">Every floor in one list \u00b7 <b class="num">' + av +
          '</b> of <span class="num">' + tot + '</span> available</span>' +
      '</span>' +
      '<span class="ac-x"><i></i></span>' +
    '</button>';

  paintHero(av, tot);

  /* ONCE. The entrance belongs to the first time these chips exist, not to
     every two-minute refetch — a grid that re-animates itself while somebody
     is reading it is the page fidgeting. */
  if (!STAGGERED) {
    STAGGERED = true;
    var fl = $('floors');
    fl.classList.add('stagger');
    setTimeout(function () { fl.classList.remove('stagger'); }, 500);
  }

  runSearch();          // keep any query alive across a refetch
}

/* One number, one bar, one line of legend. The bar is the same fact drawn a
   second time for the eye that does not read digits; it is never the only
   place a number appears, so colour is never load-bearing on its own. */
function paintHero(av, tot) {
  var held = Math.max(0, tot - av);
  var pct = tot ? Math.round(av * 1000 / tot) / 10 : 0;
  var fw = tot ? (av * 100 / tot) : 0;
  /* THE WHOLE BUILDING, BROKEN OUT. The bar was two colours and the line under
     it said "N not available", which is the one thing a dealer already knew.
     It is the cumulative half of what Rashid asked for: the bar is now a band
     per kind of hold, and the line under it names each with its count. */
  var all = [];
  (P.floors || []).forEach(function (f) { all = all.concat(f.units || []); });
  var kinds = tally(all);
  $('hero').innerHTML =
    '<div class="hero-l">Available now</div>' +
    '<div class="hero-top">' +
      '<div class="hero-n">' + av + '</div>' +
      '<div class="hero-p">of ' + tot + (tot ? ' · ' + pct + '%' : '') + '</div>' +
    '</div>' +
    '<div class="bar"><i class="free" style="width:' + fw + '%"></i>' +
      kinds.map(function (k) {
        return '<i style="width:' + (tot ? k.n * 100 / tot : 0) + '%;background:' + k.tint + '"></i>';
      }).join('') +
    '</div>' +
    '<div class="hero-f">' +
      (held ? kinds.map(function (k) {
                return '<span><i class="dot" style="background:' + k.tint + '"></i><b>' +
                       k.n + '</b> ' + esc(k.label.toLowerCase()) + '</span>';
              }).join('')
            : '<span>Every unit is free</span>') +
    '</div>';
}

/* ── THE WHOLE BUILDING ───────────────────────────────────────────────────
   Every other decision on this page exists to avoid drawing 1,467 units,
   and this draws them. That is fine because a person asked for it by name,
   but it means the two things that keep it usable are not decoration:

   · the floor's own numbers ride WITH the floor, stuck to the top of the
     screen while you are inside it, so three hundred identical chips are
     never anonymous;
   · the filter cuts the list rather than tinting it, because on a phone the
     way to find the eleven held units among 1,467 is to be shown eleven.

   It is built as ONE string and assigned once. Appending floor by floor
   would lay the page out seven times. */
function renderAll() {
  $('home').hidden = true;
  $('res').hidden = true;
  $('floor').hidden = true;
  $('units').innerHTML = '';        // the one-floor screen stays unmounted
  var opening = $('all').hidden;
  $('all').hidden = false;
  if (opening) playScr($('all'), 'scr-in');

  var fl = P.floors || [];
  var tot = 0, av = 0;
  fl.forEach(function (f) { tot += Number(f.total || 0); av += Number(f.available || 0); });
  var held = Math.max(0, tot - av);

  $('all-head').innerHTML =
    '<div class="ah-r">' +
      '<div class="ah-c"><div class="ah-l">Floors</div>' +
        '<div class="ah-v num">' + fl.length + '</div></div>' +
      '<div class="ah-c"><div class="ah-l">Units</div>' +
        '<div class="ah-v num">' + tot + '</div></div>' +
      '<div class="ah-c"><div class="ah-l">Not available</div>' +
        '<div class="ah-v num held">' + held + '</div></div>' +
      '<div class="ah-c"><div class="ah-l">Available</div>' +
        '<div class="ah-v num">' + av + '</div></div>' +
    '</div>';

  $('all-filter').innerHTML = [
    ['all',  'All'],
    ['free', 'Available'],
    ['held', 'Not available']
  ].map(function (o) {
    return '<button data-f="' + o[0] + '"' + (ALLF === o[0] ? ' class="on"' : '') +
           '>' + o[1] + '</button>';
  }).join('');

  var shown = 0;
  var html = fl.map(function (f, fi) {
    var units = (f.units || []).filter(function (u) {
      if (ALLF === 'free') return u.s === 'available';
      if (ALLF === 'held') return u.s !== 'available';
      return true;
    });
    if (!units.length) return '';
    shown += units.length;
    var t = Number(f.total || 0), a = Number(f.available || 0), h = Math.max(0, t - a);
    return '<div class="as">' +
      '<div class="as-h">' +
        '<span class="as-n">' + esc(f.floor_label) + '</span>' +
        '<span class="as-m">' +
          '<b class="num">' + t + '</b> units' +
          ' \u00b7 <b class="num held">' + h + '</b> not available' +
          ' \u00b7 <b class="num">' + a + '</b> available' +
        '</span>' +
      '</div>' +
      '<div class="ug' + (P && P.show_price ? ' money' : '') + '">' +
        units.map(function (u) { return chip(u, fi); }).join('') +
      '</div>' +
    '</div>';
  }).join('');

  $('all-body').innerHTML = html;
  $('all-empty').hidden = !!shown;
  if (!shown) {
    $('all-empty').textContent = ALLF === 'held'
      ? 'Every unit in the building is available.'
      : 'Nothing is available in the building right now.';
  }
}

/* ══ THE FLOOR PLAN ═════════════════════════════════════════════════════
   The drawing is a static file, the same one the office prints and hands out:
   walls, columns, stairs, and nothing about who holds what. Everything that
   is not public \u2014 which unit is free, which is gone \u2014 still comes down the
   token'd board call and is painted on top. So the plan can be cached by the
   world and the position cannot.

   Fetched once per floor and kept, because a dealer walks a floor, goes back
   and comes again. */
var PLANS = {};            // floor prefix -> { svg, w, h, units } | 'none'
var PLANV = true;          // the plan is the view, when there is one
var PLANZ = 1;
var PLANSEL = '';          // the shop last asked about, kept marked
/* which keys the legend has switched OFF. Absent means showing, so a status
   the tenant invents tomorrow is visible the first time it appears rather
   than hidden until somebody thinks to add it here. */
var PLANF = {};
var PLANHIT = '';          // what the find box is pointing at
var PLANZSET = false;      // the reader has taken the zoom into their own hands

function slug(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}
/* the floor's own prefix, taken from its units rather than from its name: the
   drawing files are named after what is written on the units. */
function floorKey(f) {
  var u = (f.units || [])[0];
  if (!u) return null;
  var m = /^([A-Za-z0-9]+)-/.exec(String(u.n || ''));
  return m ? m[1].toUpperCase() : null;
}

/* WHICH FLOORS HAVE A DRAWING AT ALL. Asking for one that does not exist is a
   404 in the console of every project without plans — noise on a page that is
   meant to be quiet, and a real error to anybody reading the log. One small
   file answers it, and it is always there. */
var PLANIX = null;
async function planIndex() {
  if (PLANIX) return PLANIX;
  try {
    var r = await fetch('/plans/manifest.json');
    PLANIX = r.ok ? await r.json() : {};
  } catch (e) { PLANIX = {}; }
  return PLANIX;
}

async function loadPlan(f) {
  var k = floorKey(f);
  if (!k) return null;
  if (PLANS[k]) return PLANS[k] === 'none' ? null : PLANS[k];
  var ix = await planIndex();
  var have = ix[slug(P.project)] || [];
  if (have.indexOf(k) < 0) { PLANS[k] = 'none'; return null; }
  var base = '/plans/' + slug(P.project) + '/' + k;
  try {
    var r = await Promise.all([fetch(base + '.svg'), fetch(base + '.json')]);
    if (!r[0].ok || !r[1].ok) { PLANS[k] = 'none'; return null; }
    var svg = await r[0].text(), meta = await r[1].json();
    PLANS[k] = { svg: svg, w: meta.w, h: meta.h, units: meta.units };
    return PLANS[k];
  } catch (e) { PLANS[k] = 'none'; return null; }
}

/* One shape per unit, over the drawing. Available units are left open \u2014 the
   linework shows through and the tap area is invisible; anything gone is
   tinted and crossed. That is the whole legend, and it needs no key. */
/* WHAT THE SHEET SAYS ABOUT A SHOP. The printed plan carries three things in
   the middle of every shop — the number, what it is, and how big it is — and a
   dealer reads all three together. All three are written here rather than
   lifted off the drawing, because the drawing's lettering is traced outlines:
   twelve megabytes for one floor, against one for the walls. Written from the
   register, they are also current, which a printed sheet never is. */
function unitLines(u) {
  var out = [String(u.n)];
  if (u.t) out.push(String(u.t).toUpperCase());
  var a = area(u);
  if (a) out.push(a);
  /* and what it costs, where the project publishes it: the rate under the
     size it is a rate of, and the total under both */
  /* ON A SHOP THAT IS GONE, THE STATUS TAKES THE RATE'S LINE. A sixth line
     does not fit — a 170 sqft strip carries five and the block was already at
     the smallest lettering worth printing. So the plate says the same number
     of things about every shop, and about a taken one it says the more useful
     of the two: not what it works out to per foot, but what kind of hold is on
     it and on whose word. The rate is still on the chip. */
  var s = stat(u);
  if (s.free) { var r = rate(u); if (r) out.push(r); }
  else out.push(s.label.toUpperCase() + (s.who ? ' · ' + s.who : ''));
  var m = money(u.v);
  if (m) out.push(m);
  return out;
}

/* Fitted to the shop it sits in, width and height both: a corner unit carries
   full-size lettering and a narrow strip carries small lettering, the same way
   the draughtsman did it. Nothing is dropped — a shop too small to read at
   arm's length is still right under the zoom. */
/* WHERE THE ROOM ACTUALLY IS, at one line across it. A bounding box lies about
   an L-shaped shop: LG-46 wraps around the stairwell, so its box is 99 wide
   while the arm the label sat in is a third of that — and the label ran out of
   the shop and over the wall. Cutting the outline at a line gives the real
   width there. Horizontal edges contribute nothing by the half-open rule, so a
   cut along a wall does not count it twice. */
function cutAt(pts, v, vertical) {
  var out = [];
  for (var i = 0; i < pts.length; i++) {
    var a = pts[i], b = pts[(i + 1) % pts.length];
    var a1 = vertical ? a[0] : a[1], b1 = vertical ? b[0] : b[1];
    if ((a1 <= v && b1 > v) || (b1 <= v && a1 > v)) {
      var a2 = vertical ? a[1] : a[0], b2 = vertical ? b[1] : b[0];
      out.push(a2 + (v - a1) / (b1 - a1) * (b2 - a2));
    }
  }
  return out.sort(function (p, q) { return p - q; });
}
/* inside/outside alternates along the cut, so the room is one of the pairs */
function spanAround(cuts, c) {
  var best = null;
  for (var i = 0; i + 1 < cuts.length; i += 2) {
    if (c >= cuts[i] && c <= cuts[i + 1]) return [cuts[i], cuts[i + 1]];
    if (!best || cuts[i + 1] - cuts[i] > best[1] - best[0]) best = [cuts[i], cuts[i + 1]];
  }
  return best;
}
/* THE ROOMIEST PLACE TO WRITE, which is what a draughtsman looks for. The
   outline is cut at a handful of positions and the one that carries the
   largest lettering wins — so a label lands in the wide part of an L and not
   in its arm. */
function labelSpot(pts, x0, x1, y0, y1, cx, cy, W, tall) {
  var best = null;
  for (var k = 0; k <= 8; k++) {
    var x = k === 8 ? cx : x0 + (x1 - x0) * (k + 0.5) / 8;
    var v = spanAround(cutAt(pts, x, true), cy);
    if (!v) continue;
    var my = (v[0] + v[1]) / 2;
    var h = spanAround(cutAt(pts, my, false), x);
    if (!h) continue;
    var mx = (h[0] + h[1]) / 2;
    /* measured again at the place the label will really sit */
    var v2 = spanAround(cutAt(pts, mx, true), my) || v;
    var bw = h[1] - h[0], bh = v2[1] - v2[0];
    var fs = Math.min(bw * 0.86 / (W || 1), bh * 0.85 / (tall || 2.8), 5.2);
    if (!best || fs > best.fs) best = { cx: mx, cy: (v2[0] + v2[1]) / 2, fs: fs };
  }
  return best;
}

/* WHERE A BLOCK OF THIS MANY LINES WOULD SIT, AND HOW BIG. Pulled out of
   labelBlock so the same question can be asked twice — once of the full block
   and once of a shorter one — which is how a 170 sqft strip decides what it
   can carry. */
function fitLines(lines, pts, x0, x1, y0, y1, cx, cy) {
  var W = 0;
  lines.forEach(function (t, i) {
    W = Math.max(W, t.length * 0.60 * (i ? 0.78 : 1));   // ~.60em per character
  });
  /* HOW TALL THE BLOCK IS, FOR HOWEVER MANY LINES IT HAS. The first line is
     full size and the rest are smaller, one step of nine tenths apart. This
     used to be three hard-coded baselines, which was fine until the price and
     the rate made it five, and the status made it six. */
  var tall = 1 + (lines.length - 1) * 0.9;
  var spot = labelSpot(pts, x0, x1, y0, y1, cx, cy, W, tall);
  if (!spot) spot = { cx: cx, cy: cy,
                      fs: Math.min((x1 - x0) * 0.86 / (W || 1), (y1 - y0) * 0.85 / tall, 5.2) };
  spot.tall = tall;
  return spot;
}
function labelBlock(lines, pts, cx, cy, x0, x1, y0, y1, free, key) {
  var spot = fitLines(lines, pts, x0, x1, y0, y1, cx, cy);
  /* THE NAME IS THE FIRST THING TO GO. "HOLD · Waqar Landlord" is twice the
     width of any other line in the block, and on a small shop it is what
     pushes the lettering out through the wall. Where it does not fit, the
     plate keeps the word and drops the name — which is still on the chip, in
     the tooltip, and in what a tap says. */
  if (spot.fs <= 1.16 && lines.length > 1 && lines[lines.length - 1].indexOf(' · ') > 0) {
    var shorter = lines.slice(0, -1)
      .concat(lines[lines.length - 1].split(' · ')[0]);
    var s2 = fitLines(shorter, pts, x0, x1, y0, y1, cx, cy);
    if (s2.fs > spot.fs) { lines = shorter; spot = s2; }
  }
  var tall = spot.tall;
  cx = spot.cx; cy = spot.cy;
  var fs = spot.fs;
  if (!(fs > 0)) return '';
  fs = Math.max(fs, 1.15);
  var top = cy - (tall * fs) / 2 + 0.72 * fs;
  return '<text class="n' + (free ? '' : ' off') + '" data-n="' + esc(lines[0]) +
           '" data-k="' + esc(key || (free ? 'free' : 'held')) + '"' +
           (free ? '' : ' style="fill:' + tint(key) + '"') +
           ' font-size="' + fs.toFixed(2) + '">' +
    lines.map(function (t, i) {
      /* the last line of a taken block is the status, and it is the one line
         that carries its own weight rather than fading with the rest */
      var last = !free && i === lines.length - 2;   // the status sits above the total
      return '<tspan' + (i ? ' class="s' + (last ? ' k' : '') + '"' : '') + ' x="' + cx.toFixed(1) +
             '" y="' + (top + i * 0.9 * fs).toFixed(1) + '">' + esc(t) + '</tspan>';
    }).join('') + '</text>';
}

/* One shop wears one mark. Set on the shape rather than kept in a list, so a
   repaint that rebuilds the drawing loses nothing that matters. */
function markPlan(no, cls) {
  var host = $('pv-in'); if (!host) return;
  host.querySelectorAll('.u.' + cls).forEach(function (e) { e.classList.remove(cls); });
  var el = host.querySelector('.u[data-u="' + String(no).replace(/"/g, '') + '"]');
  if (el) el.classList.add(cls);
  return el;
}

/* FIND A SHOP ON A PLATE OF A HUNDRED AND SIXTY-EIGHT. Typing 85 is enough;
   so is LG-85, and so is the size if that is what a buyer remembers. The
   match is marked and the plate scrolls to it, which is the part that cannot
   be done on paper. */
function findOnPlan(q) {
  var host = $('pv-in'); if (!host) return;
  host.querySelectorAll('.u.hit').forEach(function (e) { e.classList.remove('hit'); });
  PLANHIT = '';
  var t = norm(q);
  if (!t) return;
  var f = P.floors[FLOOR]; if (!f) return;
  var hit = (f.units || []).filter(function (u) { return norm(u.n) === t; })[0] ||
            (f.units || []).filter(function (u) { return norm(u.n).slice(-t.length) === t; })[0] ||
            (f.units || []).filter(function (u) { return norm(u.n).indexOf(t) >= 0; })[0];
  if (!hit) return;
  PLANHIT = hit.n;
  var el = markPlan(hit.n, 'hit');
  if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintPlan(plan, f) {
  var host = $('pv-in');
  var over = [], names = [];
  (f.units || []).forEach(function (u) {
    var g = plan.units[u.n];
    if (!g) return;
    var free = u.s === 'available';
    var pts = g.p.map(function (p) { return [p[0] * plan.w, p[1] * plan.h]; });
    var d = 'M' + pts.map(function (p) {
      return p[0].toFixed(1) + ' ' + p[1].toFixed(1);
    }).join('L') + 'Z';
    /* the shop's own box, used twice: the cross is drawn across it and the
       label is fitted inside it */
    var xs = g.p.map(function (p) { return p[0]; }), ys = g.p.map(function (p) { return p[1]; });
    var x0 = Math.min.apply(null, xs) * plan.w, x1 = Math.max.apply(null, xs) * plan.w;
    var y0 = Math.min.apply(null, ys) * plan.h, y1 = Math.max.apply(null, ys) * plan.h;
    var lines = unitLines(u);
    var s = stat(u);
    /* THE WASH AND THE CROSS ARE THE STATUS'S OWN. data-k rides with every
       piece of a shop — the shape, the cross and the lettering — so the legend
       can step the other kinds back without knowing anything about them. */
    over.push('<path class="u' + (free ? '' : ' off') + '" d="' + d +
              '" data-u="' + esc(u.n) + '" data-k="' + esc(s.key) + '"' +
              (free ? '' : ' style="fill:' + wash(s.key, .17) + '"') +
              '><title>' + esc(lines.join(' · ')) + '</title></path>');
    if (!free) {
      /* an L-shaped shop is crossed across the part a thumb can see */
      over.push('<path class="x ' + s.dash + '" data-k="' + esc(s.key) + '"' +
                ' style="stroke:' + s.tint + '" d="M' + x0.toFixed(1) + ' ' + y0.toFixed(1) +
                'L' + x1.toFixed(1) + ' ' + y1.toFixed(1) +
                'M' + x1.toFixed(1) + ' ' + y0.toFixed(1) +
                'L' + x0.toFixed(1) + ' ' + y1.toFixed(1) + '"/>');
    }
    names.push(labelBlock(lines, pts, g.c[0] * plan.w, g.c[1] * plan.h,
                          x0, x1, y0, y1, free, s.key));
  });
  host.innerHTML =
    '<div class="base">' + plan.svg + '</div>' +
    '<svg class="over" viewBox="0 0 ' + plan.w + ' ' + plan.h + '" preserveAspectRatio="none">' +
      over.join('') + names.join('') +
    '</svg>';
  host.style.width = (PLANZ * 100) + '%';
  /* the board refetches every minute and repaints; a filter or a mark that did
     not survive that would look like the page forgetting what you just did */
  planShown();
  if (PLANSEL) markPlan(PLANSEL, 'sel');
  if (PLANHIT) markPlan(PLANHIT, 'hit');
  if (!host.__bound) {
    host.addEventListener('click', function (e) {
      if (PANNED) return;              // that was a drag across the plate
      var p = e.target.closest('[data-u]'); if (!p) return;
      var no = p.getAttribute('data-u');
      PLANSEL = no; markPlan(no, 'sel');
      var unit = (P.floors[FLOOR].units || []).filter(function (x) { return x.n === no; })[0];
      if (!unit || unit.s !== 'available') {
        /* say WHICH kind, and on whose word — the tap was the question */
        var st = stat(unit);
        toast(no + ' — ' + st.label + (st.who ? ', on ' + st.who + '’s word' : ''));
        return;
      }
      openSheet(no, FLOOR);
    });
    host.__bound = true;
  }
}

async function showPlan(f) {
  var plan = await loadPlan(f);
  var card = $('pv-b'), box = $('pv'), note = $('pv-note');
  if (!plan) {
    /* A FLOOR WITH NO DRAWING MUST NOT DECIDE FOR THE ONES THAT HAVE ONE.
       This used to turn the plan off outright, and since the switch is one
       flag for the whole session, walking through a floor without a plate
       left every plated floor after it opening as a list \u2014 which read as the
       plan defaulting to off. It only hides itself now. */
    card.hidden = true; box.hidden = true; note.hidden = true;
    return false;
  }
  /* THE CARD STAYS WHEN THE LIST IS SHOWING. Its head names the floor and its
     switch is how you come back \u2014 taking the whole plate away in list view
     would leave nothing to come back with. */
  card.hidden = false;
  $('pv-plan').classList.toggle('on', PLANV);
  $('pv-list').classList.toggle('on', !PLANV);
  box.hidden = !PLANV;
  note.hidden = !PLANV;
  $('pv-c').hidden = !PLANV;
  $('pv-qw').hidden = !PLANV;

  var units = f.units || [];
  var gone = units.filter(function (u) { return u.s !== 'available'; }).length;
  /* A TITLE BLOCK, THE WAY A DRAWING CARRIES ONE. The line above already
     names the floor and counts it; this names the SHEET — whose building it
     is and what it is a plan of — which is what a title block is for. */
  $('pv-t').textContent = f.floor_label || 'Floor plan';
  $('pv-s').textContent = 'As drawn · ' + units.length + ' shops';
  planKeys();

  if (PLANV) {
    /* THE WHOLE FLOOR FIRST. Opening enlarged was tried and it starts the
       reader inside the building with no idea which end they are at; the
       plate is meant to be seen whole and then gone into. The zoom sits
       beside the legend for that, and follows you down the page. */
    if (!PLANZSET) setZoom(1);
    paintPlan(plan, f);
    note.innerHTML = 'Tap a shop to ask for it. ' +
      (gone ? '<b>' + gone + '</b> crossed out are already taken.' : 'Every shop on this floor is free.');
  }
  return true;
}

function renderFloor() {
  var f = P.floors[FLOOR];
  if (!f) { FLOOR = null; return renderHome(); }
  var opening = $('floor').hidden;
  $('all').hidden = true;
  $('rep').hidden = true; REPV = false;
  $('all-body').innerHTML = '';
  $('home').hidden = true;
  $('res').hidden = true;
  $('floor').hidden = false;
  /* Only when the screen actually changes. A refetch while a floor is open
     must not slide it in again under the reader. */
  if (opening) playScr($('floor'), 'scr-in');
  $('fname').textContent = f.floor_label;
  $('fcount').innerHTML = '<b class="num">' + Number(f.available || 0) + '</b> of ' +
    '<span class="num">' + Number(f.total || 0) + '</span> available';
  $('showall').checked = SHOWALL;

  var list = (f.units || []).filter(function (u) {
    return SHOWALL || u.s === 'available';
  });

  $('units').innerHTML = list.map(function (u) { return chip(u); }).join('');
  $('units').className = 'ug' + (P && P.show_price ? ' money' : '');

  var none = !list.length;
  $('fempty').hidden = !none;
  if (none) {
    $('fempty').textContent = SHOWALL
      ? 'No units on this floor.'
      : 'Nothing available on this floor right now.';
  }

  /* THE DRAWING, IF THERE IS ONE FOR THIS FLOOR. Asked for after the list is
     already on screen, so a floor never waits on a file: the chips are there
     the moment the floor opens and the plan takes their place when it lands. */
  showPlan(f).then(function (has) {
    var showList = !has || !PLANV;
    $('units').hidden = !showList;
    $('fempty').hidden = !showList || !none;
    var sw = document.querySelector('#floor .sw');
    if (sw) sw.hidden = !showList;
  });
}

/* ── search: across every floor, entirely in the browser ─────────────────
   The payload is already here; a keystroke must never become a request. Empty
   query shows nothing at all — a list that appears before you have typed is
   noise, not help. */
function runSearch() {
  var q = String($('q').value || '').trim();
  var box = $('res');
  if (!q) { box.hidden = true; box.className = ''; box.innerHTML = ''; return; }
  /* The panel exists all along and is only unhidden, so the entrance has to
     be re-armed by hand or it plays exactly once in the life of the page. */
  var wasHidden = box.hidden;

  var k = norm(q), out = [];
  (P.floors || []).forEach(function (f, fi) {
    (f.units || []).forEach(function (u) {
      if (norm(u.n).indexOf(k) === 0) out.push({ u: u, f: f, fi: fi });
    });
  });
  /* Available first — this page exists to find something to sell. Within that,
     the order the payload already has, which is the order the building is
     walked. */
  out.sort(function (a, b) {
    var aa = a.u.s === 'available' ? 0 : 1, bb = b.u.s === 'available' ? 0 : 1;
    return aa - bb;
  });

  box.hidden = false;
  box.className = 'res';
  if (wasHidden) { void box.offsetWidth; }
  if (!out.length) {
    box.innerHTML = '<div class="res-none">No unit starts with ' + esc(q) + '.</div>';
    return;
  }
  var show = out.slice(0, 8);
  box.innerHTML = show.map(function (r, i) {
    var off = r.u.s !== 'available';
    return '<button class="res-r" data-i="' + i + '"' + (off ? ' disabled' : '') + '>' +
      '<span class="n">' + esc(r.u.n) + '</span>' +
      '<span class="f">' + esc(r.f.floor_label) + '</span>' +
      '<span class="a">' + (off ? 'Not Available' : esc(area(r.u))) + '</span>' +
    '</button>';
  }).join('') +
    (out.length > show.length
      ? '<div class="res-more">' + (out.length - show.length) + ' more — keep typing</div>'
      : '');
  box.__hits = show;
}

/* ── the request sheet ───────────────────────────────────────────────────── */
/* refCode() is gone. The ref is issued by the server when the request is
   written, so the number in the WhatsApp message is the number the desk holds.
   A ref invented in the browser was a number nobody could look up. */
/* Is this duration one of the chips, or something the rep typed? */
/* WHAT MAY BE ASKED FOR, and it is the server's list. A project that
   publishes nothing gets the sheet exactly as it was: a unit and a number of
   days, with the desk deciding what to call it. */
function choices() { return (P && P.choices) || []; }
function chosen() {
  var c = choices();
  if (!c.length) return null;
  for (var i = 0; i < c.length; i++) if (c[i].id === (SHEET && SHEET.choice)) return c[i];
  return c[0];
}
/* A permanent ask has no duration — that is the whole difference between
   "hold it for me" and "this one is gone". */
function askNeedsDays() { var t = chosen(); return !t || t.nature !== 'permanent'; }

function CUSTOM(d) { return [1, 3, 7].indexOf(Number(d)) < 0; }

/* One place decides which control is lit, so a chip and the box can never
   both look chosen. */
function markDur() {
  var box = $('dur'); if (!box) return;
  var all = box.querySelectorAll('button');
  for (var i = 0; i < all.length; i++) {
    all[i].classList.toggle('on', Number(all[i].getAttribute('data-d')) === Number(SHEET.days));
  }
  var cu = $('dcust');
  if (cu) cu.classList.toggle('on', CUSTOM(SHEET.days));
}

function initials(name) {
  var w = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!w.length) return 'AV';
  return (w[0][0] + (w.length > 1 ? w[w.length - 1][0] : (w[0][1] || ''))).toUpperCase();
}

function openSheet(unitNo, floorIdx) {
  clearTimeout(SENT_T); SENT_T = null;
  var f = P.floors[floorIdx];
  var u = (f.units || []).filter(function (x) { return x.n === unitNo; })[0];
  /* Tapping an unavailable unit does nothing at all — no sheet, no message. */
  if (!u || u.s !== 'available') return;
  var c0 = choices()[0];
  SHEET = { n: unitNo, fi: floorIdx, days: 7, ref: null,
            /* Everything asked for besides the one that was tapped. Empty is
               the whole of the old behaviour: one unit, one request, one ref. */
            more: [], bad: [],
            choice: c0 ? c0.id : null };
  if (c0 && c0.nature === 'permanent') SHEET.days = null;
  else if (c0 && c0.days) SHEET.days = Number(c0.days);
  paintSheet();
  $('scrim').classList.add('on');
  $('sheet').classList.add('on');
}
function closeSheet() {
  clearTimeout(SENT_T); SENT_T = null;
  SHEET = null;
  $('scrim').classList.remove('on');
  $('sheet').classList.remove('on');
}

/* The page already holds every unit, so a number typed into the sheet can be
   answered here rather than by asking the server and waiting. It resolves
   only an EXACT match on the normalised number — the desk refuses to guess
   between two towers and so does this. */
function findUnit(no) {
  var k = norm(no), hit = null, n = 0;
  (P.floors || []).forEach(function (f, fi) {
    (f.units || []).forEach(function (u) {
      if (norm(u.n) === k) { hit = { u: u, f: f, fi: fi }; n++; }
    });
  });
  return n === 1 ? hit : null;
}

/* Every unit this sheet speaks for, the tapped one first. */
function sheetAll() {
  if (!SHEET) return [];
  return [SHEET.n].concat(SHEET.more || []);
}
function sheetFree() {
  return sheetAll().filter(function (n) {
    var h = findUnit(n); return h && h.u.s === 'available';
  });
}

/* A comma, a slash, a newline — or a space with something after it, which is
   what a list pasted out of a WhatsApp group actually looks like. A lone
   trailing space is not a separator; phone keyboards add one to every word. */
function absorbUnits(el) {
  var v = String(el.value || '');
  if (!/[,;/|\n\r\t]/.test(v) && !/\S\s+\S/.test(v)) return false;
  var trailing = /[,;/|\n\r\t\s]/.test(v.slice(-1));
  var parts = v.split(/[,;/|\n\r\t\s]+/).filter(Boolean);
  var rest = trailing ? '' : (parts.pop() || '');
  for (var i = 0; i < parts.length; i++) addUnit(parts[i]);
  el.value = rest;
  return true;
}

/* ══ TYPE A LETTER, TAP WHAT COMES BACK ══════════════════════════════════
   Adding units by typing them out in full, with commas, is fine for a list
   pasted off a group and hopeless for a rep who knows they want six shops on
   the ground floor and not which numbers they carry. Type G and the free
   ground-floor units come up; tap them.

   Only AVAILABLE ones, and never one already chosen \u2014 a row that does
   nothing when tapped is worse than a row that is not there. */
var SG_CAP = 8;
function unitMatches(key) {
  var k = norm(key); if (!k) return [];
  var picked = sheetAll(), bad = SHEET ? SHEET.bad : [], out = [];
  (P.floors || []).forEach(function (fl) {
    (fl.units || []).forEach(function (u) {
      if (u.s !== 'available') return;
      if (norm(u.n).indexOf(k) !== 0) return;
      if (picked.indexOf(u.n) >= 0) return;
      if (bad.indexOf(u.n.toUpperCase()) >= 0) return;
      out.push({ u: u, f: fl });
    });
  });
  return out;
}

function paintUnitList(key) {
  var box = $('uc-sg'); if (!box) return;
  var hits = unitMatches(key);
  /* An exact single hit has nothing to add: the next keystroke is a comma
     and the chip appears anyway. */
  if (!hits.length || (hits.length === 1 && norm(hits[0].u.n) === norm(key))) {
    box.hidden = true; box.innerHTML = ''; return;
  }
  var show = hits.slice(0, SG_CAP);
  box.hidden = false;
  box.innerHTML = show.map(function (h) {
    return '<button type="button" data-u="' + esc(h.u.n) + '">' +
      '<span class="n">' + esc(h.u.n) + '</span>' +
      '<span class="f">' + esc(h.f.floor_label) + '</span>' +
      '<span class="a">' + esc(area(h.u)) + '</span>' +
    '</button>';
  }).join('') +
    (hits.length > show.length
      ? '<div class="more">' + (hits.length - show.length) + ' more \u2014 keep typing</div>'
      : '');
}

function addUnit(raw) {
  var key = String(raw || '').trim().toUpperCase();
  if (!key) return;
  var hit = findUnit(key);
  /* Not a unit here, or a unit that is already gone. Kept on screen rather
     than dropped, because a number that vanishes as you type reads as a bug
     and leaves the dealer believing it was accepted. */
  if (!hit || hit.u.s !== 'available') {
    if (SHEET.bad.indexOf(key) < 0) SHEET.bad.push(key);
    return;
  }
  if (sheetAll().indexOf(hit.u.n) >= 0) return;
  SHEET.more.push(hit.u.n);
}

function sheetUnit() {
  if (!SHEET) return null;
  var f = P.floors[SHEET.fi]; if (!f) return null;
  return (f.units || []).filter(function (x) { return x.n === SHEET.n; })[0] || null;
}

function message() {
  var u = sheetUnit(), f = P.floors[SHEET.fi];
  var L = [];
  L.push((P.project || 'Availability') + ' — Reservation Request');
  /* The server's ref, not one invented here. Without it the request did not
     register, and the line says so instead of printing a number nobody holds. */
  L.push(SHEET.ref ? ('Ref: ' + initials(P.project) + '-REQ-' + SHEET.ref)
                   : 'Ref: not registered \u2014 please confirm in the group');
  L.push('');
  /* One unit reads as it always did. Several are listed by number, and the
     floor and size are dropped rather than printed for the first one only —
     a size line under a list of five is a statement about four units that is
     not true. */
  var mu = sheetFree();
  if (mu.length > 1) {
    L.push('Units (' + mu.length + '): ' + mu.join(', '));
  } else {
    L.push('Unit: ' + SHEET.n);
    L.push('Floor: ' + f.floor_label);
    L.push('Size: ' + (u ? area(u) : '—'));
  }
  var t = chosen();
  if (t) L.push('Asking for: ' + t.label);
  if (askNeedsDays()) {
    L.push('Duration: ' + SHEET.days + ' day' + (SHEET.days === 1 ? '' : 's'));
  }
  if (NAME) L.push('Requested by: ' + NAME);
  L.push('');
  L.push('Please confirm.');
  return L.join('\n');
}

function paintSheet() {
  if (!SHEET) return;
  var u = sheetUnit(), f = P.floors[SHEET.fi];
  var gone = !u || u.s !== 'available';

  var all = sheetAll(), many = all.length > 1;

  $('sheet').innerHTML =
    '<div class="sh-h"><div>' +
      '<div class="sh-n" id="sh-n">' +
        (many ? all.length + ' units' : esc(SHEET.n)) + '</div>' +
      '<div class="sh-m">' +
        (many
          ? 'Asked for together \u2014 one request, one answer'
          /* the same three things the plate prints on the shop itself */
          : [esc(f.floor_label), u && u.t ? esc(u.t) : '', u && area(u) ? esc(area(u)) : '']
              .filter(Boolean).join(' · ')) +
      '</div>' +
      /* WHAT IT COSTS, on its own line. For one shop it is that shop's total;
         for six asked together it is what the six come to, because a dealer
         wants one figure and not six to add up on a phone. */
      (function () {
        var t = many ? totalOf(sheetFree()) : (u ? Number(u.v) : 0);
        var m = money(t);
        return m ? '<div class="sh-p">' + esc(m) +
                   (many ? ' <span style="font-size:13px;color:var(--mut)">for all ' +
                           sheetFree().length + '</span>' : '') + '</div>' : '';
      })() +
    '</div><button class="sh-x" id="sh-x" aria-label="Close">✕</button></div>' +

    '<div class="sh-b">' +
    (gone
      ? '<div class="gone">This unit is no longer available. It was taken while ' +
        'this was open.</div>'
      : /* MORE THAN ONE. The chips only appear once there is more than one
           thing to look at; a dealer taking a single shop sees the box and
           nothing else, exactly as before. */
        ((many || SHEET.bad.length)
          ? '<div class="sh-l">Units</div>' +
            '<div class="uc-r" id="uc-r">' +
              all.map(function (n, i) {
                var h = findUnit(n), ok = h && h.u.s === 'available';
                return '<span class="uc' + (ok ? '' : ' bad') + '">' + esc(n) +
                  (i === 0 ? '' : '<button type="button" data-x="' + esc(n) + '">\u00d7</button>') +
                '</span>';
              }).join('') +
              SHEET.bad.map(function (n) {
                return '<span class="uc bad">' + esc(n) +
                  '<button type="button" data-b="' + esc(n) + '">\u00d7</button></span>';
              }).join('') +
            '</div>'
          : '') +
        '<input class="uc-in" id="uc-in" autocomplete="off" autocapitalize="characters" ' +
          'spellcheck="false" placeholder="Type a letter \u2014 e.g. G \u2014 or paste a list">' +
        '<div class="uc-sg" id="uc-sg" hidden></div>' +
        (SHEET.bad.length
          ? '<div class="uc-s"><b>' + SHEET.bad.length + '</b> of those ' +
            (SHEET.bad.length === 1 ? 'is not available' : 'are not available') +
            ' \u2014 they will not be sent.</div>'
          : (many ? '<div class="uc-s">All <b>' + all.length +
                    '</b> will be asked for together.</div>' : '')) +
        (choices().length > 1
          ? '<div class="sh-l">What do you need?</div>' +
            '<div class="ask-k' + (choices().length % 2 === 0 ? ' two' : '') + '" id="ask-k">' +
              choices().map(function (c) {
                return '<button data-c="' + esc(c.id) + '"' +
                  (chosen() && chosen().id === c.id ? ' class="on"' : '') + '>' +
                  esc(c.label) + '</button>';
              }).join('') +
            '</div>'
          : '') +
        (askNeedsDays()
          ? '<div class="sh-l">Hold for</div>' +
        '<div class="dur" id="dur">' +
          [1, 3, 7].map(function (d) {
            return '<button data-d="' + d + '"' + (SHEET.days === d ? ' class="on"' : '') +
                   '>' + d + ' day' + (d === 1 ? '' : 's') + '</button>';
          }).join('') +
          /* Anything else the rep needs. inputmode=numeric so a phone opens the
             number pad rather than a keyboard. */
          '<input id="dcust" inputmode="numeric" maxlength="2" placeholder="\u2026" ' +
            'title="Any number of days, 1 to 90" ' +
            (CUSTOM(SHEET.days) ? 'class="on" value="' + SHEET.days + '"' : '') + '>' +
        '</div>'
          /* Nothing greyed out and nothing to ignore: a permanent ask simply
             does not have a duration, so the question is not on the screen. */
          : '<div class="ask-n">No end date \u2014 the desk decides and confirms.</div>')) +
    '</div>' +

    '<div class="acts">' +
      '<button id="wa" class="prim"' + (gone ? ' disabled' : '') + '>Done \u2014 send on WhatsApp</button>' +
      '<button id="cx">Cancel</button>' +
    '</div>' +
    '<div class="go-n">The unit is only held once you receive a confirmation.</div>';

  $('sh-x').onclick = closeSheet;
  /* Outside the not-gone branch on purpose: a unit that has just been taken
     still needs a way out of this sheet. */
  var cxb = $('cx'); if (cxb) cxb.onclick = closeSheet;
  if (!gone) {
    /* GUARDED, because a permanent ask has no duration and therefore no
       #dur to wire. Unguarded it threw here and took every listener below
       it with it — including the choice row, so the sheet stopped
       responding the moment somebody picked Sold. */
    var durb = $('dur');
    if (durb) durb.onclick = function (e) {
      var b = e.target.closest('button[data-d]'); if (!b) return;
      SHEET.days = Number(b.getAttribute('data-d'));
      var cu = $('dcust'); if (cu) { cu.value = ''; cu.classList.remove('on'); }
      markDur();
    };
    var cust = durb ? $('dcust') : null;
    if (cust) cust.addEventListener('input', function () {
      /* Out of range does not silently become something else: the box keeps
         what was typed until it is a number this can honour, and the chips
         only let go once it is. */
      var n = parseInt(cust.value, 10);
      if (!(n >= 1 && n <= 90)) { cust.classList.remove('on'); return; }
      SHEET.days = n;
      markDur();
    });
    /* Leaving an unusable number behind would send a duration nobody chose. */
    if (cust) cust.addEventListener('blur', function () {
      var n = parseInt(cust.value, 10);
      if (!(n >= 1 && n <= 90)) { cust.value = ''; cust.classList.remove('on'); markDur(); }
    });
    /* One action. It registers the request and hands the dealer the message
       in the same tap — there is nothing else here to press. */
    var kb = $('ask-k');
    if (kb) kb.onclick = function (e) {
      var b = e.target.closest('button[data-c]'); if (!b) return;
      SHEET.choice = b.getAttribute('data-c');
      var t = chosen();
      /* Each choice brings its own default: a permanent one has none, and a
         timed one arrives on the number the tenant set for it. */
      SHEET.days = (t && t.nature === 'permanent') ? null
                 : Number((t && t.days) || 7);
      paintSheet();
    };
    /* One number per separator, and a pasted list arrives as a single input
       event, so forty units land in one gesture. */
    var mi = $('uc-in');
    if (mi) {
      mi.addEventListener('input', function () {
        if (absorbUnits(mi)) {
          var keep = mi.value; paintSheet();
          var m2 = $('uc-in');
          if (m2) { m2.value = keep; try { m2.focus(); } catch (e) {} }
          paintUnitList(keep);
          return;
        }
        paintUnitList(mi.value);
      });
      mi.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        var t = String(mi.value || '').trim();
        if (!t) return;
        addUnit(t); mi.value = ''; paintSheet();
        var m3 = $('uc-in'); if (m3) { try { m3.focus(); } catch (e2) {} }
      });
    }
    /* A TAP IS A SELECTION. The typed letters stay where they are and the list
       comes back without the unit just taken, so six shops are six taps rather
       than six rounds of typing a number and a comma. */
    var sg = $('uc-sg');
    if (sg) sg.onclick = function (e) {
      var b = e.target.closest('button[data-u]'); if (!b) return;
      var keep = String(($('uc-in') || {}).value || '');
      addUnit(b.getAttribute('data-u'));
      paintSheet();
      var el = $('uc-in');
      if (el) { el.value = keep; try { el.focus(); } catch (e2) {} }
      paintUnitList(keep);
    };
    var ur = $('uc-r');
    if (ur) ur.onclick = function (e) {
      var b = e.target.closest('button[data-x],button[data-b]'); if (!b) return;
      var x = b.getAttribute('data-x');
      if (x) SHEET.more = SHEET.more.filter(function (n) { return n !== x; });
      else { var y = b.getAttribute('data-b');
             SHEET.bad = SHEET.bad.filter(function (n) { return n !== y; }); }
      paintSheet();
    };
    $('wa').onclick = function () { requestAndSend('wa'); };
  }
}

/* THE REQUEST REACHES THE DESK, and the WhatsApp message is the receipt.

   The row is written FIRST so the Ref printed in the message is the one the
   desk holds — a ref invented here and never registered would be a number the
   dealer reads out that nobody can find.

   If the write fails, the message still goes. That is exactly how this worked
   before the queue existed, so a dealer is never blocked by our server being
   unreachable — but the message says so, and a toast says so, rather than
   letting them believe a request is waiting when it is not. */
var SENDING = false;
async function submitRequest() {
  if (!SHEET) return null;
  /* SEVERAL UNITS TAKE THE ARRAY CALL, one takes the call it always took.
     Both write the same rows into the same queue; the batch simply stamps a
     shared ref on them so the desk can answer them in one tap instead of
     five. Neither reserves anything — a director still decides. */
  if (sheetFree().length > 1) return submitMany();
  try {
    var r = await sb.rpc('submit_availability_request', {
      p_token: TOKEN, p_unit_no: SHEET.n, p_days: SHEET.days, p_name: NAME || null,
      /* An ASK, not a decision. The server re-derives it against this link's
         own project and a director still applies it. */
      p_status_id: SHEET.choice || null });
    var d = r && r.data;
    if (d && d.success) {
      SHEET.ref = d.ref;
      var list = readReqs().filter(function (x) { return x.ref !== d.ref; });
      list.unshift({ ref: d.ref, unit: SHEET.n, days: SHEET.days, status: 'pending',
                     /* kept beside the ref so a permanent ask, which has no
                        number of days, still reads as a sentence here. */
                     asked: d.asked || null });
      REQS = list; writeReqs(list); paintMyReqs();
      return { ok: true, already: !!d.already };
    }
    return { ok: false, error: (d && d.error) || 'failed',
             message: (d && d.message) || null };
  } catch (e) { return { ok: false, error: 'offline' }; }
}

async function submitMany() {
  var units = sheetFree();
  try {
    var r = await sb.rpc('submit_availability_requests', {
      p_token: TOKEN, p_unit_nos: units, p_days: SHEET.days, p_name: NAME || null,
      p_status_id: SHEET.choice || null });
    var d = r && r.data;
    if (!d || !d.ok) {
      /* Every one of them refused is not a server failure, and telling the
         dealer to confirm in the group would send them chasing units that are
         gone. It says what happened instead. */
      var none = d && d.success === false && Number(d.failed) > 0;
      return { ok: false, error: none ? 'none_free' : ((d && d.error) || 'failed'),
               message: none ? 'None of those units is available any more.'
                             : ((d && d.message) || null) };
    }
    /* The batch ref is what the desk shows on the card, so it is the number
       the dealer should be able to read out. */
    SHEET.ref = d.batch || null;
    var rows = (d.results || []).filter(function (x) { return x.success; });
    var list = readReqs();
    rows.forEach(function (x) {
      list = list.filter(function (y) { return y.ref !== x.ref; });
      list.unshift({ ref: x.ref, unit: x.unit_no, days: SHEET.days, status: 'pending',
                     batch: d.batch || null, asked: x.asked || null });
    });
    REQS = list; writeReqs(list); paintMyReqs();
    /* Some of them may have been spoken for a minute ago. The ask still went
       in for the rest, and the count says which. */
    return { ok: true, many: rows.length, missed: units.length - rows.length };
  } catch (e) { return { ok: false, error: 'offline' }; }
}

async function requestAndSend(how) {
  if (!SHEET || SENDING) return;
  /* If the name was skipped earlier, ask HERE — this is the moment it means
     something, and the desk is useless without it. Once given it is final,
     the same as if it had been given on the first screen. */
  if (!NAME) { askNameInSheet(how); return; }

  SENDING = true;
  var go = document.getElementById('wa');
  var goWas = go ? go.textContent : '';
  if (go) { go.disabled = true; go.textContent = 'Sending\u2026'; }
  var res = await submitRequest();
  SENDING = false;
  if (go) { go.disabled = false; go.textContent = goWas; }

  if (res && !res.ok) {
    if (res.error === 'unit_unavailable') { toast('That unit has just been taken.'); return refreshSheet(); }
    if (res.error === 'queue_full' || res.error === 'too_many') { toast(res.message); return; }
    if (res.error === 'none_free') { toast(res.message); return refreshSheet(); }
    if (res.error === 'not_available') { toast('This link is no longer active.'); return; }
    /* offline or unknown: send anyway, and say the desk has not got it */
    toast('Sent, but the desk has not registered it \u2014 please confirm in the group.');
    SHEET.ref = null;
  } else if (res && res.already) {
    toast('A request for this unit is already waiting.');
  } else if (res && res.missed) {
    toast(res.missed + ' of those had already gone \u2014 the rest are in.');
  }
  if (how === 'copy') {
    window._portalCopy(message(),
      'Request copied \u2014 paste it into the group.',
      'Could not copy. Select the text and copy it by hand.');
  } else { sendWhatsApp(); }

  /* AN ENDING, NOT AN ABSENCE. The sheet closing on its own reads as a
     dismissal; a second of confirmation first tells the dealer the ask is
     registered and what the number is. Only when the desk actually has it. */
  if (res && res.ok && SHEET && SHEET.ref) { showSent(); return; }
  paintSheet();
}

function showSent() {
  var host = document.getElementById('sheet');
  var ref = initials(P && P.project) + '-REQ-' + (SHEET.ref || '');
  var n = sheetFree().length;
  host.innerHTML =
    '<div class="done">' +
      '<div class="done-k"><i></i></div>' +
      '<div class="done-t">Request sent</div>' +
      '<div class="done-s">' +
        (n > 1 ? n + ' units' : esc(SHEET.n)) + ' \u00b7 ' + esc(ref) + '<br>' +
        'The desk will confirm. ' +
        (n > 1 ? 'They are not held until they do.' : 'The unit is not held until they do.') +
      '</div>' +
    '</div>';
  SENT_T = setTimeout(function () { if (SHEET) closeSheet(); }, 1600);
}

function askNameInSheet(how) {
  var host = document.getElementById('sheet');
  if (document.getElementById('ask-in')) { document.getElementById('ask-in').focus(); return; }
  var box = document.createElement('div');
  box.className = 'ask';
  box.innerHTML =
    '<div class="ask-t">Your name, so the desk knows who asked</div>' +
    '<div class="ask-r"><input id="ask-in" type="text" autocomplete="name" ' +
      'placeholder="e.g. Fawad khan"><button class="go" id="ask-ok" ' +
      'style="width:auto;margin:0;padding:0 18px;height:42px">Save</button></div>';
  host.appendChild(box);
  var input = document.getElementById('ask-in');
  try { input.focus(); } catch (e) {}
  function save() {
    var v = String(input.value || '').trim();
    if (!v) { try { input.focus(); } catch (e) {} return; }
    NAME = v; writeName(v); markAsked(); paintNameAsk();
    box.remove();
    requestAndSend(how);
  }
  document.getElementById('ask-ok').onclick = save;
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
  });
}

function sendWhatsApp() {
  /* No number in the URL, so WhatsApp asks which chat — the dealer picks their
     own group. On desktop this opens a page that may do nothing visible, which
     is exactly why Copy sits beside it at the same size rather than behind a
     failure. */
  var url = 'https://wa.me/?text=' + encodeURIComponent(message());
  try { window.open(url, '_blank', 'noopener'); } catch (e) { location.href = url; }
}

/* A refetch can land while the sheet is open. If the unit went in the meantime
   the sheet must say so and the button must stop working — sending a request
   for a unit that is already gone wastes a reply from the desk. */
function refreshSheet() { paintSheet(); }

/* ── wiring ──────────────────────────────────────────────────────────────── */
$('q').addEventListener('input', runSearch);
$('res').addEventListener('click', function (e) {
  var b = e.target.closest('.res-r'); if (!b || b.disabled) return;
  var hits = $('res').__hits || [];
  var r = hits[Number(b.getAttribute('data-i'))]; if (!r) return;
  openSheet(r.u.n, r.fi);
});
$('floors').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-f]'); if (!b) return;
  FLOOR = Number(b.getAttribute('data-f'));
  SHOWALL = false;
  $('q').value = ''; runSearch();
  renderFloor();
  window.scrollTo(0, 0);
});
/* The chip lives inside the floor grid, so its click arrives on the same
   listener; it is read first because it carries no data-f. */
$('allrow').addEventListener('click', function (e) {
  if (!e.target.closest('[data-all]')) return;
  ALLV = true; FLOOR = null; renderAll(); window.scrollTo(0, 0);
});

$('mine-back').onclick = function () {
  MINEV = false; BACKING = true;
  renderHome(); window.scrollTo(0, 0);
};

$('pv-plan').onclick = function () { PLANV = true; renderFloor(); window.scrollTo(0, 0); };
$('pv-list').onclick = function () { PLANV = false; renderFloor(); window.scrollTo(0, 0); };

/* ══ THE PLATE IS LONG AND NARROW ═══════════════════════════════════════════
   At the width of a phone a shop is about ten pixels across: enough to see,
   not enough to read or to hit. So the drawing grows and the box scrolls
   sideways, and because a two-thousand-pixel plate is a thing you travel
   across rather than look at, it can be dragged as well as scrolled. */
var PANNED = false;                 // the last gesture was a drag, not a tap
function setZoom(z) {
  var box = $('pv'), el = $('pv-in');
  z = Math.max(1, Math.min(5, Math.round(z * 2) / 2));
  if (!el) return;
  /* keep whatever is in the middle of the window in the middle of it */
  var mid = (box.scrollLeft + box.clientWidth / 2) / Math.max(1, el.offsetWidth);
  PLANZ = z;
  el.style.width = (PLANZ * 100) + '%';
  $('pv-zoom').textContent = Math.round(PLANZ * 100) + '%';
  box.classList.toggle('grab', PLANZ > 1);
  box.scrollLeft = mid * el.offsetWidth - box.clientWidth / 2;
}
$('pv-plus').onclick = function () { PLANZSET = true; setZoom(PLANZ + (PLANZ < 2 ? 0.5 : 1)); };
$('pv-out').onclick  = function () { PLANZSET = true; setZoom(PLANZ - (PLANZ <= 2 ? 0.5 : 1)); };

/* THE LEGEND IS THE FILTER, and now there is one key per kind of hold. Rashid
   asked for it in the same breath as the statuses: "ooper aik jaisay aik Not
   available ka button hai osi tarhan ab har aik ka aik button banao jisay
   click karnay pe wohi bataye \u2014 suppose mai ne select kia reserve to muje just
   reserved bataye".

   So a tap ISOLATES: press Sold and the floor shows the sold ones and steps
   everything else back. Press it again and the whole floor comes back. Nothing
   is ever removed \u2014 what is taken is still an answer \u2014 and pressing the last
   remaining key on cannot leave the plate saying nothing. */
function planKeys() {
  var f = P && P.floors && P.floors[FLOOR];
  var units = (f && f.units) || [];
  var free = units.filter(function (u) { return u.s === 'available'; }).length;
  var rows = [{ key: 'free', label: 'available', n: free, tint: '' }].concat(tally(units));
  $('k-keys').innerHTML = rows.map(function (r) {
    return '<button class="key ' + (r.key === 'free' ? 'free' : 'held') +
      (PLANF[r.key] === false ? ' off' : '') + '" data-k="' + esc(r.key) + '"' +
      (r.tint ? ' style="--t:' + r.tint + '"' : '') + '>' +
      '<i></i><b>' + r.n + '</b>&nbsp;' + esc(r.label.toLowerCase()) + '</button>';
  }).join('');
}
function planShown() {
  /* every key that is not switched off; with none off, everything shows */
  var host = $('pv-in'); if (!host) return;
  [].forEach.call(host.querySelectorAll('[data-k]'), function (el) {
    el.classList.toggle('dim', PLANF[el.getAttribute('data-k')] === false);
  });
}
function planFilter(k) {
  var keys = [].map.call($('k-keys').children, function (b) { return b.getAttribute('data-k'); });
  var alone = keys.every(function (x) { return x === k ? PLANF[x] !== false : PLANF[x] === false; });
  keys.forEach(function (x) { PLANF[x] = alone ? true : (x === k); });
  planKeys();
  planShown();
}
$('k-keys').onclick = function (e) {
  var b = e.target.closest('button[data-k]');
  if (b) planFilter(b.getAttribute('data-k'));
};

/* find, on the plate rather than in a list */
var PQT;
$('pv-q').addEventListener('input', function () {
  clearTimeout(PQT);
  var v = this.value;
  PQT = setTimeout(function () { findOnPlan(v); }, 160);
});

/* DRAG TO TRAVEL. Only sideways, and only once the plate is wider than the
   window: a vertical drag belongs to the page, and taking it would trap a
   reader halfway down a building. Nothing is captured \u2014 pointer capture on
   the box would swallow the taps meant for the shops inside it. */
(function () {
  var box = $('pv'), d = null;
  box.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    PANNED = false;
    d = { x: e.clientX, y: e.clientY, l: box.scrollLeft };
  });
  box.addEventListener('pointermove', function (e) {
    if (!d) return;
    var dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (!PANNED && (Math.abs(dx) < 6 || Math.abs(dx) < Math.abs(dy))) return;
    if (box.scrollWidth <= box.clientWidth + 1) return;
    PANNED = true;
    box.classList.add('grabbing');
    box.scrollLeft = d.l - dx;
    e.preventDefault();
  });
  function done() { d = null; box.classList.remove('grabbing');
                    setTimeout(function () { PANNED = false; }, 0); }
  box.addEventListener('pointerup', done);
  box.addEventListener('pointercancel', done);
  box.addEventListener('pointerleave', done);
})();

$('all-back').onclick = function () {
  ALLV = false; BACKING = true;
  renderHome(); window.scrollTo(0, 0);
};

/* ── THE DIRECTORS' ROOM ──────────────────────────────────────────────────
   One call, get_availability_report(token, password), and everything below is
   presentation. The password is held in a variable and nowhere else: not in
   localStorage, not in the URL, not in the name card. Close the tab and the
   room shuts, which is the behaviour a password on a forwarded link has to
   have. */
var REPV = false, REP = null;
/* WHICH PAGE OF THE ROOM IS OPEN. The first screen is short on purpose —
   Rashid read the first cut and said so: "mai professional ho k confuse ho gaya
   hun to mere directors to non professional hain". So it carries four things,
   and every one of them is a door: tap a kind, a name, the line about what is
   ending, or the floors, and that page opens with the units themselves on it.
   Nothing is fetched again: the report already came with them. */
var REPP = { view: 'home', key: '' };

function pkr(v) {
  var n = Number(v) || 0;
  /* Crores and lakhs, because that is how the number is said in the room it is
     read in. Under a lakh it is written out in full. */
  if (n >= 1e7) return (n / 1e7).toFixed(n >= 1e8 ? 0 : 2) + ' cr';
  if (n >= 1e5) return (n / 1e5).toFixed(n >= 1e6 ? 0 : 1) + ' lac';
  return n.toLocaleString('en-US', { maximumFractionDigits: 0 });
}
function num(v) { return (Number(v) || 0).toLocaleString('en-US'); }
/* one unit is not "1 units" */
function units(n) { return num(n) + ' unit' + (Number(n) === 1 ? '' : 's'); }
function held() { return (REP && REP.units) || []; }
function dayOf(s) {
  if (!s) return '';
  return new Date(s).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
}
function daysTo(s) {
  if (!s) return null;
  return Math.round((new Date(s).getTime() - Date.now()) / 86400000);
}
function sum(rows, k) { return rows.reduce(function (t, r) { return t + (Number(r[k]) || 0); }, 0); }
function kindsOf(rows) {
  var by = {};
  rows.forEach(function (r) { by[r.k] = (by[r.k] || 0) + 1; });
  return by;
}
function kindPills(by) {
  return Object.keys(by || {})
    .sort(function (x, y) { return by[y] - by[x]; })
    .map(function (k) {
      return '<span class="pill" style="--t:' + tint(skey(k)) + '">' + esc(k) + ' ' + by[k] + '</span>';
    }).join('');
}
function endingSoon() {
  return held().filter(function (r) {
    var d = daysTo(r.e); return d !== null && d <= 7;
  }).sort(function (x, y) { return new Date(x.e) - new Date(y.e); });
}

/* ── THE DISCLAIMER ───────────────────────────────────────────────────────
   Rashid asked for the strongest one there is, and for a reason worth writing
   down: this page is forwarded, and a page that lists a unit as "Sold" beside
   a rupee figure will be read by somebody as a receipt. It is not. It is the
   desk's own working note of what is off the market today, nothing has been
   verified against a bank, and every line on it can change without notice.
   It goes at the foot of every page in this room, including the printed one —
   there is no page a director can share that does not carry it. */
function disclaimer(d) {
  return '<div class="dis">' +
    '<div class="dis-h">Read this before you act on anything above</div>' +
    '<ul>' +
      '<li>This is <b>not a confirmation, an allotment, a receipt or an agreement</b>. ' +
        'It confirms nothing to anybody and creates no right over any unit.</li>' +
      '<li><b>It is not a record of money.</b> No amount shown here has been received, ' +
        'verified, reconciled or banked. The figures are the register’s asking values, ' +
        'not payments, not dues, and not a statement of account.</li>' +
      '<li><b>“Sold” here does not mean paid.</b> It is a working label the desk puts on a ' +
        'unit that is off the market. It does not mean a sale is complete, that any ' +
        'instalment has come in, or that any document has been signed.</li>' +
      '<li><b>“Hold”, “Pagri”, “Reserve” carry no guarantee.</b> A hold can lapse, be ' +
        'released or be cancelled at any time, with or without notice, and a unit shown ' +
        'against a name may be given to somebody else.</li>' +
      '<li>The names shown are only <b>who asked for the unit</b> — they are not owners, ' +
        'buyers, or parties to anything.</li>' +
      '<li>This page is a <b>working snapshot taken at the moment it was opened</b> and may ' +
        'already be out of date. Nothing here supersedes the company’s own books, ' +
        'agreements or receipts, which are the only record that counts.</li>' +
      '<li><b>Internal use only.</b> It carries commercial information about the project ' +
        'and is not for onward circulation.</li>' +
    '</ul>' +
    '<div class="dis-f">' + esc(d.project) + ' · ' + esc(d.company) +
      ' · snapshot ' + new Date(d.as_of).toLocaleString('en-US') + '</div>' +
  '</div>';
}

/* the head of the printed sheet — invisible on screen, the letterhead on paper */
function printHead(d, title) {
  return '<div class="pr-h">' +
    '<div class="pr-t">' + esc(d.company) + '</div>' +
    '<div class="pr-p">' + esc(d.project) + ' · ' + esc(title) + '</div>' +
    '<div class="pr-d">Snapshot taken ' + new Date(d.as_of).toLocaleString('en-US') + '</div>' +
  '</div>';
}
function repTools(title) {
  /* PRINT, WHICH IS ALSO SAVE AS PDF. No library: the browser's own print is
     the one route on every phone and every desktop, and it is what the rest of
     this system uses for its documents. */
  return '<div class="rp-x"><div class="rp-x-t">' + esc(title) + '</div>' +
    '<button class="rp-pdf" id="rep-pdf">Save as PDF</button></div>';
}

function showRep() {
  REPV = true;
  ['home', 'all', 'mine', 'floor'].forEach(function (id) { $(id).hidden = true; });
  /* the card that asks a dealer's name is screen one's furniture, and a
     director reading the building is not being asked to introduce himself */
  $('name-ask').hidden = true;
  $('rep').hidden = false;
  $('rep-gate').hidden = !!REP;
  $('rep-body').innerHTML = REP ? repRender() : '';
  $('rep-as').textContent = REP ? 'as of ' + hhmm(new Date(REP.as_of).getTime()) : '';
  if (!REP) setTimeout(function () { $('dir-pw').focus(); }, 60);
}
async function repOpen() {
  var pw = $('dir-pw').value.trim();
  var err = $('dir-err');
  if (!pw) { err.hidden = false; err.textContent = 'Enter the password.'; return; }
  $('dir-go').disabled = true;
  try {
    var r = await sb.rpc('get_availability_report', { p_token: TOKEN, p_password: pw });
    var d = r.data;
    if (!d || !d.success) {
      err.hidden = false;
      err.textContent = (d && d.error === 'too_many')
        ? 'Too many tries on this link. It opens again in an hour.'
        : 'That password does not open this.';
      $('dir-pw').value = '';
      return;
    }
    REP = d; REPP = { view: 'home', key: '' };
    $('dir-pw').value = ''; err.hidden = true;
    showRep(); window.scrollTo(0, 0);
  } catch (e) {
    err.hidden = false; err.textContent = 'Could not reach the office. Try again.';
  } finally { $('dir-go').disabled = false; }
}
$('dir-open').onclick = function () { showRep(); window.scrollTo(0, 0); };
$('dir-go').onclick = repOpen;
$('dir-pw').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); repOpen(); }
});
$('rep-back').onclick = function () {
  /* one step back inside the room before leaving it */
  if (REP && REPP.view !== 'home') {
    REPP = { view: 'home', key: '' };
    $('rep-body').innerHTML = repRender();
    window.scrollTo(0, 0);
    return;
  }
  REPV = false; BACKING = true;
  $('rep').hidden = true;
  paintNameAsk();
  renderHome(); window.scrollTo(0, 0);
};
$('rep-body').addEventListener('click', function (e) {
  if (e.target.closest('#rep-pdf')) { window.print(); return; }
  var go = e.target.closest('[data-go]');
  if (!go) return;
  REPP = { view: go.getAttribute('data-go'), key: go.getAttribute('data-key') || '' };
  $('rep-body').innerHTML = repRender();
  window.scrollTo(0, 0);
});

function repRender() {
  var d = REP;
  if (REPP.view === 'person') return repPeoplePage(d, REPP.key);
  if (REPP.view === 'kind')   return repKindPage(d, REPP.key);
  if (REPP.view === 'ending') return repEndingPage(d);
  if (REPP.view === 'floors') return repFloorPage(d);
  return repHome(d);
}

/* ── THE FIRST SCREEN — FOUR THINGS AND A WAY INTO EACH ──────────────────── */
function repHome(d) {
  var t = d.totals, i = d.insights || {}, rows = held();
  var gone = Number(t.held) || 0;
  var by = d.by_status || [];
  var people = d.by_person || [];
  var soon = endingSoon();
  var H = ['<div class="rp">'];

  H.push(printHead(d, 'Position summary'));
  H.push('<h2>Where the building stands</h2><div class="big">' +
    '<div class="b"><div class="bn">' + num(t.available) + '</div>' +
      '<div class="bl">still available, of ' + num(t.units) + '</div>' +
      '<div class="bs">PKR ' + pkr(t.value_free) + ' unsold</div></div>' +
    '<div class="b"><div class="bn">' + num(gone) + '</div>' +
      '<div class="bl">taken, by ' + num(t.holders) + ' ' +
        (Number(t.holders) === 1 ? 'person' : 'people') + '</div>' +
      '<div class="bs">PKR ' + pkr(t.value_held) + ' committed</div></div>' +
    '</div>');

  H.push('<h2>What is holding it</h2><div class="rows">' +
    by.map(function (s) {
      return '<button class="row" data-go="kind" data-key="' + esc(s.kind) + '" ' +
        'style="--t:' + tint(skey(s.kind)) + '">' +
        '<span class="r-d"></span>' +
        '<span class="r-m"><span class="r-t">' + esc(s.kind) + '</span>' +
          '<span class="r-s">PKR ' + pkr(s.value) + '</span></span>' +
        '<span class="r-n">' + num(s.units) + '</span><span class="r-a"></span></button>';
    }).join('') + '</div>' +
    (gone ? '<div class="say">' + ((i.ageing && Number(i.ageing.d31_60) + Number(i.ageing.d60) > 0)
        ? 'PKR <b>' + pkr(i.ageing.value_over_30) + '</b> has been off the market for more than a month.'
        : 'Nothing has been held longer than a month.') + '</div>' : ''));

  H.push('<h2>Who is holding it</h2><div class="rows">' +
    people.map(function (p) {
      var share = gone ? Math.round(p.units * 1000 / gone) / 10 : 0;
      return '<button class="row" data-go="person" data-key="' + esc(p.who) + '">' +
        '<span class="r-m"><span class="r-t">' + esc(p.who) + '</span>' +
          '<span class="r-s">PKR ' + pkr(p.value) + ' · ' + share + '% of what is taken</span>' +
          '<span class="sh"><i style="width:' + share + '%"></i></span></span>' +
        '<span class="r-n">' + num(p.units) + '</span><span class="r-a"></span></button>';
    }).join('') + '</div>');

  H.push('<h2>Worth a look</h2><div class="rows">' +
    '<button class="row" data-go="ending">' +
      '<span class="r-m"><span class="r-t">' +
        (soon.length ? soon.length + ' hold' + (soon.length === 1 ? '' : 's') + ' end within 7 days'
                     : 'Nothing ends within 7 days') + '</span>' +
        '<span class="r-s">' + (soon.length
          ? 'PKR ' + pkr(sum(soon, 'v')) + ' comes back to the floor unless renewed'
          : 'no hold runs out this week') + '</span></span>' +
      '<span class="r-a"></span></button>' +
    '<button class="row" data-go="floors">' +
      '<span class="r-m"><span class="r-t">What each floor is worth</span>' +
        '<span class="r-s">floor by floor: worth, what is on the shelf, what is committed</span></span>' +
      '<span class="r-a"></span></button>' +
    '</div>');

  H.push(repTools('Position summary'));
  H.push(disclaimer(d));
  H.push('</div>');
  return H.join('');
}

/* ── ONE TABLE, WRITTEN ONCE ──────────────────────────────────────────────
   The unit list is the same list on every page behind the first one; only the
   slice and the heading change. Columns are spaced rather than crammed — the
   first cut ran the numbers into each other and Rashid said so. */
/* ── ONE TABLE, WRITTEN ONCE ──────────────────────────────────────────────
   The unit list is the same list on every page behind the first one; only the
   slice and the second column change. ONE LINE PER CELL and four columns: the
   first cut stacked a second line under the unit number and it fell out of its
   own column on a phone — "sab values aik dosray k bohat qaareeb placed hain".
   Nothing wraps, nothing leans, and what a cell cannot show it does not try to
   show. */
function unitTable(rows, opts) {
  opts = opts || {};
  var U = (REP && REP.area_unit) || 'sqft';
  return '<div class="card"><table class="ut">' +
    '<colgroup><col class="c-u"><col class="c-w"><col class="c-v"><col class="c-e"></colgroup>' +
    '<tr><th>Unit</th><th>' + (opts.who ? 'Held by' : 'Floor') + '</th>' +
      '<th>Value</th><th>Ends</th></tr>' +
    rows.map(function (r) {
      var d = daysTo(r.e);
      return '<tr><td class="nm">' + esc(r.n) + '</td>' +
        '<td class="w">' + (opts.who ? esc(r.w || '—') : esc(r.f)) + '</td>' +
        '<td class="n">' + pkr(r.v) + '</td>' +
        '<td class="n' + (d !== null && d <= 7 ? ' warn' : '') + '">' +
          (r.e ? shortDay(r.e) : '<span class="mut">open</span>') + '</td></tr>';
    }).join('') +
    '<tr class="tot"><td>' + num(rows.length) + '</td>' +
      '<td class="w">' + (opts.who ? 'units' : num(Math.round(sum(rows, 'a'))) + ' ' + esc(U)) + '</td>' +
      '<td class="n">' + pkr(sum(rows, 'v')) + '</td><td></td></tr>' +
    '</table>' +
    '<div class="say">Value is the register’s asking price for the unit. ' +
      '“Open” means the hold carries no end date and does not lapse on its own.</div>' +
  '</div>';
}
/* short enough to sit in its column on a 380px phone, and unambiguous */
function shortDay(s) {
  var d = new Date(s);
  return d.toLocaleDateString('en-US', { day: 'numeric', month: 'short' }) +
         " '" + String(d.getFullYear()).slice(2);
}

function repPeoplePage(d, who) {
  var rows = held().filter(function (r) { return (r.w || '') === who; });
  var by = kindsOf(rows);
  var gone = Number(d.totals.held) || 0;
  var share = gone ? Math.round(rows.length * 1000 / gone) / 10 : 0;
  var soon = rows.filter(function (r) { var x = daysTo(r.e); return x !== null && x <= 7; });
  var floors = {};
  rows.forEach(function (r) { floors[r.f] = (floors[r.f] || 0) + 1; });
  return '<div class="rp">' + printHead(d, 'Units held by ' + who) +
    '<h2>' + esc(who || 'Not recorded') + '</h2>' +
    '<div class="card"><div class="p-h">' +
      '<div><b>' + units(rows.length) + '</b> · <b>PKR ' + pkr(sum(rows, 'v')) + '</b> · ' +
        num(Math.round(sum(rows, 'a'))) + ' ' + esc(d.area_unit || 'sqft') + '</div>' +
      '<div class="p-p">' + kindPills(by) + '</div>' +
      '<div class="say">' + share + '% of everything taken in this project, across ' +
        Object.keys(floors).length + ' floor' + (Object.keys(floors).length === 1 ? '' : 's') +
        (soon.length ? ' · <b>' + soon.length + '</b> ending within 7 days' : '') +
      '</div></div></div>' +
    '<h2>Every unit</h2>' + unitTable(rows, { who: false }) +
    repTools('Units held by ' + who) + disclaimer(d) + '</div>';
}

function repKindPage(d, kind) {
  var rows = held().filter(function (r) { return r.k === kind; });
  var people = {};
  rows.forEach(function (r) { people[r.w || '—'] = (people[r.w || '—'] || 0) + 1; });
  var names = Object.keys(people).sort(function (x, y) { return people[y] - people[x]; });
  return '<div class="rp">' + printHead(d, kind + ' — every unit') +
    '<h2><span class="pill" style="--t:' + tint(skey(kind)) + '">' + esc(kind) + '</span></h2>' +
    '<div class="card"><div class="p-h">' +
      '<div><b>' + units(rows.length) + '</b> · <b>PKR ' + pkr(sum(rows, 'v')) + '</b></div>' +
      '<div class="say">' + names.map(function (n) {
        return '<b>' + esc(n) + '</b> ' + people[n];
      }).join(' · ') + '</div></div></div>' +
    '<h2>Every unit</h2>' + unitTable(rows, { who: true }) +
    repTools(kind + ' — every unit') + disclaimer(d) + '</div>';
}

function repEndingPage(d) {
  var rows = endingSoon();
  return '<div class="rp">' + printHead(d, 'Ending within seven days') +
    '<h2>Ending within seven days</h2>' +
    '<div class="card"><div class="p-h">' +
      (rows.length
        ? '<div><b>' + num(rows.length) + '</b> holds · <b>PKR ' + pkr(sum(rows, 'v')) + '</b></div>' +
          '<div class="say">These come back to the floor unless somebody renews them. ' +
            'A unit with no end date does not run out on its own.</div>'
        : '<div class="say">Nothing runs out in the next seven days.</div>') +
    '</div></div>' +
    (rows.length ? unitTable(rows, { who: true }) : '') +
    repTools('Ending within seven days') + disclaimer(d) + '</div>';
}

/* ── WHAT EACH FLOOR IS WORTH ─────────────────────────────────────────────
   Rashid asked for a complete worth report, floor by floor, and worth is the
   subject of it: what the floor is worth whole, how much of that is still on
   the shelf, how much is committed. The units, the area and the rate ride
   underneath as the working — a director comparing two floors is comparing
   size and rate, and the rupees are those two multiplied.

   Four columns and a total, with the columns given room. The first cut ran
   them into each other. */
/* ── WHAT EACH FLOOR IS WORTH ─────────────────────────────────────────────
   Rashid asked for a complete worth report, floor by floor, and worth is the
   subject: what the floor is worth whole, how much is still on the shelf, how
   much is committed. Units, area and rate ride underneath as the working — a
   director comparing two floors is comparing size and rate, and the rupees are
   those two multiplied.

   A CARD PER FLOOR, NOT A TABLE ROW. Six numbers about one floor will not sit
   in six columns on a phone without the columns fighting — which is exactly
   what Rashid saw: "sab values aik dosray k bohat qaareeb placed hain". Given
   its own block, each floor has room to say all six plainly. */
function repFloorPage(d) {
  var f = d.by_floor || [];
  var U = d.area_unit || 'sqft';
  var tot = { units: 0, held: 0, avail: 0, value: 0, free: 0, taken: 0, area: 0 };
  f.forEach(function (r) {
    tot.units += Number(r.units) || 0;
    tot.held  += Number(r.held) || 0;
    tot.avail += Number(r.available) || 0;
    tot.value += Number(r.value) || 0;
    tot.free  += Number(r.value_free) || 0;
    tot.taken += Number(r.value_held) || 0;
    tot.area  += Number(r.area) || 0;
  });
  var big = f.reduce(function (m, r) { return Math.max(m, Number(r.value) || 0); }, 0);

  return '<div class="rp">' + printHead(d, 'What each floor is worth') +
    '<h2>What each floor is worth</h2>' +
    '<div class="wl">' + f.map(function (r) {
      var share = big ? Math.round((Number(r.value) || 0) * 100 / big) : 0;
      var takenPc = r.units ? Math.round(r.held * 1000 / r.units) / 10 : 0;
      return '<div class="wf">' +
        '<div class="wf-h"><span class="wf-n">' + esc(r.label) + '</span>' +
          '<span class="wf-v">PKR ' + pkr(r.value) + '</span></div>' +
        '<div class="wf-s">' + units(r.units) + ' · ' +
          num(Math.round(r.area)) + ' ' + esc(U) +
          (r.rate ? ' · ' + num(r.rate) + ' per ' + esc(U) : '') + '</div>' +
        '<div class="sh"><i style="width:' + share + '%"></i></div>' +
        '<div class="wf-g">' +
          '<div><span class="g-l">On the shelf</span>' +
            '<span class="g-v">PKR ' + pkr(r.value_free) + '</span>' +
            '<span class="g-s">' + units(r.available) + '</span></div>' +
          '<div><span class="g-l">Taken</span>' +
            '<span class="g-v">' + (Number(r.value_held) ? 'PKR ' + pkr(r.value_held) : '—') + '</span>' +
            '<span class="g-s">' + (Number(r.held) ? units(r.held) + ' · ' + takenPc + '%'
                                                   : 'nothing taken') + '</span></div>' +
        '</div></div>';
    }).join('') + '</div>' +

    '<div class="wf wf-t">' +
      '<div class="wf-h"><span class="wf-n">The whole building</span>' +
        '<span class="wf-v">PKR ' + pkr(tot.value) + '</span></div>' +
      '<div class="wf-s">' + units(tot.units) + ' · ' +
        num(Math.round(tot.area)) + ' ' + esc(U) + '</div>' +
      '<div class="wf-g">' +
        '<div><span class="g-l">On the shelf</span>' +
          '<span class="g-v">PKR ' + pkr(tot.free) + '</span>' +
          '<span class="g-s">' + units(tot.avail) + '</span></div>' +
        '<div><span class="g-l">Taken</span>' +
          '<span class="g-v">PKR ' + pkr(tot.taken) + '</span>' +
          '<span class="g-s">' + units(tot.held) + '</span></div>' +
      '</div></div>' +

    '<div class="say">Worth is the register’s own asking value: every unit on the ' +
      'floor at the price the register carries for it. It is not money received, ' +
      'and no discount, instalment or adjustment is in it.</div>' +
    repTools('What each floor is worth') + disclaimer(d) + '</div>';
}

$('units').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-u]'); if (!b || b.disabled) return;
  openSheet(b.getAttribute('data-u'), FLOOR);
});
$('scrim').onclick = closeSheet;
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && SHEET) closeSheet();
});

/* ── go ──────────────────────────────────────────────────────────────────── */
NAME = readName();
REQS = readReqs();
/* The screenshot harness renders a CAPTURED payload so the scale screens can be
   photographed without an Awami link being created. ?preview=1 only stops this
   page from fetching on its own — it grants nothing, reveals nothing, and
   leaves the page blank until a script hands it data. */
var PREVIEW = new URLSearchParams(location.search).get('preview') === '1';
if (PREVIEW) { /* wait for _availPreview */ }
else if (!TOKEN) { dead(); }
else { load(true).then(schedule); }

/* the harness renders against a captured payload so the scale screens can be
   photographed without an Awami link being created */
window._availPreview = function (payload) {
  P = payload; FETCHED = Date.now(); STALE = false;
  $('boot').hidden = true; $('app').hidden = false;
  FLOOR = null; SHEET = null; SHOWALL = false;
  REQS = readReqs();
  render();
  return (P.floors || []).length;
};
