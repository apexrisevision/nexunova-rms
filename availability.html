<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Availability</title>
<link rel="icon" href="/assets/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/favicon-180.png">

<style>
/* ══ THE WHOLE POINT OF THIS PAGE ═════════════════════════════════════════
   A dealer opens it in a WhatsApp group on a mid-range Android phone. They
   already know the unit they want, or they know the floor. They must NEVER be
   shown 1,467 units — the building's size is our problem, not theirs.

   So: screen one is the building (a search box and seven floor chips, nothing
   else, no scrolling), screen two is ONE floor. No screen ever holds more than
   one floor's units, and switching floors unmounts the last one.

   THE VISUAL RULES, and they are short on purpose:

   · One family, the system stack. No webfont, because 40KB of Inter is four
     seconds of a 3G first paint and weight and size already carry hierarchy.
   · One accent, and it does exactly two jobs: the thing you press, and the
     ring around whatever has focus. Nowhere else.
   · Cards are white ON a warmer near-white ground, with NO border. One or the
     other, never both, and never a shadow underneath.
   · Availability is contrast and weight, not colour. The bar under the count
     is ink at two strengths.
   · Every animation is caused by a finger, lasts under 300ms, and happens
     once. Nothing on this page moves by itself.
   ════════════════════════════════════════════════════════════════════════ */

:root{
  /* A warmer, slightly deeper ground so a pure-white card separates on its
     own. This is what buys the borderless surface. */
  --bg:#F5F5F4;
  --card:#FFFFFF;
  --ink:#14171C;
  --soft:#565E6A;
  --mut:#8A919B;
  /* hairlines, for the few places a card is not enough: inputs and dividers */
  --line:#E3E4E6;
  --hair:rgba(20,23,28,.07);
  --sunk:#EDEDEC;
  /* THE one accent */
  --accent:#1D4ED8;
  --accent-soft:#EDF2FE;
  --ring:rgba(29,78,216,.18);
  /* Held is deliberately low-chroma. It has to be distinguishable at arm's
     length in sunlight without ever being the loudest thing on the screen. */
  --held:#8A6224;
  --held-bg:#F3EEE5;
  --warn:#8A5300;

  --r:12px;
  --r-lg:20px;
  --pad:18px;

  --ease:cubic-bezier(.2,.7,.3,1);
  --t-fast:120ms;
  --t:160ms;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1013; --card:#171A1F; --ink:#EDEFF2; --soft:#A2A9B4; --mut:#79808A;
    --line:#272B31; --hair:rgba(255,255,255,.07); --sunk:#1C1F24;
    --accent:#7AA2FF; --accent-soft:#161C28; --ring:rgba(122,162,255,.22);
    --held:#C99A55; --held-bg:#221C13;
    --warn:#D9A441;
  }
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  /* Every number on this page lines up under every other one, everywhere,
     without being asked for again. */
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
  padding:0 0 env(safe-area-inset-bottom);
}
button,input{font:inherit;color:inherit;font-variant-numeric:inherit}
button{cursor:pointer;background:none;border:0}
.num{font-variant-numeric:tabular-nums}

/* THE SCALE. Six steps, and nothing on the page is allowed a size that is not
   one of them. Large text tracks tighter, small caps track looser. */
.t-display{font-size:26px;font-weight:700;letter-spacing:-.028em;line-height:1.12}
.t-title  {font-size:20px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
.t-fig    {font-size:22px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.t-body   {font-size:14.5px;line-height:1.55}
.t-cap    {font-size:12px;color:var(--mut);line-height:1.55}
.t-lab    {font-size:10.5px;font-weight:650;letter-spacing:.11em;
           text-transform:uppercase;color:var(--mut);line-height:1.2}

/* ── the frame ──────────────────────────────────────────────────────────── */
.wrap{max-width:520px;margin:0 auto;padding:15px var(--pad) 40px}

.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
    margin-bottom:15px}
.hd-t{font-size:26px;font-weight:700;letter-spacing:-.028em;line-height:1.12}
.hd-c{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.5}
.hd-u{font-size:11px;color:var(--mut);white-space:nowrap;flex:none;padding-top:7px;
      transition:color var(--t) var(--ease)}
/* A refetch that failed must SAY the data is old rather than keep a confident
   timestamp that quietly stopped being true. A change of tone, no banner. */
.hd-u.stale{color:var(--warn)}

/* ── the reading ─────────────────────────────────────────────────────────
   Not a card and not a headline. The search below is the focal point of this
   screen, so this states the position and gets out of the way. */
.hero{margin-bottom:15px}
.hero-top{display:flex;align-items:baseline;gap:10px}
.hero-l{font-size:10.5px;font-weight:650;letter-spacing:.11em;text-transform:uppercase;
        color:var(--mut);line-height:1.2;margin-bottom:6px}
.hero-n{font-size:22px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.hero-p{font-size:12px;color:var(--mut)}
/* Ink at two strengths, not two hues. Availability is contrast here. */
.bar{display:flex;height:3px;border-radius:999px;overflow:hidden;background:var(--sunk);
     margin:9px 0 7px}
.bar i{display:block;height:100%}
.bar .free{background:var(--ink);opacity:.28}
.bar .held{background:transparent}
.hero-f{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px;
        color:var(--mut);line-height:1.45}
.hero-f b{font-weight:650;color:var(--soft)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;
     vertical-align:1px}
.dot.free{background:var(--ink);opacity:.28}
.dot.held{background:var(--sunk);box-shadow:inset 0 0 0 1px var(--hair)}
.tot{margin-top:16px;font-size:12px;color:var(--mut);text-align:center}

/* ── search: THE focal point of screen one ──────────────────────────────── */
.sr{position:relative;margin-bottom:17px}
.sr input{
  width:100%;height:58px;padding:0 18px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--card);font-size:16.5px;font-weight:500;
  letter-spacing:-.01em;outline:none;
  transition:border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
/* A ring, never a shadow: the same job without pretending the field floats. */
.sr input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}
.sr input::placeholder{color:var(--mut);font-weight:400}

.res{margin-top:10px;border-radius:var(--r);background:var(--card);overflow:hidden;
     animation:fade var(--t) var(--ease) both}
.res-r{display:flex;align-items:baseline;gap:12px;width:100%;padding:14px 16px;
       border-bottom:1px solid var(--hair);text-align:left;min-height:48px;
       transition:background var(--t-fast) var(--ease)}
.res-r:last-child{border-bottom:0}
.res-r:active{background:var(--sunk)}
.res-r .n{font-weight:650;font-size:14.5px;min-width:76px;letter-spacing:-.01em}
.res-r .f{flex:1;min-width:0;font-size:12.5px;color:var(--soft);
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-r .a{font-size:12px;color:var(--mut);white-space:nowrap}
.res-r[disabled]{cursor:default;background:var(--held-bg)}
.res-r[disabled]:active{background:var(--held-bg)}
.res-r[disabled] .n{color:var(--held);font-weight:600}
/* A held row must not read differently here than on the floor grid, or the
   two screens are describing two different buildings. */
.res-r[disabled] .a{color:var(--held);font-weight:650;font-size:10px;
                    letter-spacing:.08em;text-transform:uppercase}
.res-more{padding:12px 16px;font-size:12px;color:var(--mut);border-top:1px solid var(--hair)}
/* An empty search is not an error. One quiet line, centred, and no red. */
.res-none{padding:26px 16px;font-size:13.5px;color:var(--mut);text-align:center;line-height:1.6}

/* ── floor chips ────────────────────────────────────────────────────────── */
.fl{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fl button{
  padding:13px 15px 12px;border:0;border-radius:var(--r);
  background:var(--card);text-align:left;min-height:70px;
  display:flex;flex-direction:column;justify-content:center;
  transition:background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
/* The tactile press. This, more than anything else here, is what makes a page
   feel like an application rather than a document on a phone. */
@media (hover:hover){ .fl button:hover{background:#FDFDFD} }
/* AFTER the hover rule, not before. Same specificity means the last one
   wins, and a mouse is hovering at the moment it presses — so a press
   declared first shows the hover tint and the tactile answer is lost on
   every device that has a cursor. */
.fl button:active{transform:scale(.975);background:var(--sunk)}
.fl .fn{font-size:10.5px;font-weight:650;letter-spacing:.11em;text-transform:uppercase;
        color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .fr{display:flex;align-items:baseline;gap:7px;margin-top:6px}
.fl .fv{font-size:22px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.fl .fc{font-size:11.5px;color:var(--mut);line-height:1.4}
/* A floor with nothing free is not an error, it is just finished. It sinks
   rather than shouting. */
.fl button.empty{background:var(--held-bg)}
@media (hover:hover){ .fl button.empty:hover{background:var(--held-bg)} }
.fl button.empty:active{background:var(--held-bg);transform:scale(.975)}
.fl button.empty .fv{font-size:15px;font-weight:600;color:var(--held);letter-spacing:-.01em}
.fl button.empty .fc{color:var(--held);opacity:.75}
.fl button.empty .fn{color:var(--held);opacity:.75}

/* A BRIEF ENTRANCE, ONCE. Added by the first paint and taken off immediately,
   so a refetch two minutes later never repeats it. */
.fl.stagger button{animation:rise 180ms var(--ease) both;
                   animation-delay:calc(var(--i,0) * 30ms)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ── SKELETON ────────────────────────────────────────────────────────────
   Matched to the real thing's dimensions, so the page does not jump when the
   payload lands. It does not shimmer: a looping animation on a first paint is
   the page telling the user to look at it while it has nothing to say. */
.sk{border-radius:var(--r);background:var(--card)}
.sk-line{border-radius:6px;background:var(--sunk)}
.sk-hd{height:29px;width:62%;margin-bottom:9px}
.sk-co{height:13px;width:40%;margin-bottom:15px}
.sk-hero{height:14px;width:34%;margin-bottom:11px}
.sk-bar{height:3px;width:100%;border-radius:999px;margin-bottom:8px}
.sk-leg{height:13px;width:56%;margin-bottom:15px}
.sk-sr{height:58px;width:100%;margin-bottom:17px;border-radius:var(--r)}
.sk-fl{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sk-ch{height:70px;border-radius:var(--r)}

/* ── SCREEN TRANSITION — user-initiated, one way in, one way back ───────── */
.scr-in {animation:scrIn  var(--t) var(--ease) both}
.scr-out{animation:scrOut var(--t) var(--ease) both}
@keyframes scrIn {from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes scrOut{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}

/* What this phone has asked for, and what came back. Quiet: it is a receipt,
   not the point of the page. */
.myq{margin-bottom:22px;border-radius:var(--r);background:var(--card);overflow:hidden}
.myq-h{padding:12px 16px 10px;font-size:10.5px;font-weight:650;letter-spacing:.11em;
       text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--hair)}
.myq-r{display:flex;align-items:baseline;gap:11px;padding:12px 16px;
       border-bottom:1px solid var(--hair);font-size:13px}
.myq-r:last-child{border-bottom:0}
.myq-r .u{font-weight:650;min-width:70px;letter-spacing:-.01em}
.myq-r .d{flex:1;min-width:0;font-size:12px;color:var(--mut);
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.myq-r .s{font-size:11.5px;font-weight:650;white-space:nowrap}
/* The ask sits under the row it is about, quiet until it is opened. */
.myq-c{padding:0 16px 12px}
.myq-ask{height:34px;padding:0 12px;border-radius:var(--r);background:var(--sunk);
         font-size:12.5px;font-weight:600;color:var(--soft);
         transition:transform var(--t-fast) var(--ease)}
.myq-ask:active{transform:scale(.97)}
.myq-c.open{padding-bottom:14px}
.myq-h2{font-size:10.5px;font-weight:650;letter-spacing:.11em;text-transform:uppercase;
        color:var(--mut);margin-bottom:8px}
.myq-c input{width:100%;height:46px;padding:0 14px;border:1px solid var(--line);
             border-radius:var(--r);background:var(--card);font-size:15px;outline:none}
.myq-c input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}
.myq-b{display:flex;gap:8px;margin-top:9px}
.myq-b button{height:44px;padding:0 16px;border-radius:var(--r);background:var(--sunk);
              font-size:13.5px;font-weight:600;color:var(--soft);
              transition:transform var(--t-fast) var(--ease)}
.myq-b button:active{transform:scale(.985)}
.myq-b .prim{flex:1;background:var(--accent);color:#fff}
.myq-b .prim:disabled{opacity:.45}
/* Said plainly, because a dealer typing "sold" must not think they set it. */
.myq-n{margin-top:9px;font-size:11.5px;color:var(--mut);line-height:1.5}
.s-pending{color:var(--mut)}
.s-approved,.s-held{color:#1C6B3F}
.s-declined{color:#8A2F26}
/* Neither green nor red: nothing went wrong, the hold is simply over. */
.s-ended{color:var(--held)}
.s-stale,.s-expired{color:var(--mut);text-decoration:line-through}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .s-approved,
  :root:not([data-theme="light"]) .s-held{color:#5FCB90}
  :root:not([data-theme="light"]) .s-declined{color:#E58A7E}
}

/* Asked in the sheet, at the moment it matters, if it was skipped earlier. */
.ask{margin-top:18px;padding:14px;border-radius:var(--r);background:var(--sunk)}
.ask-t{font-size:13px;font-weight:600;margin-bottom:10px;line-height:1.5}
.ask-r{display:flex;gap:9px}
.ask-r input{flex:1;height:46px;padding:0 14px;border:1px solid var(--line);
             border-radius:var(--r);background:var(--card);font-size:15.5px;outline:none}
.ask-r input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}

/* Desktop is not a wider phone, and it is not a phone floating in a field
   either. Above 760px the column widens and the floors go to three across, so
   the seven of them read as a building rather than a list that ran out. */
@media (min-width:760px){
  .wrap{max-width:760px;padding:40px 28px 56px}
  .hd{margin-bottom:28px}
  .hd-t{font-size:28px}
  .hero{margin-bottom:26px}
  .sr{margin-bottom:30px}
  .fl{grid-template-columns:repeat(3,1fr);gap:12px}
  .fl button{min-height:92px;padding:17px 18px}
  .sr input{height:60px}
  .ug{grid-template-columns:repeat(8,1fr);gap:9px}
}

/* ── one floor ──────────────────────────────────────────────────────────── */
.ft{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.bk{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 11px;
    margin-left:-11px;border-radius:var(--r);font-size:13.5px;color:var(--soft);
    transition:background var(--t-fast) var(--ease)}
@media (hover:hover){ .bk:hover{background:var(--sunk);color:var(--ink)} }
.bk:active{background:var(--sunk);color:var(--ink)}
.bk i{width:7px;height:7px;border-left:1.5px solid currentColor;
      border-bottom:1.5px solid currentColor;transform:rotate(45deg);display:inline-block}
.fh{display:flex;align-items:baseline;gap:11px;margin:10px 0 18px;flex-wrap:wrap}
.fh h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.028em;line-height:1.12}
.fh span{font-size:12.5px;color:var(--mut)}
.fh b{font-weight:650;color:var(--soft)}

/* Secondary on purpose: revealing what cannot be bought is not the reason
   anyone opened this. Still a 44px target. */
.sw{display:inline-flex;align-items:center;gap:10px;margin-bottom:18px;
    height:44px;padding:0 16px;border-radius:999px;background:var(--card);
    font-size:12.5px;color:var(--soft);
    transition:background var(--t-fast) var(--ease)}
.sw:active{background:var(--sunk)}
.sw input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
.sw label{cursor:pointer;user-select:none}

.ug{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:440px){ .ug{grid-template-columns:repeat(5,1fr)} }
.ug button{
  padding:11px 5px;border:0;border-radius:var(--r);background:var(--card);
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;
  justify-content:center;
  transition:background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
@media (hover:hover){ .ug button:hover{background:#FDFDFD} }
.ug button:active{transform:scale(.94);background:var(--sunk)}
.ug .un{font-size:13.5px;font-weight:650;letter-spacing:-.015em;line-height:1.2}
.ug .ua{font-size:10px;color:var(--mut);line-height:1.3}
/* Held: a warm, muted ground. It says somebody has this without ever being
   the loudest thing on a screen of three hundred units. */
.ug button.off{background:var(--held-bg);cursor:default}
@media (hover:hover){ .ug button.off:hover{background:var(--held-bg)} }
.ug button.off:active{transform:none;background:var(--held-bg)}
.ug button.off .un{color:var(--held);font-weight:600}
.ug .off-l{font-size:9px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
           color:var(--held);opacity:.85;line-height:1.3}

.empty{padding:34px 8px;text-align:center;color:var(--mut);font-size:13.5px;line-height:1.6}

/* ── the whole building ──────────────────────────────────────────────────
   A different question from a floor, so a different chip: lighter, wider,
   and it says which floor it is not. */
#allrow{margin-top:9px}
.all-chip{width:100%;height:52px;padding:0 15px;border:0;border-radius:var(--r);
          background:var(--sunk);text-align:left;
          display:flex;align-items:center;gap:9px;
          transition:background var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
@media (hover:hover){ .all-chip:hover{background:#EAEAE9} }
.all-chip:active{transform:scale(.985);background:#E6E6E5}
.all-chip .ac-t{font-size:13.5px;font-weight:650;letter-spacing:-.01em;flex:none}
.all-chip .ac-m{flex:1;min-width:0;font-size:12px;color:var(--mut);
                overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.all-chip .ac-m b{font-weight:650;color:var(--soft)}
.all-chip .ac-x{flex:none;display:flex;align-items:center;color:var(--mut)}
.all-chip .ac-x i{width:7px;height:7px;border-right:1.5px solid currentColor;
                  border-top:1.5px solid currentColor;transform:rotate(45deg);display:block}

/* the four numbers this screen exists to state */
.ah{margin:10px 0 14px}
.ah-r{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ah-c{background:var(--card);border-radius:var(--r);padding:11px 12px}
.ah-l{font-size:9.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;
      color:var(--mut);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ah-v{font-size:19px;font-weight:650;letter-spacing:-.02em;line-height:1.25;margin-top:4px}
.ah-v.held{color:var(--held)}

/* Cuts the list rather than tinting it: the way to find eleven held units
   among 1,467 on a phone is to be shown eleven. */
.af{display:flex;gap:7px;margin-bottom:16px}
.af button{flex:1;height:44px;border-radius:var(--r);background:var(--card);
           font-size:13px;font-weight:600;color:var(--soft);
           transition:background var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.af button:active{transform:scale(.97)}
.af button.on{background:var(--ink);color:var(--card)}

/* The floor's own numbers ride with the floor. Stuck to the top while you
   are inside it, because three hundred identical chips with no heading in
   sight are three hundred anonymous chips. */
.as{margin-bottom:22px}
.as-h{position:sticky;top:0;z-index:5;background:var(--bg);
      padding:9px 0 8px;margin-bottom:8px}
.as-n{display:block;font-size:15px;font-weight:650;letter-spacing:-.015em;line-height:1.3}
.as-m{display:block;font-size:11.5px;color:var(--mut);line-height:1.5;margin-top:2px}
.as-m b{font-weight:650;color:var(--soft)}
.as-m b.held{color:var(--held)}

/* ── the request sheet ──────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(14,16,19,.44);opacity:0;
       pointer-events:none;transition:opacity var(--t) var(--ease);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
/* A CLOSED SHEET MUST NOT BE ABLE TO BE CLICKED. Below it is only moved or
   faded, and a faded element still takes the pointer — which is how an
   invisible box came to eat half the unit grid on a laptop. */
.sheet{pointer-events:none}
.sheet.on{pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  background:var(--card);

@media (min-width:560px){

}

.sh-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}

.sh-x{width:44px;height:44px;margin:-8px -10px 0 0;border-radius:var(--r);

@media (hover:hover){ .sh-x:hover{background:var(--sunk);color:var(--ink)} }

.sh-l{font-size:10.5px;font-weight:650;letter-spacing:.11em;text-transform:uppercase;

/* What the dealer is asking for. Sits above the duration because it decides

.ask-k{display:flex;gap:8px;flex-wrap:wrap}
.ask-k button{flex:1;min-width:88px;height:46px;border:1px solid var(--line);
              border-radius:var(--r);background:var(--card);font-size:13.5px;

/* The one accent action on the page. */
.go{width:100%;height:52px;margin-top:22px;border-radius:var(--r);
    background:var(--accent);color:#fff;font-size:15px;font-weight:650;letter-spacing:-.01em;

/* The button does not reserve anything, and neither does the sentence under it. */

.acts{display:flex;gap:9px;margin-top:22px}
/* Not two equal choices: one is the thing you came to do, the other is the

             color:#fff;font-size:14px;font-weight:650;
             transition:transform var(--t-fast) var(--ease)}
.nm-r button:active{transform:scale(.97)}
/* Skip is not a second Save. */
.nm-r button.nm-sk{background:none;color:var(--mut);font-weight:500;padding:0 12px;flex:none}

/* ── boot and dead link ─────────────────────────────────────────────────── */
.boot{padding:22px var(--pad) 40px;max-width:520px;margin:0 auto}
@media (min-width:760px){ .boot{max-width:760px;padding:40px 28px 56px} }

.dead b{display:block;font-size:17px;font-weight:650;color:var(--ink);margin-bottom:8px;
        letter-spacing:-.015em}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);
       background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;
       font-size:13px;font-weight:500;opacity:0;pointer-events:none;
       transition:opacity var(--t) var(--ease),transform var(--t) var(--ease);
       z-index:60;max-width:90vw;line-height:1.4}
.toast.on{opacity:1;transform:translateX(-50%)}

/* NOTHING MOVES FOR ANYONE WHO HAS ASKED FOR THAT. One rule, at the end, so

    animation-duration:.001ms !important;

    transition-duration:.001ms !important;
  }

[hidden]{display:none !important}

<body>

<!-- Shaped like the thing it stands in for — same header, same 58px field,
     same seven chips at the same height — so the payload landing changes
     what the page says and not where anything sits. It does not shimmer: a
     loop on a first paint is the page asking to be watched while it has
     nothing to show. -->
<div class="boot" id="boot" aria-hidden="true">
  <div class="sk-line sk-hd"></div>
  <div class="sk-line sk-co"></div>
  <div class="sk-line sk-hero"></div>
  <div class="sk-line sk-bar"></div>
  <div class="sk-line sk-leg"></div>
  <div class="sk sk-sr"></div>
  <div class="sk-fl">
    <div class="sk sk-ch"></div><div class="sk sk-ch"></div>
    <div class="sk sk-ch"></div><div class="sk sk-ch"></div>
    <div class="sk sk-ch"></div><div class="sk sk-ch"></div>
    <div class="sk sk-ch"></div>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <div class="hd">
    <div>
      <div class="hd-t" id="ttl">—</div>
      <div class="hd-c" id="co">—</div>
    </div>
    <div class="hd-u" id="upd"></div>
  </div>

  <div id="name-ask" hidden></div>

  <!-- SCREEN ONE ─────────────────────────────────────────────────────────
       Search first: most dealers already know the unit. Then the floors.
       No unit is rendered here, ever. -->
  <section id="home">
    <div id="myq" hidden></div>
    <!-- The single fact this page exists to state, said once and said large.
         It sits above the search because it is a reading, not an action — the
         search is still the first thing anyone can touch. -->
    <div class="hero" id="hero"></div>
    <div class="sr">
      <input id="q" type="search" inputmode="search" autocomplete="off"
             autocapitalize="characters" spellcheck="false"
             placeholder="Search unit — e.g. LG-12" aria-label="Search unit">
      <div id="res" hidden></div>
    </div>
    <div class="fl" id="floors"></div>
    <!-- Deliberately outside #floors: it is not a floor, and every check
         that counts floors would have counted it. -->
    <div id="allrow"></div>
  </section>

  <!-- SCREEN THREE — THE WHOLE BUILDING, WHEN SOMEBODY ASKS FOR IT ────────
       Everything else here exists to avoid rendering 1,467 units, and this
       renders 1,467 units. It is a deliberate exception, reached only by
       pressing a chip that says so, and it is the one screen on this page
       measured for how long it takes to draw. -->
  <section id="all" hidden>
    <div class="ft"><button class="bk" id="all-back"><i></i>All floors</button></div>
    <div class="ah" id="all-head"></div>
    <div class="af" id="all-filter"></div>
    <div id="all-body"></div>
    <div class="empty" id="all-empty" hidden></div>
  </section>

  <!-- SCREEN TWO — one floor, and only ever one ─────────────────────────── -->
  <section id="floor" hidden>
    <div class="ft"><button class="bk" id="back"><i></i>All floors</button></div>
    <div class="fh"><h1 id="fname">—</h1><span id="fcount"></span></div>
    <div class="sw">
      <input type="checkbox" id="showall"><label for="showall">Show unavailable units</label>
    </div>
    <div class="ug" id="units"></div>
    <div class="empty" id="fempty" hidden></div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-n"></aside>
<div class="toast" id="toast"></div>

<script src="/js/vendor/supabase-js-2.34.0.umd.js?v=20260616"></script>
<script src="/js/portal-copy.js?v=20260908a"></script>
<script>
/* ── the only server call this page can make ──────────────────────────────
   get_public_availability(token) returns, per unit, its number, its area and
   whether it can be bought. Not the price — that was removed from the SERVER,
   not from this page, so reading the network tab does not bring it back. Not
   the buyer, not the amount, not who holds a unit that is taken: 'available'
   and 'not_available' are the only two answers, and a reserved unit is
   indistinguishable from a sold one.

   No session is created. Nothing is written. reserve_unit is unreachable from
   here — the button on this page composes a WhatsApp message and does not book
   anything, which is why nothing here says "Reserve" — the action sends the
   ask, and the line under it says the unit is not held until somebody
   answers. */
const SUPABASE_URL = 'https://itqxljtfbrppntgyfush.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_OkIT2ttNgBiOm-E4HJLnFw_OmIz-8VG';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY,
  { auth: { persistSession: false } });

/* the token rides in the path (/a/<token>) or as ?t=<token> */
const TOKEN = (function () {
  var q = new URLSearchParams(location.search).get('t');
  if (q) return q;
  var m = location.pathname.match(/\/a\/([A-Za-z0-9_-]{8,})/);
  return m ? m[1] : '';
})();

var P = null;              // the payload, exactly as the server sent it
var FLOOR = null;          // index into P.floors, or null on screen one
var SHOWALL = false;
var SHEET = null;          // { unit, floorIdx, days, ref }
var FETCHED = 0;           // ms of the last SUCCESSFUL fetch
var STALE = false;
/* The entrance plays for the first grid of chips and never again, and the
   home screen slides the other way only when a person pressed Back. */
var STAGGERED = false;
var BACKING = false;
/* The confirmation dismisses itself. That timer must die with the sheet
   that started it, or it closes whichever sheet is open when it fires. */
var SENT_T = null;
/* The whole-building screen, and what it is filtered to. Kept out of FLOOR
   so that going back from it lands on the building rather than on a floor
   nobody chose. */
var ALLV = false;
var ALLF = 'all';        // all | free | held
var NAME = '';

var $ = function (id) { return document.getElementById(id); };
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function norm(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function area(u) {
  var n = Number(u.a || 0);
  if (!n) return '';
  return n.toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' ' + (P.area_unit || 'sqft');
}
function hhmm(ms) {
  var d = new Date(ms);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
var TT;
function toast(msg) {
  var t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(TT); TT = setTimeout(function () { t.classList.remove('on'); }, 2400);
}

/* ── the name, stored here and nowhere else ──────────────────────────────
   localStorage only: no account, no server write, nothing that could identify
   a dealer to anyone but themselves. Skipping is a real choice — the whole flow
   works without it and the message simply omits the line. Every access is
   guarded because a private window, cleared site data or a browser set to block
   storage all THROW here rather than return empty. */
function readName() {
  try { return localStorage.getItem('avail.name') || ''; } catch (e) { return ''; }
}
function writeName(v) {
  try { localStorage.setItem('avail.name', v); } catch (e) {}
}
/* THE REQUESTS THIS PHONE HAS MADE.
   Refs only — six readable characters each. Not the unit id, not the request
   id, nothing that identifies the dealer to anyone but themselves. They are
   kept so the page can ask what happened: pending, approved, or declined by
   management. Capped so a busy week does not grow this list forever. */
var REQS = [];
function readReqs() {
  try { return JSON.parse(localStorage.getItem('avail.reqs') || '[]') || []; }
  catch (e) { return []; }
}
function writeReqs(list) {
  try { localStorage.setItem('avail.reqs', JSON.stringify(list.slice(0, 25))); } catch (e) {}
}

function nameAsked() {
  try { return localStorage.getItem('avail.name.asked') === '1'; } catch (e) { return true; }
}
function markAsked() {
  try { localStorage.setItem('avail.name.asked', '1'); } catch (e) {}
}

function paintNameAsk() {
  var box = $('name-ask');
  if (NAME || nameAsked()) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.className = 'nm';
  box.innerHTML =
    '<div class="nm-t">Your name</div>' +
    '<div class="nm-s">Added to the reservation requests you send, so the desk knows ' +
      'who asked. Stored on this phone only.</div>' +
    '<div class="nm-r">' +
      '<input id="nm-in" type="text" autocomplete="name" placeholder="e.g. Fawad khan">' +
      '<button id="nm-ok">Save</button>' +
      '<button class="nm-sk" id="nm-skip">Skip</button>' +
    '</div>';
  $('nm-ok').onclick = function () {
    NAME = String($('nm-in').value || '').trim();
    if (NAME) writeName(NAME);
    markAsked(); paintNameAsk();
  };
  $('nm-skip').onclick = function () { markAsked(); paintNameAsk(); };
  $('nm-in').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('nm-ok').click(); }
  });
}

/* ── fetching ──────────────────────────────────────────────────────────────
   One call on load, then every two minutes WHILE THE PAGE IS VISIBLE. A phone
   in a pocket must not poll. A failed refetch keeps the last good data on
   screen and marks the timestamp instead — a dealer reading a stale figure that
   admits it is stale is fine; a blank screen in a WhatsApp group is not. */
var TIMER = null;
async function load(first) {
  var r;
  try { r = await sb.rpc('get_public_availability', { p_token: TOKEN }); }
  catch (e) { r = null; }
  var d = r && r.data;

  if (!d || !d.success) {
    if (first) return dead();
    STALE = true; paintUpdated();          // keep what is on screen
    return;
  }

  P = d; FETCHED = Date.now(); STALE = false;
  refreshMyReqs();          // a decision reaches the dealer on the same rhythm

  if (first) {
    $('boot').hidden = true;
    $('app').hidden = false;
    document.title = (P.project || 'Availability');
  }
  render();
}

/* Keyed on the DERIVED state now. 'approved' stays in the table because a
   phone that has been away still has that word in its storage, and it must
   not render as a raw slug while the next refresh is in flight. */
var SAYS = { pending: 'Waiting', held: 'Reserved for you', ended: 'Hold ended',
             approved: 'Reserved for you',
             declined: 'Declined by Management', stale: 'Unit was taken',
             expired: 'Expired' };

/* Nothing further will ever happen to these, so the phone stops asking. */
var SETTLED = { declined: 1, ended: 1, stale: 1, expired: 1 };
function stateOf(r) { return r.state || r.status || 'pending'; }

function _myqClick(e) {
  var a = e.target.closest('[data-ask]');
  if (a) return openAsk(a.getAttribute('data-ask'));
  var sd = e.target.closest('[data-send]');
  if (sd) return sendAsk(sd.getAttribute('data-send'));
}

function paintMyReqs() {
  var box = $('myq');
  if (!box) return;
  if (!REQS.length) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.className = 'myq';
  /* Bound once. paintMyReqs runs on every refetch and a listener per paint
     would fire the fifth ask five times. */
  if (!box.__askBound) { box.addEventListener('click', _myqClick); box.__askBound = true; }
  box.innerHTML = '<div class="myq-h">Your requests</div>' +
    REQS.slice(0, 6).map(function (r) {
      var st = stateOf(r);
      /* A HELD UNIT CAN STILL NEED SOMETHING. The deal matures, and until now
         the link had nothing to say about a unit that was already theirs — it
         could only ask for units that were FREE, so the moment one became
         theirs it fell out of the only channel they have. */
      var canAsk = (st === 'held' && r.kind !== 'change');
      return '<div class="myq-r">' +
        '<span class="u">' + esc(r.unit) + '</span>' +
        '<span class="d">' + (r.days == null ? esc(r.asked || 'No end date')
                             : esc(r.days) + ' day' + (r.days === 1 ? '' : 's')) +
          '  \u00b7  ' + esc(initials(P && P.project)) + '-REQ-' + esc(r.ref) + '</span>' +
        '<span class="s s-' + esc(st) + '">' + esc(SAYS[st] || st) + '</span>' +
      '</div>' +
      (canAsk
        ? (ASKING === r.ref
            ? '<div class="myq-c open">' +
                '<div class="myq-h2">What has changed?</div>' +
                '<input id="ask-note" maxlength="120" ' +
                  'placeholder="e.g. Deal done \u2014 please mark it sold">' +
                '<div class="myq-b">' +
                  '<button id="ask-send" class="prim" data-send="' + esc(r.ref) + '">Send</button>' +
                  '<button data-ask="' + esc(r.ref) + '">Cancel</button>' +
                '</div>' +
                '<div class="myq-n">The desk decides the status. This just tells them why.</div>' +
              '</div>'
            : '<div class="myq-c"><button class="myq-ask" data-ask="' + esc(r.ref) + '">' +
              'Ask to change this</button></div>')
        : '');
    }).join('');
}

/* Asks only about the refs this phone holds, through the link that made them.
   Folded into the same two-minute rhythm as the availability itself, so a
   decision reaches the dealer without them doing anything. */
/* ASKING FOR A CHANGE. The dealer says what happened; they do not choose a
   status. That is the same rule as everywhere else on this page and the
   reason a link like this can be handed to anybody: nothing here decides
   what a unit becomes. The desk reads the note and picks the tag. */
var ASKING = null;
function openAsk(ref) {
  if (ASKING === ref) { ASKING = null; paintMyReqs(); return; }
  ASKING = ref; paintMyReqs();
  var i = document.getElementById('ask-note'); if (i) { try { i.focus(); } catch (e) {} }
}

async function sendAsk(ref) {
  var i = document.getElementById('ask-note');
  var note = i ? String(i.value || '').trim() : '';
  var b = document.getElementById('ask-send');
  if (b) { b.disabled = true; b.textContent = 'Sending\u2026'; }
  var r;
  try {
    r = await sb.rpc('submit_change_request',
      { p_token: TOKEN, p_ref: ref, p_note: note || null });
  } catch (e) { r = null; }
  var d = r && r.data;
  if (b) { b.disabled = false; b.textContent = 'Send'; }
  if (!d || !d.success) {
    toast((d && d.message) || 'Could not send that. Please try again.');
    return;
  }
  /* Kept on this phone the same way a booking request is, so the answer
     comes back to the row rather than to nobody. */
  var list = readReqs();
  list.unshift({ ref: d.ref, unit: d.unit_no, days: 0, status: 'pending', kind: 'change' });
  REQS = list; writeReqs(list);
  ASKING = null;
  paintMyReqs();
  toast('Sent \u2014 the desk will answer on ' + esc(d.unit_no) + '.');
}

async function refreshMyReqs() {
  if (!REQS.length) return;
  /* Everything that can still change, not everything that has not changed
     yet. A held unit can be released at the desk at any moment, and that is
     precisely the news this band exists to carry. */
  var open = REQS.filter(function (r) { return !SETTLED[stateOf(r)]; });
  if (!open.length) return;
  try {
    var r = await sb.rpc('get_request_status',
      { p_token: TOKEN, p_refs: open.map(function (x) { return x.ref; }) });
    var d = r && r.data;
    if (!d || !d.success) return;
    var by = {};
    (d.requests || []).forEach(function (x) { by[x.ref] = x; });
    var changed = false;
    REQS.forEach(function (x) {
      var got = by[x.ref]; if (!got) return;
      /* An older server that does not send `state` still answers with
         `status`, and the row must not blank out because of it. */
      var st = got.state || got.status;
      if (st && st !== stateOf(x)) { x.state = st; x.status = got.status; changed = true; }
      if (got.held_until !== x.until) { x.until = got.held_until || null; changed = true; }
      if (got.asked && got.asked !== x.asked) { x.asked = got.asked; changed = true; }
    });
    if (changed) { writeReqs(REQS); paintMyReqs(); }
  } catch (e) { /* the receipt can wait; the board matters more */ }
}

function dead() {
  $('boot').hidden = true;
  document.body.innerHTML =
    '<div class="dead"><b>This link is not available</b>' +
    '<span>It may have been withdrawn, or replaced with a newer one. ' +
    'Ask whoever shared it for the current link.</span></div>';
}

function paintUpdated() {
  var el = $('upd');
  if (!FETCHED) { el.textContent = ''; return; }
  el.textContent = 'Updated ' + hhmm(FETCHED);
  el.classList.toggle('stale', STALE);
  el.title = STALE ? 'Could not refresh — showing the last known position' : '';
}

function schedule() {
  clearTimeout(TIMER);
  if (document.hidden) return;
  TIMER = setTimeout(function () { load(false).then(schedule); }, 120000);
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { clearTimeout(TIMER); return; }
  load(false).then(schedule);        // catch up the moment it comes back
});

/* ── render ──────────────────────────────────────────────────────────────── */
function render() {
  $('ttl').textContent = P.project || 'Availability';
  $('co').textContent = P.company || '';
  paintUpdated();
  paintNameAsk();
  paintMyReqs();
  if (ALLV) { renderAll(); }
  else if (FLOOR == null) { renderHome(); } else { renderFloor(); }
  if (SHEET) refreshSheet();
}

/* One animation class, taken off when it finishes so it can be given again.
   Reading offsetWidth in between is what makes the browser start it over
   rather than ignore a class it already had. */
function playScr(el, cls) {
  el.classList.remove('scr-in', 'scr-out');
  void el.offsetWidth;
  el.classList.add(cls);
}

function renderHome() {
  $('floor').hidden = true;
  $('all').hidden = true;
  $('all-body').innerHTML = '';      // unmounted, like a floor
  /* UNMOUNTED, not hidden. The one hard rule of this page is that a floor's
     units are never in the document unless that floor is open. */
  $('units').innerHTML = '';
  $('home').hidden = false;
  if (BACKING) { BACKING = false; playScr($('home'), 'scr-out'); }

  var tot = 0, av = 0;
  $('floors').innerHTML = (P.floors || []).map(function (f, i) {
    tot += Number(f.total || 0); av += Number(f.available || 0);
    var n = Number(f.available || 0), t = Number(f.total || 0);
    /* The count is the headline of the chip and the floor name is the caption,
       because nobody scans this grid looking for the word "Second". */
    return '<button data-f="' + i + '" style="--i:' + i + '"' +
      (n ? '' : ' class="empty"') + '>' +
      '<span class="fn">' + esc(f.floor_label) + '</span>' +
      '<span class="fr">' +
        (n ? '<span class="fv num">' + n + '</span>' +
             '<span class="fc">of ' + t + '</span>'
           : '<span class="fv">None free</span>' +
             '<span class="fc">of ' + t + '</span>') +
      '</span>' +
      '</button>';
  }).join('');

  /* One quiet line, because the seven chips above already carry the weight
     and screen one has to stay whole on a phone. */
  $('allrow').innerHTML =
    '<button class="all-chip" data-all="1">' +
      '<span class="ac-t">All units</span>' +
      '<span class="ac-m"><b class="num">' + av + '</b> of ' +
        '<span class="num">' + tot + '</span> \u00b7 every floor</span>' +
      '<span class="ac-x"><i></i></span>' +
    '</button>';

  paintHero(av, tot);

  /* ONCE. The entrance belongs to the first time these chips exist, not to
     every two-minute refetch — a grid that re-animates itself while somebody
     is reading it is the page fidgeting. */
  if (!STAGGERED) {
    STAGGERED = true;
    var fl = $('floors');
    fl.classList.add('stagger');
    setTimeout(function () { fl.classList.remove('stagger'); }, 500);
  }

  runSearch();          // keep any query alive across a refetch
}

/* One number, one bar, one line of legend. The bar is the same fact drawn a
   second time for the eye that does not read digits; it is never the only
   place a number appears, so colour is never load-bearing on its own. */
function paintHero(av, tot) {
  var held = Math.max(0, tot - av);
  var pct = tot ? Math.round(av * 1000 / tot) / 10 : 0;
  var fw = tot ? (av * 100 / tot) : 0;
  $('hero').innerHTML =
    '<div class="hero-l">Available now</div>' +
    '<div class="hero-top">' +
      '<div class="hero-n">' + av + '</div>' +
      '<div class="hero-p">of ' + tot + (tot ? ' · ' + pct + '%' : '') + '</div>' +
    '</div>' +
    '<div class="bar"><i class="free" style="width:' + fw + '%"></i>' +
      '<i class="held" style="width:' + (100 - fw) + '%"></i></div>' +
    '<div class="hero-f">' +
      (held ? '<span><i class="dot held"></i><b>' + held + '</b> not available</span>'
            : '<span>Every unit is free</span>') +
    '</div>';
}

/* ── THE WHOLE BUILDING ───────────────────────────────────────────────────
   Every other decision on this page exists to avoid drawing 1,467 units,
   and this draws them. That is fine because a person asked for it by name,
   but it means the two things that keep it usable are not decoration:

   · the floor's own numbers ride WITH the floor, stuck to the top of the
     screen while you are inside it, so three hundred identical chips are
     never anonymous;
   · the filter cuts the list rather than tinting it, because on a phone the
     way to find the eleven held units among 1,467 is to be shown eleven.

   It is built as ONE string and assigned once. Appending floor by floor
   would lay the page out seven times. */
function renderAll() {
  $('home').hidden = true;
  $('res').hidden = true;
  $('floor').hidden = true;
  $('units').innerHTML = '';        // the one-floor screen stays unmounted
  var opening = $('all').hidden;
  $('all').hidden = false;
  if (opening) playScr($('all'), 'scr-in');

  var fl = P.floors || [];
  var tot = 0, av = 0;
  fl.forEach(function (f) { tot += Number(f.total || 0); av += Number(f.available || 0); });
  var held = Math.max(0, tot - av);

  $('all-head').innerHTML =
    '<div class="ah-r">' +
      '<div class="ah-c"><div class="ah-l">Floors</div>' +
        '<div class="ah-v num">' + fl.length + '</div></div>' +
      '<div class="ah-c"><div class="ah-l">Units</div>' +
        '<div class="ah-v num">' + tot + '</div></div>' +
      '<div class="ah-c"><div class="ah-l">Not available</div>' +
        '<div class="ah-v num held">' + held + '</div></div>' +
      '<div class="ah-c"><div class="ah-l">Available</div>' +
        '<div class="ah-v num">' + av + '</div></div>' +
    '</div>';

  $('all-filter').innerHTML = [
    ['all',  'All'],
    ['free', 'Available'],
    ['held', 'Not available']
  ].map(function (o) {
    return '<button data-f="' + o[0] + '"' + (ALLF === o[0] ? ' class="on"' : '') +
           '>' + o[1] + '</button>';
  }).join('');

  var shown = 0;
  var html = fl.map(function (f, fi) {
    var units = (f.units || []).filter(function (u) {
      if (ALLF === 'free') return u.s === 'available';
      if (ALLF === 'held') return u.s !== 'available';
      return true;
    });
    if (!units.length) return '';
    shown += units.length;
    var t = Number(f.total || 0), a = Number(f.available || 0), h = Math.max(0, t - a);
    return '<div class="as">' +
      '<div class="as-h">' +
        '<span class="as-n">' + esc(f.floor_label) + '</span>' +
        '<span class="as-m">' +
          '<b class="num">' + t + '</b> units' +
          ' \u00b7 <b class="num held">' + h + '</b> not available' +
          ' \u00b7 <b class="num">' + a + '</b> available' +
        '</span>' +
      '</div>' +
      '<div class="ug">' +
        units.map(function (u) {
          var off = u.s !== 'available';
          return '<button data-u="' + esc(u.n) + '" data-fi="' + fi + '"' +
            (off ? ' class="off" disabled' : '') + '>' +
            '<span class="un">' + esc(u.n) + '</span>' +
            (off ? '<span class="off-l">Not Available</span>'
                 : '<span class="ua">' + esc(area(u)) + '</span>') +
          '</button>';
        }).join('') +
      '</div>' +
    '</div>';
  }).join('');

  $('all-body').innerHTML = html;
  $('all-empty').hidden = !!shown;
  if (!shown) {
    $('all-empty').textContent = ALLF === 'held'
      ? 'Every unit in the building is available.'
      : 'Nothing is available in the building right now.';
  }
}

function renderFloor() {
  var f = P.floors[FLOOR];
  if (!f) { FLOOR = null; return renderHome(); }
  var opening = $('floor').hidden;
  $('all').hidden = true;
  $('all-body').innerHTML = '';
  $('home').hidden = true;
  $('res').hidden = true;
  $('floor').hidden = false;
  /* Only when the screen actually changes. A refetch while a floor is open
     must not slide it in again under the reader. */
  if (opening) playScr($('floor'), 'scr-in');
  $('fname').textContent = f.floor_label;
  $('fcount').innerHTML = '<b class="num">' + Number(f.available || 0) + '</b> of ' +
    '<span class="num">' + Number(f.total || 0) + '</span> available';
  $('showall').checked = SHOWALL;

  var list = (f.units || []).filter(function (u) {
    return SHOWALL || u.s === 'available';
  });

  $('units').innerHTML = list.map(function (u) {
    var off = u.s !== 'available';
    return '<button data-u="' + esc(u.n) + '"' + (off ? ' class="off" disabled' : '') + '>' +
      '<span class="un">' + esc(u.n) + '</span>' +
      (off ? '<span class="off-l">Not Available</span>'
           : '<span class="ua">' + esc(area(u)) + '</span>') +
    '</button>';
  }).join('');

  var none = !list.length;
  $('fempty').hidden = !none;
  if (none) {
    $('fempty').textContent = SHOWALL
      ? 'No units on this floor.'
      : 'Nothing available on this floor right now.';
  }
}

/* ── search: across every floor, entirely in the browser ─────────────────
   The payload is already here; a keystroke must never become a request. Empty
   query shows nothing at all — a list that appears before you have typed is
   noise, not help. */
function runSearch() {
  var q = String($('q').value || '').trim();
  var box = $('res');
  if (!q) { box.hidden = true; box.className = ''; box.innerHTML = ''; return; }
  /* The panel exists all along and is only unhidden, so the entrance has to
     be re-armed by hand or it plays exactly once in the life of the page. */
  var wasHidden = box.hidden;

  var k = norm(q), out = [];
  (P.floors || []).forEach(function (f, fi) {
    (f.units || []).forEach(function (u) {
      if (norm(u.n).indexOf(k) === 0) out.push({ u: u, f: f, fi: fi });
    });
  });
  /* Available first — this page exists to find something to sell. Within that,
     the order the payload already has, which is the order the building is
     walked. */
  out.sort(function (a, b) {
    var aa = a.u.s === 'available' ? 0 : 1, bb = b.u.s === 'available' ? 0 : 1;
    return aa - bb;
  });

  box.hidden = false;
  box.className = 'res';
  if (wasHidden) { void box.offsetWidth; }
  if (!out.length) {
    box.innerHTML = '<div class="res-none">No unit starts with ' + esc(q) + '.</div>';
    return;
  }
  var show = out.slice(0, 8);
  box.innerHTML = show.map(function (r, i) {
    var off = r.u.s !== 'available';
    return '<button class="res-r" data-i="' + i + '"' + (off ? ' disabled' : '') + '>' +
      '<span class="n">' + esc(r.u.n) + '</span>' +
      '<span class="f">' + esc(r.f.floor_label) + '</span>' +
      '<span class="a">' + (off ? 'Not Available' : esc(area(r.u))) + '</span>' +
    '</button>';
  }).join('') +
    (out.length > show.length
      ? '<div class="res-more">' + (out.length - show.length) + ' more — keep typing</div>'
      : '');
  box.__hits = show;
}

/* ── the request sheet ───────────────────────────────────────────────────── */
/* refCode() is gone. The ref is issued by the server when the request is
   written, so the number in the WhatsApp message is the number the desk holds.
   A ref invented in the browser was a number nobody could look up. */
/* Is this duration one of the chips, or something the rep typed? */
/* WHAT MAY BE ASKED FOR, and it is the server's list. A project that
   publishes nothing gets the sheet exactly as it was: a unit and a number of
   days, with the desk deciding what to call it. */
function choices() { return (P && P.choices) || []; }
function chosen() {
  var c = choices();
  if (!c.length) return null;
  for (var i = 0; i < c.length; i++) if (c[i].id === (SHEET && SHEET.choice)) return c[i];
  return c[0];
}
/* A permanent ask has no duration — that is the whole difference between
   "hold it for me" and "this one is gone". */
function askNeedsDays() { var t = chosen(); return !t || t.nature !== 'permanent'; }

function CUSTOM(d) { return [1, 3, 7].indexOf(Number(d)) < 0; }

/* One place decides which control is lit, so a chip and the box can never
   both look chosen. */
function markDur() {
  var box = $('dur'); if (!box) return;
  var all = box.querySelectorAll('button');
  for (var i = 0; i < all.length; i++) {
    all[i].classList.toggle('on', Number(all[i].getAttribute('data-d')) === Number(SHEET.days));
  }
  var cu = $('dcust');
  if (cu) cu.classList.toggle('on', CUSTOM(SHEET.days));
}

function initials(name) {
  var w = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!w.length) return 'AV';
  return (w[0][0] + (w.length > 1 ? w[w.length - 1][0] : (w[0][1] || ''))).toUpperCase();
}

function openSheet(unitNo, floorIdx) {
  clearTimeout(SENT_T); SENT_T = null;
  var f = P.floors[floorIdx];
  var u = (f.units || []).filter(function (x) { return x.n === unitNo; })[0];
  /* Tapping an unavailable unit does nothing at all — no sheet, no message. */
  if (!u || u.s !== 'available') return;
  var c0 = choices()[0];
  SHEET = { n: unitNo, fi: floorIdx, days: 7, ref: null,
            choice: c0 ? c0.id : null };
  if (c0 && c0.nature === 'permanent') SHEET.days = null;
  else if (c0 && c0.days) SHEET.days = Number(c0.days);
  paintSheet();
  $('scrim').classList.add('on');
  $('sheet').classList.add('on');
}
function closeSheet() {
  clearTimeout(SENT_T); SENT_T = null;
  SHEET = null;
  $('scrim').classList.remove('on');
  $('sheet').classList.remove('on');
}

function sheetUnit() {
  if (!SHEET) return null;
  var f = P.floors[SHEET.fi]; if (!f) return null;
  return (f.units || []).filter(function (x) { return x.n === SHEET.n; })[0] || null;
}

function message() {
  var u = sheetUnit(), f = P.floors[SHEET.fi];
  var L = [];
  L.push((P.project || 'Availability') + ' — Reservation Request');
  /* The server's ref, not one invented here. Without it the request did not
     register, and the line says so instead of printing a number nobody holds. */
  L.push(SHEET.ref ? ('Ref: ' + initials(P.project) + '-REQ-' + SHEET.ref)
                   : 'Ref: not registered \u2014 please confirm in the group');
  L.push('');
  L.push('Unit: ' + SHEET.n);
  L.push('Floor: ' + f.floor_label);
  L.push('Size: ' + (u ? area(u) : '—'));
  var t = chosen();
  if (t) L.push('Asking for: ' + t.label);
  if (askNeedsDays()) {
    L.push('Duration: ' + SHEET.days + ' day' + (SHEET.days === 1 ? '' : 's'));
  }
  if (NAME) L.push('Requested by: ' + NAME);
  L.push('');
  L.push('Please confirm.');
  return L.join('\n');
}

function paintSheet() {
  if (!SHEET) return;
  var u = sheetUnit(), f = P.floors[SHEET.fi];
  var gone = !u || u.s !== 'available';

  $('sheet').innerHTML =
    '<div class="sh-h"><div>' +
      '<div class="sh-n" id="sh-n">' + esc(SHEET.n) + '</div>' +
      '<div class="sh-m">' + esc(f.floor_label) +
        (u && area(u) ? ' · ' + esc(area(u)) : '') + '</div>' +
    '</div><button class="sh-x" id="sh-x" aria-label="Close">✕</button></div>' +

    (gone
      ? '<div class="gone">This unit is no longer available. It was taken while ' +
        'this was open.</div>'
      : (choices().length > 1
          ? '<div class="sh-l">What do you need?</div>' +
            '<div class="ask-k" id="ask-k">' +
              choices().map(function (c) {
                return '<button data-c="' + esc(c.id) + '"' +
                  (chosen() && chosen().id === c.id ? ' class="on"' : '') + '>' +
                  esc(c.label) + '</button>';
              }).join('') +
            '</div>'
          : '') +
        (askNeedsDays()
          ? '<div class="sh-l">Hold for</div>' +
        '<div class="dur" id="dur">' +
          [1, 3, 7].map(function (d) {
            return '<button data-d="' + d + '"' + (SHEET.days === d ? ' class="on"' : '') +
                   '>' + d + ' day' + (d === 1 ? '' : 's') + '</button>';
          }).join('') +
          /* Anything else the rep needs. inputmode=numeric so a phone opens the
             number pad rather than a keyboard. */
          '<input id="dcust" inputmode="numeric" maxlength="2" placeholder="\u2026" ' +
            'title="Any number of days, 1 to 90" ' +
            (CUSTOM(SHEET.days) ? 'class="on" value="' + SHEET.days + '"' : '') + '>' +
        '</div>'
          /* Nothing greyed out and nothing to ignore: a permanent ask simply
             does not have a duration, so the question is not on the screen. */
          : '<div class="ask-n">No end date \u2014 the desk decides and confirms.</div>')) +


    '<div class="acts">' +
      '<button id="wa" class="prim"' + (gone ? ' disabled' : '') + '>Done \u2014 send on WhatsApp</button>' +
      '<button id="cx">Cancel</button>' +
    '</div>' +
    '<div class="go-n">The unit is only held once you receive a confirmation.</div>';

  $('sh-x').onclick = closeSheet;
  /* Outside the not-gone branch on purpose: a unit that has just been taken
     still needs a way out of this sheet. */
  var cxb = $('cx'); if (cxb) cxb.onclick = closeSheet;
  if (!gone) {
    /* GUARDED, because a permanent ask has no duration and therefore no
       #dur to wire. Unguarded it threw here and took every listener below
       it with it — including the choice row, so the sheet stopped
       responding the moment somebody picked Sold. */
    var durb = $('dur');
    if (durb) durb.onclick = function (e) {
      var b = e.target.closest('button[data-d]'); if (!b) return;
      SHEET.days = Number(b.getAttribute('data-d'));
      var cu = $('dcust'); if (cu) { cu.value = ''; cu.classList.remove('on'); }
      markDur();
    };
    var cust = durb ? $('dcust') : null;
    if (cust) cust.addEventListener('input', function () {
      /* Out of range does not silently become something else: the box keeps
         what was typed until it is a number this can honour, and the chips
         only let go once it is. */
      var n = parseInt(cust.value, 10);
      if (!(n >= 1 && n <= 90)) { cust.classList.remove('on'); return; }
      SHEET.days = n;
      markDur();
    });
    /* Leaving an unusable number behind would send a duration nobody chose. */
    if (cust) cust.addEventListener('blur', function () {
      var n = parseInt(cust.value, 10);
      if (!(n >= 1 && n <= 90)) { cust.value = ''; cust.classList.remove('on'); markDur(); }
    });
    /* One action. It registers the request and hands the dealer the message
       in the same tap — there is nothing else here to press. */
    var kb = $('ask-k');
    if (kb) kb.onclick = function (e) {
      var b = e.target.closest('button[data-c]'); if (!b) return;
      SHEET.choice = b.getAttribute('data-c');
      var t = chosen();
      /* Each choice brings its own default: a permanent one has none, and a
         timed one arrives on the number the tenant set for it. */
      SHEET.days = (t && t.nature === 'permanent') ? null
                 : Number((t && t.days) || 7);
      paintSheet();
    };
    $('wa').onclick = function () { requestAndSend('wa'); };
  }
}

/* THE REQUEST REACHES THE DESK, and the WhatsApp message is the receipt.

   The row is written FIRST so the Ref printed in the message is the one the
   desk holds — a ref invented here and never registered would be a number the
   dealer reads out that nobody can find.

   If the write fails, the message still goes. That is exactly how this worked
   before the queue existed, so a dealer is never blocked by our server being
   unreachable — but the message says so, and a toast says so, rather than
   letting them believe a request is waiting when it is not. */
var SENDING = false;
async function submitRequest() {
  if (!SHEET) return null;
  try {
    var r = await sb.rpc('submit_availability_request', {
      p_token: TOKEN, p_unit_no: SHEET.n, p_days: SHEET.days, p_name: NAME || null,
      /* An ASK, not a decision. The server re-derives it against this link's
         own project and a director still applies it. */
      p_status_id: SHEET.choice || null });
    var d = r && r.data;
    if (d && d.success) {
      SHEET.ref = d.ref;
      var list = readReqs().filter(function (x) { return x.ref !== d.ref; });
      list.unshift({ ref: d.ref, unit: SHEET.n, days: SHEET.days, status: 'pending',
                     /* kept beside the ref so a permanent ask, which has no
                        number of days, still reads as a sentence here. */
                     asked: d.asked || null });
      REQS = list; writeReqs(list); paintMyReqs();
      return { ok: true, already: !!d.already };
    }
    return { ok: false, error: (d && d.error) || 'failed',
             message: (d && d.message) || null };
  } catch (e) { return { ok: false, error: 'offline' }; }
}

async function requestAndSend(how) {
  if (!SHEET || SENDING) return;
  /* If the name was skipped earlier, ask HERE — this is the moment it means
     something, and the desk is useless without it. Once given it is final,
     the same as if it had been given on the first screen. */
  if (!NAME) { askNameInSheet(how); return; }

  SENDING = true;
  var go = document.getElementById('wa');
  var goWas = go ? go.textContent : '';
  if (go) { go.disabled = true; go.textContent = 'Sending\u2026'; }
  var res = await submitRequest();
  SENDING = false;
  if (go) { go.disabled = false; go.textContent = goWas; }

  if (res && !res.ok) {
    if (res.error === 'unit_unavailable') { toast('That unit has just been taken.'); return refreshSheet(); }
    if (res.error === 'queue_full' || res.error === 'too_many') { toast(res.message); return; }
    if (res.error === 'not_available') { toast('This link is no longer active.'); return; }
    /* offline or unknown: send anyway, and say the desk has not got it */
    toast('Sent, but the desk has not registered it \u2014 please confirm in the group.');
    SHEET.ref = null;
  } else if (res && res.already) {
    toast('A request for this unit is already waiting.');
  }
  if (how === 'copy') {
    window._portalCopy(message(),
      'Request copied \u2014 paste it into the group.',
      'Could not copy. Select the text and copy it by hand.');
  } else { sendWhatsApp(); }

  /* AN ENDING, NOT AN ABSENCE. The sheet closing on its own reads as a
     dismissal; a second of confirmation first tells the dealer the ask is
     registered and what the number is. Only when the desk actually has it. */
  if (res && res.ok && SHEET && SHEET.ref) { showSent(); return; }
  paintSheet();
}

function showSent() {
  var host = document.getElementById('sheet');
  var ref = initials(P && P.project) + '-REQ-' + (SHEET.ref || '');
  host.innerHTML =
    '<div class="done">' +
      '<div class="done-k"><i></i></div>' +
      '<div class="done-t">Request sent</div>' +
      '<div class="done-s">' + esc(SHEET.n) + ' \u00b7 ' + esc(ref) + '<br>' +
        'The desk will confirm. The unit is not held until they do.</div>' +
    '</div>';
  SENT_T = setTimeout(function () { if (SHEET) closeSheet(); }, 1600);
}

function askNameInSheet(how) {
  var host = document.getElementById('sheet');
  if (document.getElementById('ask-in')) { document.getElementById('ask-in').focus(); return; }
  var box = document.createElement('div');
  box.className = 'ask';
  box.innerHTML =
    '<div class="ask-t">Your name, so the desk knows who asked</div>' +
    '<div class="ask-r"><input id="ask-in" type="text" autocomplete="name" ' +
      'placeholder="e.g. Fawad khan"><button class="go" id="ask-ok" ' +
      'style="width:auto;margin:0;padding:0 18px;height:42px">Save</button></div>';
  host.appendChild(box);
  var input = document.getElementById('ask-in');
  try { input.focus(); } catch (e) {}
  function save() {
    var v = String(input.value || '').trim();
    if (!v) { try { input.focus(); } catch (e) {} return; }
    NAME = v; writeName(v); markAsked(); paintNameAsk();
    box.remove();
    requestAndSend(how);
  }
  document.getElementById('ask-ok').onclick = save;
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
  });
}

function sendWhatsApp() {
  /* No number in the URL, so WhatsApp asks which chat — the dealer picks their
     own group. On desktop this opens a page that may do nothing visible, which
     is exactly why Copy sits beside it at the same size rather than behind a
     failure. */
  var url = 'https://wa.me/?text=' + encodeURIComponent(message());
  try { window.open(url, '_blank', 'noopener'); } catch (e) { location.href = url; }
}

/* A refetch can land while the sheet is open. If the unit went in the meantime
   the sheet must say so and the button must stop working — sending a request
   for a unit that is already gone wastes a reply from the desk. */
function refreshSheet() { paintSheet(); }

/* ── wiring ──────────────────────────────────────────────────────────────── */
$('q').addEventListener('input', runSearch);
$('res').addEventListener('click', function (e) {
  var b = e.target.closest('.res-r'); if (!b || b.disabled) return;
  var hits = $('res').__hits || [];
  var r = hits[Number(b.getAttribute('data-i'))]; if (!r) return;
  openSheet(r.u.n, r.fi);
});
$('floors').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-f]'); if (!b) return;
  FLOOR = Number(b.getAttribute('data-f'));
  SHOWALL = false;
  $('q').value = ''; runSearch();
  renderFloor();
  window.scrollTo(0, 0);
});
/* The chip lives inside the floor grid, so its click arrives on the same
   listener; it is read first because it carries no data-f. */
$('allrow').addEventListener('click', function (e) {
  if (!e.target.closest('[data-all]')) return;
  ALLV = true; FLOOR = null; renderAll(); window.scrollTo(0, 0);
});

$('all-back').onclick = function () {
  ALLV = false; BACKING = true;
  renderHome(); window.scrollTo(0, 0);
};

$('all-filter').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-f]'); if (!b) return;
  ALLF = b.getAttribute('data-f');
  renderAll();
  /* Back to the top: the list under the filter is a different list, and
     leaving the reader halfway down the old one is a different building. */
  window.scrollTo(0, 0);
});

$('all-body').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-u]'); if (!b || b.disabled) return;
  openSheet(b.getAttribute('data-u'), Number(b.getAttribute('data-fi')));
});

$('back').onclick = function () {
  BACKING = true;
  FLOOR = null; renderHome(); window.scrollTo(0, 0);
};
$('showall').addEventListener('change', function () {
  SHOWALL = !!$('showall').checked;
  renderFloor();
});
$('units').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-u]'); if (!b || b.disabled) return;
  openSheet(b.getAttribute('data-u'), FLOOR);
});
$('scrim').onclick = closeSheet;
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && SHEET) closeSheet();
});

/* ── go ──────────────────────────────────────────────────────────────────── */
NAME = readName();
REQS = readReqs();
/* The screenshot harness renders a CAPTURED payload so the scale screens can be
   photographed without an Awami link being created. ?preview=1 only stops this
   page from fetching on its own — it grants nothing, reveals nothing, and
   leaves the page blank until a script hands it data. */
var PREVIEW = new URLSearchParams(location.search).get('preview') === '1';
if (PREVIEW) { /* wait for _availPreview */ }
else if (!TOKEN) { dead(); }
else { load(true).then(schedule); }

/* the harness renders against a captured payload so the scale screens can be
   photographed without an Awami link being created */
window._availPreview = function (payload) {
  P = payload; FETCHED = Date.now(); STALE = false;
  $('boot').hidden = true; $('app').hidden = false;
  FLOOR = null; SHEET = null; SHOWALL = false;
  REQS = readReqs();
  render();
  return (P.floors || []).length;
};
</script>
</body>
