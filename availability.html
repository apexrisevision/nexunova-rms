<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Availability</title>
<link rel="icon" href="/assets/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/favicon-180.png">

<style>
/* ══ THE WHOLE POINT OF THIS PAGE ═════════════════════════════════════════
   A dealer opens it in a WhatsApp group on a mid-range Android phone. They
   already know the unit they want, or they know the floor. They must NEVER be
   shown 1,467 units — the building's size is our problem, not theirs.

   So: screen one is the building (a search box and seven floor chips, nothing
   else, no scrolling), screen two is ONE floor. No screen ever holds more than
   one floor's units, and switching floors unmounts the last one.

   THE VISUAL RULES, and they are short on purpose:

   · One family, the system stack. No webfont, because 40KB of Inter is four
     seconds of a 3G first paint and weight and size already carry hierarchy.
   · One accent, and it does exactly two jobs: the thing you press, and the
     ring around whatever has focus. Nowhere else.
   · Cards are white ON a warmer near-white ground, with NO border. One or the
     other, never both, and never a shadow underneath.
   · Availability is contrast and weight, not colour. The bar under the count
     is ink at two strengths.
   · Every animation is caused by a finger, lasts under 300ms, and happens
     once. Nothing on this page moves by itself.
   ════════════════════════════════════════════════════════════════════════ */

:root{
  /* A warmer, slightly deeper ground so a pure-white card separates on its
     own. This is what buys the borderless surface. */
  --bg:#F5F5F4;
  --card:#FFFFFF;
  --ink:#14171C;
  --soft:#565E6A;
  --mut:#8A919B;
  /* hairlines, for the few places a card is not enough: inputs and dividers */
  --line:#E3E4E6;
  --hair:rgba(20,23,28,.07);
  --sunk:#EDEDEC;
  /* THE one accent */
  --accent:#1D4ED8;
  --accent-soft:#EDF2FE;
  --ring:rgba(29,78,216,.18);
  /* Held is deliberately low-chroma. It has to be distinguishable at arm's
     length in sunlight without ever being the loudest thing on the screen. */
  --held:#8A6224;
  --held-bg:#F3EEE5;
  --warn:#8A5300;

  --r:12px;
  --r-lg:20px;
  --pad:18px;

  --ease:cubic-bezier(.2,.7,.3,1);
  --t-fast:120ms;
  --t:160ms;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1013; --card:#171A1F; --ink:#EDEFF2; --soft:#A2A9B4; --mut:#79808A;
    --line:#272B31; --hair:rgba(255,255,255,.07); --sunk:#1C1F24;
    --accent:#7AA2FF; --accent-soft:#161C28; --ring:rgba(122,162,255,.22);
    --held:#C99A55; --held-bg:#221C13;
    --warn:#D9A441;
  }
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  /* Every number on this page lines up under every other one, everywhere,
     without being asked for again. */
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
  padding:0 0 env(safe-area-inset-bottom);
}
button,input{font:inherit;color:inherit;font-variant-numeric:inherit}
button{cursor:pointer;background:none;border:0}
.num{font-variant-numeric:tabular-nums}

/* THE SCALE. Six steps, and nothing on the page is allowed a size that is not
   one of them. Large text tracks tighter, small caps track looser. */
.t-display{font-size:26px;font-weight:700;letter-spacing:-.028em;line-height:1.12}
.t-title  {font-size:20px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
.t-fig    {font-size:22px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.t-body   {font-size:14.5px;line-height:1.55}
.t-cap    {font-size:12px;color:var(--mut);line-height:1.55}
.t-lab    {font-size:10.5px;font-weight:650;letter-spacing:.11em;
           text-transform:uppercase;color:var(--mut);line-height:1.2}

/* ── the frame ──────────────────────────────────────────────────────────── */
.wrap{max-width:520px;margin:0 auto;padding:15px var(--pad) 40px}

.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
    margin-bottom:15px}
.hd-t{font-size:26px;font-weight:700;letter-spacing:-.028em;line-height:1.12}
.hd-c{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.5}
.hd-u{font-size:11px;color:var(--mut);white-space:nowrap;flex:none;padding-top:7px;
      transition:color var(--t) var(--ease)}
/* A refetch that failed must SAY the data is old rather than keep a confident
   timestamp that quietly stopped being true. A change of tone, no banner. */
.hd-u.stale{color:var(--warn)}

/* ── the reading ─────────────────────────────────────────────────────────
   Not a card and not a headline. The search below is the focal point of this
   screen, so this states the position and gets out of the way. */
.hero{margin-bottom:15px}
.hero-top{display:flex;align-items:baseline;gap:10px}
.hero-l{font-size:10.5px;font-weight:650;letter-spacing:.11em;text-transform:uppercase;
        color:var(--mut);line-height:1.2;margin-bottom:6px}
.hero-n{font-size:22px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.hero-p{font-size:12px;color:var(--mut)}
/* Ink at two strengths, not two hues. Availability is contrast here. */
.bar{display:flex;height:3px;border-radius:999px;overflow:hidden;background:var(--sunk);
     margin:9px 0 7px}
.bar i{display:block;height:100%}
.bar .free{background:var(--ink);opacity:.28}
.bar .held{background:transparent}
.hero-f{display:flex;align-items:center;gap:11px;flex-wrap:wrap;font-size:11.5px;
        color:var(--mut);line-height:1.4}
.hero-f b{font-weight:650;color:var(--soft)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;
     vertical-align:1px}
.dot.free{background:var(--ink);opacity:.28}
.dot.held{background:var(--sunk);box-shadow:inset 0 0 0 1px var(--hair)}
.tot{margin-top:16px;font-size:12px;color:var(--mut);text-align:center}

/* ── search: THE focal point of screen one ──────────────────────────────── */
.sr{position:relative;margin-bottom:17px}
.sr input{
  width:100%;height:58px;padding:0 18px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--card);font-size:16.5px;font-weight:500;
  letter-spacing:-.01em;outline:none;
  transition:border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
/* A ring, never a shadow: the same job without pretending the field floats. */
.sr input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}
.sr input::placeholder{color:var(--mut);font-weight:400}

.res{margin-top:10px;border-radius:var(--r);background:var(--card);overflow:hidden;
     animation:fade var(--t) var(--ease) both}
.res-r{display:flex;align-items:baseline;gap:12px;width:100%;padding:14px 16px;
       border-bottom:1px solid var(--hair);text-align:left;min-height:48px;
       transition:background var(--t-fast) var(--ease)}
.res-r:last-child{border-bottom:0}
.res-r:active{background:var(--sunk)}
.res-r .n{font-weight:650;font-size:14.5px;min-width:76px;letter-spacing:-.01em}
.res-r .f{flex:1;min-width:0;font-size:12.5px;color:var(--soft);
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-r .a{font-size:12px;color:var(--mut);white-space:nowrap}
.res-r[disabled]{cursor:default;background:var(--held-bg)}
.res-r[disabled]:active{background:var(--held-bg)}
.res-r[disabled] .n{color:var(--held);font-weight:600}
/* A held row must not read differently here than on the floor grid, or the
   two screens are describing two different buildings. */
.res-r[disabled] .a{color:var(--held);font-weight:650;font-size:10px;
                    letter-spacing:.08em;text-transform:uppercase}
.res-more{padding:12px 16px;font-size:12px;color:var(--mut);border-top:1px solid var(--hair)}
/* An empty search is not an error. One quiet line, centred, and no red. */
.res-none{padding:26px 16px;font-size:13.5px;color:var(--mut);text-align:center;line-height:1.6}

/* ── floor chips ────────────────────────────────────────────────────────── */
.fl{display:grid;grid-template-columns:1fr 1fr;gap:7px}
/* The chip carries a fourth line now — what the rest of the floor is — so it
   is a little taller and a little tighter. Screen one still has to hold the
   whole building without becoming a scroll, and the harness measures that. */
.fl button{
  padding:9px 14px 8px;border:0;border-radius:var(--r);
  background:var(--card);text-align:left;min-height:74px;
  display:flex;flex-direction:column;justify-content:center;
  transition:background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
/* The tactile press. This, more than anything else here, is what makes a page
   feel like an application rather than a document on a phone. */
@media (hover:hover){ .fl button:hover{background:#FDFDFD} }
/* AFTER the hover rule, not before. Same specificity means the last one
   wins, and a mouse is hovering at the moment it presses — so a press
   declared first shows the hover tint and the tactile answer is lost on
   every device that has a cursor. */
.fl button:active{transform:scale(.975);background:var(--sunk)}
.fl .fn{font-size:14.5px;font-weight:650;letter-spacing:-.015em;line-height:1.25;
        color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .fr{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.fl .fv{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.fl .fc{font-size:11.5px;color:var(--mut);line-height:1.4}
/* WHAT THE REST OF THE FLOOR IS, under the number a dealer came for. Small
   enough that the count still reads first, coloured the same way the plate
   colours the shops themselves. */
.fl .fk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px}
.fl .fk-i{display:inline-flex;align-items:center;gap:4px;font-size:10px;
          font-weight:650;color:var(--t,var(--mut));line-height:1.2}
.fl .fk-i i{width:6px;height:6px;border-radius:2px;background:var(--t,var(--mut));display:block}
.fl button.empty .fk-i{opacity:.9}
/* A floor with nothing free is not an error, it is just finished. It sinks
   rather than shouting. */
.fl button.empty{background:var(--held-bg)}
@media (hover:hover){ .fl button.empty:hover{background:var(--held-bg)} }
.fl button.empty:active{background:var(--held-bg);transform:scale(.975)}
.fl button.empty .fv{font-size:14.5px;font-weight:600;color:var(--held);letter-spacing:-.01em}
.fl button.empty .fc{color:var(--held);opacity:.75}
.fl button.empty .fn{color:var(--held)}

/* A BRIEF ENTRANCE, ONCE. Added by the first paint and taken off immediately,
   so a refetch two minutes later never repeats it. */
.fl.stagger button{animation:rise 180ms var(--ease) both;
                   animation-delay:calc(var(--i,0) * 30ms)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ── SKELETON ────────────────────────────────────────────────────────────
   Matched to the real thing's dimensions, so the page does not jump when the
   payload lands. It does not shimmer: a looping animation on a first paint is
   the page telling the user to look at it while it has nothing to say. */
.sk{border-radius:var(--r);background:var(--card)}
.sk-line{border-radius:6px;background:var(--sunk)}
.sk-hd{height:29px;width:62%;margin-bottom:9px}
.sk-co{height:13px;width:40%;margin-bottom:15px}
.sk-hero{height:14px;width:34%;margin-bottom:11px}
.sk-bar{height:3px;width:100%;border-radius:999px;margin-bottom:8px}
.sk-leg{height:13px;width:56%;margin-bottom:15px}
.sk-sr{height:58px;width:100%;margin-bottom:17px;border-radius:var(--r)}
.sk-fl{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sk-ch{height:74px;border-radius:var(--r)}

/* ── SCREEN TRANSITION — user-initiated, one way in, one way back ───────── */
.scr-in {animation:scrIn  var(--t) var(--ease) both}
.scr-out{animation:scrOut var(--t) var(--ease) both}
@keyframes scrIn {from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes scrOut{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}

/* What this phone has asked for, and what came back. Quiet: it is a receipt,
   not the point of the page. */
.myq{margin-bottom:22px;border-radius:var(--r);background:var(--card);overflow:hidden}
.myq-h{padding:12px 16px 10px;font-size:10.5px;font-weight:650;letter-spacing:.11em;
       text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--hair)}
.myq-r{display:flex;align-items:baseline;gap:11px;padding:12px 16px;
       border-bottom:1px solid var(--hair);font-size:13px}
.myq-r:last-child{border-bottom:0}
.myq-r .u{font-weight:650;min-width:70px;letter-spacing:-.01em}
.myq-r .d b.soon{color:var(--held);font-weight:650}
.myq-r .d{flex:1;min-width:0;font-size:12px;color:var(--mut);
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.myq-r .s{font-size:11.5px;font-weight:650;white-space:nowrap}
/* The ask sits under the row it is about, quiet until it is opened. */
.myq-c{padding:0 16px 12px}
.myq-ask{height:34px;padding:0 12px;border-radius:var(--r);background:var(--sunk);
         font-size:12.5px;font-weight:600;color:var(--soft);
         transition:transform var(--t-fast) var(--ease)}
.myq-ask:active{transform:scale(.97)}
.myq-c.open{padding-bottom:14px}
.myq-h2{font-size:10.5px;font-weight:650;letter-spacing:.11em;text-transform:uppercase;
        color:var(--mut);margin-bottom:8px}
.myq-c input{width:100%;height:46px;padding:0 14px;border:1px solid var(--line);
             border-radius:var(--r);background:var(--card);font-size:15px;outline:none}
.myq-c input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}
.myq-b{display:flex;gap:8px;margin-top:9px}
.myq-b button{height:44px;padding:0 16px;border-radius:var(--r);background:var(--sunk);
              font-size:13.5px;font-weight:600;color:var(--soft);
              transition:transform var(--t-fast) var(--ease)}
.myq-b button:active{transform:scale(.985)}
.myq-b .prim{flex:1;background:var(--accent);color:#fff}
.myq-b .prim:disabled{opacity:.45}
/* Said plainly, because a dealer typing "sold" must not think they set it. */
.myq-n{margin-top:9px;font-size:11.5px;color:var(--mut);line-height:1.5}
.mine-n{margin:14px 4px 0;font-size:12px;color:var(--mut);line-height:1.55}

/* YOUR OWN POSITION, at the top of the page you already have open. A dealer
   holding fourteen units had to count them off a list of requests, and the
   one thing they actually watch — how long before a hold lets go — was on no
   screen at all. */
.myq-s{padding:14px 16px 15px;border-bottom:1px solid var(--line)}
.myq-s .n{display:block;font-size:26px;font-weight:700;letter-spacing:-.025em;
          line-height:1.1;color:var(--ink)}
.myq-s .n small{font-size:13px;font-weight:600;color:var(--mut);letter-spacing:-.01em;
                margin-left:7px}
.myq-t{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.myq-t span{display:inline-flex;align-items:baseline;gap:5px;padding:4px 10px;
            border-radius:999px;background:var(--sunk);font-size:12px;color:var(--soft)}
.myq-t span b{font-weight:700;color:var(--ink);font-size:12.5px}
.myq-w{margin-top:11px;font-size:12.5px;line-height:1.5;color:var(--soft)}
.myq-w b{color:var(--ink);font-weight:650}
.myq-w.soon b{color:var(--held)}
.myq-r .t{font-size:11.5px;color:var(--mut);white-space:nowrap}
.s-pending{color:var(--mut)}
.s-approved,.s-held{color:#1C6B3F}
.s-declined{color:#8A2F26}
/* Neither green nor red: nothing went wrong, the hold is simply over. */
.s-ended{color:var(--held)}
.s-stale,.s-expired{color:var(--mut);text-decoration:line-through}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .s-approved,
  :root:not([data-theme="light"]) .s-held{color:#5FCB90}
  :root:not([data-theme="light"]) .s-declined{color:#E58A7E}
}

/* Asked in the sheet, at the moment it matters, if it was skipped earlier. */
.ask{margin-top:18px;padding:14px;border-radius:var(--r);background:var(--sunk)}
.ask-t{font-size:13px;font-weight:600;margin-bottom:10px;line-height:1.5}
.ask-r{display:flex;gap:9px}
.ask-r input{flex:1;height:46px;padding:0 14px;border:1px solid var(--line);
             border-radius:var(--r);background:var(--card);font-size:15.5px;outline:none}
.ask-r input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}

/* Desktop is not a wider phone, and it is not a phone floating in a field
   either. Above 760px the column widens and the floors go to three across, so
   the seven of them read as a building rather than a list that ran out. */
@media (min-width:760px){
  .wrap{max-width:760px;padding:40px 28px 56px}
  .hd{margin-bottom:28px}
  .hd-t{font-size:28px}
  .hero{margin-bottom:26px}
  .sr{margin-bottom:30px}
  .fl{grid-template-columns:repeat(3,1fr);gap:12px}
  .fl button{min-height:92px;padding:17px 18px}
  .sr input{height:60px}
  .ug{grid-template-columns:repeat(8,1fr);gap:9px}
  .ug.money{grid-template-columns:repeat(6,1fr)}
}

/* ── one floor ──────────────────────────────────────────────────────────── */
.ft{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.bk{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 16px 0 13px;
    margin-left:0;border-radius:var(--r);background:var(--card);
    font-size:15px;font-weight:650;letter-spacing:-.01em;color:var(--ink);
    transition:background var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
@media (hover:hover){ .bk:hover{background:#FDFDFD} }
.bk:active{background:var(--sunk);transform:scale(.97)}
.bk i{width:8px;height:8px;border-left:2px solid currentColor;
      border-bottom:2px solid currentColor;transform:rotate(45deg);display:inline-block}
.fh{display:flex;align-items:baseline;gap:11px;margin:10px 0 18px;flex-wrap:wrap}
.fh h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.028em;line-height:1.12}
.fh span{font-size:12.5px;color:var(--mut)}
.fh b{font-weight:650;color:var(--soft)}

/* Secondary on purpose: revealing what cannot be bought is not the reason
   anyone opened this. Still a 44px target. */
/* ══ THE FLOOR AS IT WAS DRAWN ══════════════════════════════════════════
   The architect's own linework, and one shape per unit laid over it. A chip
   grid can say a shop is free; it cannot say the shop is the third from the
   escalator on the corridor side, which is the thing anybody asks before they
   take one.

   The drawing is not redrawn. It is the same paths the sheet carries, with
   the traced lettering left out and put back as real text — which is also why
   it weighs 23 KB instead of nine megabytes. */
/* ── THE SHEET THE DRAWING SITS ON ───────────────────────────────────────
   Not a picture dropped on a page: a plate, with the floor named at its head,
   the count beside it, and the controls riding along as you go down two
   thousand pixels of building. The drawing inside it is untouched. */
.pvw{margin-top:12px;border:1px solid var(--line);border-radius:var(--r-lg);
     background:var(--card);box-shadow:0 1px 2px rgba(17,24,39,.04),
     0 22px 40px -30px rgba(17,24,39,.5)}
.pvh{display:flex;align-items:center;gap:12px;padding:14px 16px 12px}
.pvh>div:first-child{min-width:0}
.pvh .t{font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--ink);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvh .s{margin-top:2px;font-size:12px;color:var(--mut);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvh .sp{flex:1}
/* one control, two states, no question about which is showing */
.seg{display:flex;padding:3px;gap:3px;border-radius:999px;background:var(--sunk)}
.seg button{height:32px;padding:0 14px;border:0;border-radius:999px;background:transparent;
            font-size:12.5px;font-weight:650;color:var(--soft);cursor:pointer;
            transition:background var(--t) var(--ease),color var(--t) var(--ease)}
.seg button.on{background:var(--card);color:var(--ink);
               box-shadow:0 1px 2px rgba(17,24,39,.10)}
/* THE BAR THAT FOLLOWS YOU DOWN. A floor plate is taller than any phone, and
   a legend you have to scroll back up to read is a legend nobody reads. */
.pvc{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px;
     padding:10px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
     background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(12px);
     -webkit-backdrop-filter:saturate(180%) blur(12px)}
.pvc .sp{flex:1}
/* the legend IS the filter \u2014 the two things a reader wants are the same tap */
.key{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;
     border:1px solid var(--line);border-radius:999px;background:var(--card);
     font-size:12px;color:var(--soft);cursor:pointer;
     transition:opacity var(--t) var(--ease),border-color var(--t) var(--ease)}
.key i{width:11px;height:11px;border-radius:3px;display:block;border:1px solid transparent}
.key.free i{background:#fff;border-color:rgba(29,78,216,.45)}
/* ONE KEY PER STATUS, not one for "taken". The swatch is the status's own
   colour, set on the button, so the legend and the plate can never drift
   apart about what a Hold looks like. */
.key.held i{background:var(--t,#EFE7DA);border-color:var(--t,rgba(138,98,36,.5));opacity:.85}
.key.held b{color:var(--t,var(--ink))}
.key b{color:var(--ink);font-weight:700}
.key.off{opacity:.45}
.key.off b{color:var(--mut)}
.zc{display:flex;align-items:center;gap:2px;border:1px solid var(--line);
    border-radius:999px;background:var(--card);padding:2px}
.zc button{width:30px;height:28px;border:0;border-radius:999px;background:transparent;
           font-size:15px;font-weight:700;color:var(--soft);cursor:pointer;line-height:1}
.zc button:active{background:var(--sunk)}
.zc span{min-width:44px;text-align:center;font-size:11.5px;font-weight:650;color:var(--mut)}
.pvq{padding:10px 16px 0}
.pvq input{width:100%;height:40px;padding:0 14px;border:1px solid var(--line);
           border-radius:999px;background:var(--bg);font-size:13px;color:var(--ink)}
.pvq input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--ring);
                 background:var(--card)}
.pv{position:relative;margin:10px 0 0;border-radius:0 0 var(--r-lg) var(--r-lg);
    background:var(--card);overflow:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain}
/* NOTHING OVER THE DRAWING. A graph-paper ground was tried here and it read
   as a film laid across the plate: the architect's reds and magentas are
   already a light-weight line, and anything behind or over them takes the
   snap out of the whole sheet. The plate is white, the way it is printed. */
.pv .in{position:relative;transform-origin:0 0;background:#fff}
/* WHY THE DRAWING LOOKED SOFT. Every line on the sheet is 1.2 drawing units
   thick, and the plate is 514 units across. Fitted to a phone that is a
   stroke less than one pixel wide, and a sub-pixel line is not drawn thin —
   it is drawn grey, spread across two pixels by the antialiaser. A whole
   floor of them reads as a photocopy of a plan rather than a plan.

   non-scaling-stroke takes the line weight out of the drawing's units and
   puts it in screen pixels: 1.2px at every zoom, black where it is black
   and red where it is red. Not one coordinate moves — the shape of the
   map is exactly what the architect drew, and only the pen is held
   steady, which is what a CAD viewer does when you zoom out. */
.pv .base svg{shape-rendering:geometricPrecision}
/* AND THE WEIGHT ITSELF. The file carries stroke-width 0.28, which with a
   non-scaling stroke is 0.28 of a SCREEN pixel — no display can draw that, so
   every wall came out as a grey smear whatever the zoom. A hairline is one
   pixel; on a phone at three times density that is three crisp device pixels,
   and the plan finally reads as ink. */
.pv .base svg path{vector-effect:non-scaling-stroke;stroke-width:1px}
.pv.grab{cursor:grab}
.pv.grabbing{cursor:grabbing}
.pv svg{display:block;width:100%;height:auto}
.pv .base{position:relative;z-index:1}
.pv .over{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2}
/* Available units are simply open \u2014 the drawing shows through. Only what is
   gone is marked, because a page that tints everything says nothing. */
/* THE SHOP TAKES THE TAP AND NOTHING ELSE DOES. The label sits in the middle
   of the shop — exactly where a thumb lands — and the cross lies across it;
   both are drawn after the shape, so both were eating the tap and the shape
   only answered around its edges. A tap on a name is a tap on the shop. */
/* A FREE SHOP IS LEFT ALONE. The wash over every available shop was tinting
   the very thing it was meant to point at \u2014 168 translucent rectangles laid
   over an architect's linework is a veil, however faint each one is. Free is
   now the bright, untouched drawing; only what is GONE carries a colour, and
   that is the one thing a plan cannot say for itself. */
.pv .u{fill:rgba(29,78,216,.035);stroke:none;
       cursor:pointer;pointer-events:all;
       transition:fill var(--t-fast) var(--ease)}
.pv .x,.pv .n,.pv .base,.pv .base *{pointer-events:none}
/* A taken shop is washed in the colour of the hold that is on it. The wash is
   set on the shape itself, because the words are the tenant's. */
.pv .u.off{fill:rgba(138,98,36,.16)}
@media (hover:hover){.pv .u:not(.off):hover{fill:rgba(29,78,216,.16)}}
.pv .u:not(.off):active{fill:rgba(29,78,216,.22)}
/* WHAT YOU LAST ASKED ABOUT STAYS MARKED. Close the sheet on a floor of a
   hundred and sixty-eight and finding your place again is the whole job. */
.pv .u.sel{fill:rgba(29,78,216,.20);stroke:var(--accent);stroke-width:2}
/* and what you searched for says so, once, and then settles */
/* A FOUND SHOP IS RINGED, NOT FLASHED. The page holds itself to 300ms of
   movement anywhere, and a thing that blinks for three seconds to be noticed
   is a thing that was hard to find — the plate scrolls to it instead. */
.pv .u.hit{stroke:var(--accent);stroke-width:2.6;fill:rgba(29,78,216,.22)}
/* one tap on the legend and the other half steps back \u2014 the floor is suddenly
   a list of what you can actually sell */
.pv .dim{opacity:.1}
.pv .u,.pv .x,.pv .n{transition:opacity var(--t) var(--ease)}
/* fill:none is not the default here — a two-legged cross left to fill itself
   paints a solid triangle over the shop instead of an X across it.
   The stroke colour is set per shop, in the status's own colour, so a Sold and
   a Hold are told apart at a glance and not only by reading. */
.pv .x{fill:none;stroke:var(--held);stroke-width:1.6;opacity:.6;
       vector-effect:non-scaling-stroke;stroke-linecap:round}
/* AND EACH KIND IS MARKED ITS OWN WAY, not only its own colour. On a printed
   sheet, or to an eye that does not separate one hue from another, the shape
   of the mark is what carries: a sale is crossed solid, a hold dashed, a
   pagri dotted, anything else finely dashed. */
.pv .x.d-dash{stroke-dasharray:5 4}
.pv .x.d-dot{stroke-dasharray:.5 4.5}
.pv .x.d-fine{stroke-width:1.15;stroke-dasharray:9 3.5}
/* The label is the architect's own block — number, what the thing is, how big
   it is — and its size is set per shop in the markup, because a 500 sqft
   corner and a 170 sqft strip cannot carry the same lettering. The halo is in
   em so it thins with the text instead of swallowing it. */
.pv .n{font-weight:650;fill:var(--soft);text-anchor:middle;
       paint-order:stroke;stroke:#fff;stroke-width:.26em;stroke-linejoin:round}
.pv .n .s{font-size:.78em;font-weight:600;fill:var(--mut)}
.pv .n.off{fill:var(--held)}
.pv .n.off .s{fill:inherit;opacity:.7}
/* the status line keeps its colour at full strength — it is the answer to the
   question a dealer is asking when they look at a crossed-out shop */
.pv .n.off .s.k{font-weight:750;opacity:1}
.pv-n{padding:10px 16px 13px;font-size:11.5px;color:var(--mut);line-height:1.5}
/* the drawing arrives rather than appears \u2014 once, briefly, and never again */
.pv .over{animation:pvin .28s var(--ease) both}
@keyframes pvin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .pv .over{animation:none}.pv .u.hit{animation:none}}
.sw{display:inline-flex;align-items:center;gap:10px;margin-bottom:18px;
    height:44px;padding:0 16px;border-radius:999px;background:var(--card);
    font-size:12.5px;color:var(--soft);
    transition:background var(--t-fast) var(--ease)}
.sw:active{background:var(--sunk)}
.sw input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
.sw label{cursor:pointer;user-select:none}

/* FOUR TO A ROW UNTIL THEY CARRY MONEY. A chip with a rate and a total on it
   is twice the reading of one with a size, and eighty-five pixels will not
   hold "16,167,000". Three fit, and the floor is still a grid. */
.ug{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ug.money{grid-template-columns:repeat(3,1fr)}
@media (min-width:440px){ .ug{grid-template-columns:repeat(5,1fr)}
                          .ug.money{grid-template-columns:repeat(4,1fr)} }
.ug button{
  padding:11px 5px;border:0;border-radius:var(--r);background:var(--card);
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;
  justify-content:center;
  transition:background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
@media (hover:hover){ .ug button:hover{background:#FDFDFD} }
.ug button:active{transform:scale(.94);background:var(--sunk)}
.ug .un{font-size:13.5px;font-weight:650;letter-spacing:-.015em;line-height:1.2}
.ug .ua{font-size:10px;color:var(--mut);line-height:1.3}
/* the money on a chip: the total is the thing being compared, the rate is how
   it was arrived at, so one is ink and the other is quiet */
.ug .uv{font-size:11px;color:var(--ink);line-height:1.3;letter-spacing:-.01em}
.ug .ur{font-size:9.5px;color:var(--mut);line-height:1.3}
/* the money on a taken chip follows its own hold, so a Sold chip is not
   crimson at the top and amber at the bottom */
.ug button.off .uv{color:var(--t,var(--held));opacity:.85}
/* Held: a warm, muted ground. It says somebody has this without ever being
   the loudest thing on a screen of three hundred units. */
.ug button.off{background:var(--held-bg);cursor:default}
@media (hover:hover){ .ug button.off:hover{background:var(--held-bg)} }
.ug button.off:active{transform:none;background:var(--held-bg)}
.ug button.off .un{color:var(--held);font-weight:600}
.ug .off-l{font-size:9px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
           color:var(--held);opacity:.85;line-height:1.3}
/* WHAT KIND OF HOLD, AND ON WHOSE WORD. The status is a short word in its own
   colour — the colour is set per chip, because the words belong to the tenant
   and not to this stylesheet — and under it, quietly, the name it was held on.
   Both only ever appear on a unit that is already gone. */
.ug .us{font-size:8.5px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;
        color:#fff;background:var(--t,var(--held));border-radius:999px;
        padding:1.5px 7px;line-height:1.4;white-space:nowrap}
.ug .uw{font-size:9px;color:var(--mut);line-height:1.3;max-width:100%;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ug button.off .un{color:var(--t,var(--held))}

.empty{padding:34px 8px;text-align:center;color:var(--mut);font-size:13.5px;line-height:1.6}

/* ── THE ROOM BEHIND THE PASSWORD ────────────────────────────────────────
   A director's reading of the building, on the same link a dealer uses. It is
   deliberately plainer than the rest of this page: no colour that means
   nothing, no card that is only a card, and every number next to the words
   that say what it is. */
.hd-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.hd-d{border:1px solid rgba(179,18,60,.35);background:#FFF6F8;color:#b3123c;
      font-size:10px;font-weight:700;letter-spacing:.03em;padding:3px 9px;
      border-radius:999px;font-family:inherit;white-space:nowrap}
@media (hover:hover){ .hd-d:hover{background:#b3123c;color:#fff;border-color:#b3123c} }
.hd-d:active{transform:scale(.96)}
.dr-c{background:var(--card);border-radius:var(--r);padding:20px 18px 18px;margin-top:6px}
.dr-t{font-size:15px;font-weight:650;letter-spacing:-.01em}
.dr-s{font-size:12.5px;color:var(--mut);line-height:1.55;margin-top:5px}
.dr-f{display:flex;gap:8px;margin-top:14px}
.dr-f input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--hair);
            background:var(--bg);padding:0 13px;font-size:15px;font-family:inherit}
.dr-f input:focus{outline:none;border-color:var(--accent)}
.dr-f button{height:46px;padding:0 18px;border:0;border-radius:12px;background:var(--accent);
             color:#fff;font-size:14px;font-weight:650;font-family:inherit}
.dr-e{margin-top:10px;font-size:12.5px;color:#b3123c;line-height:1.5}

.rp{margin-top:14px}
.rp h2{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
       color:var(--mut);margin:22px 0 8px}
.rp .card{background:var(--card);border-radius:var(--r);padding:15px 16px}
/* the four readings at the head: a number and what it is, nothing else */
.rp .big{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.rp .big .b{background:var(--card);border-radius:var(--r);padding:13px 14px}
.rp .big .bn{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.rp .big .bl{font-size:11px;color:var(--mut);margin-top:2px;line-height:1.35}
.rp .big .bs{font-size:11px;color:var(--mut);margin-top:4px;line-height:1.35}
/* ── A ROW THAT IS A DOOR ─────────────────────────────────────────────────
   The first screen is a short list of these and nothing else. Each one names a
   thing, says what it is worth, and opens a page of its own. */
.rp .rows{display:flex;flex-direction:column;gap:6px}
.rp .row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
         background:var(--card);border:0;border-radius:var(--r);padding:13px 14px;
         font-family:inherit;color:inherit;
         transition:background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease)}
@media (hover:hover){ .rp .row:hover{background:#FDFDFD} }
.rp .row:active{transform:scale(.985);background:var(--sunk)}
.rp .r-d{width:9px;height:9px;border-radius:3px;background:var(--t,var(--held));flex:none}
.rp .r-m{flex:1;min-width:0}
.rp .r-t{display:block;font-size:14px;font-weight:650;letter-spacing:-.015em;line-height:1.3}
.rp .r-s{display:block;font-size:11.5px;color:var(--mut);line-height:1.45;margin-top:2px}
.rp .r-n{font-size:19px;font-weight:700;letter-spacing:-.02em;flex:none;
         font-variant-numeric:tabular-nums}
.rp .r-a{flex:none;width:7px;height:7px;border-right:1.6px solid var(--mut);
         border-top:1.6px solid var(--mut);transform:rotate(45deg);opacity:.5}
/* one plain sentence under a block, where a sentence says it better than a table */
.rp .say{font-size:12px;color:var(--mut);line-height:1.6;margin-top:9px}
.rp .say b{color:var(--soft);font-weight:650}
.rp .p-h{font-size:13.5px;line-height:1.6}
.rp .p-h b{font-weight:700}
.rp .p-p{margin-top:7px}

/* ── THE UNIT TABLE ───────────────────────────────────────────────────────
   The first cut ran its columns into one another; Rashid: "sab values aik
   dosray k bohat qaareeb placed hain". So the columns are given widths and
   real space between them, the numbers are tabular, and the last column is
   allowed to be the widest because a date is what the eye goes to. */
.rp table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.rp th{font-size:9.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
       color:var(--mut);text-align:right;padding:0 0 8px 10px;white-space:nowrap;
       overflow:hidden;text-overflow:clip}
.rp th:first-child{text-align:left;padding-left:0}
.rp td{padding:9px 0 9px 10px;border-top:1px solid var(--hair);text-align:right;
       font-variant-numeric:tabular-nums;vertical-align:middle;
       white-space:nowrap;overflow:hidden;text-overflow:clip}
.rp td:first-child{text-align:left;padding-left:0}
.rp td.nm{font-weight:650;letter-spacing:-.01em}
.rp td.w{text-align:left;color:var(--soft);font-size:11.5px;
         overflow:hidden;text-overflow:ellipsis}
.rp td.warn{color:#b3123c;font-weight:650}
.rp .c-u{width:22%} .rp .c-w{width:32%} .rp .c-v{width:22%} .rp .c-e{width:24%}
.rp .ft4 .c-f{width:40%} .rp .ft4 .c-n{width:20%}
.rp .w4 td{vertical-align:top}
.rp .w4 td:first-child{white-space:normal}
.rp .w4 .c-f{width:34%} .rp .w4 .c-n{width:22%}
/* ── A CARD PER FLOOR ─────────────────────────────────────────────────────
   Six numbers about one floor will not sit in six columns on a phone. Given
   its own block, each floor says all of them plainly: what it is worth at the
   top, the working underneath, and the two halves side by side. */
.rp .wl{display:flex;flex-direction:column;gap:7px}
.rp .wf{background:var(--card);border-radius:var(--r);padding:14px 15px}
.rp .wf-h{display:flex;align-items:baseline;gap:10px}
.rp .wf-n{flex:1;min-width:0;font-size:14.5px;font-weight:650;letter-spacing:-.015em}
.rp .wf-v{flex:none;font-size:16px;font-weight:700;letter-spacing:-.02em;
          font-variant-numeric:tabular-nums}
.rp .wf-s{font-size:11px;color:var(--mut);line-height:1.5;margin-top:3px}
.rp .wf .sh{margin:9px 0 11px}
.rp .wf-g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rp .wf-g > div{min-width:0}
.rp .g-l{display:block;font-size:9.5px;font-weight:650;letter-spacing:.06em;
         text-transform:uppercase;color:var(--mut)}
.rp .g-v{display:block;font-size:13.5px;font-weight:650;margin-top:3px;
         font-variant-numeric:tabular-nums}
.rp .g-s{display:block;font-size:10.5px;color:var(--mut);margin-top:2px}
.rp .wf-t{margin-top:9px;border:1.5px solid var(--ink)}
.rp .wf-t .wf-n, .rp .wf-t .wf-v{font-weight:750}
.rp tr.tot td{border-top:2px solid var(--ink);font-weight:700;padding-top:9px}
.rp .nm{font-weight:650;letter-spacing:-.01em;display:block}
.rp .sub{display:block;font-size:10px;color:var(--mut);font-weight:400;margin-top:3px;
         line-height:1.35;white-space:normal}
.rp .mut{color:var(--mut)}

.rp .pill{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.05em;
          text-transform:uppercase;color:#fff;background:var(--t,var(--held));
          border-radius:999px;padding:1.5px 7px;margin:0 4px 3px 0}
/* one bar, reused: share of a whole, drawn once so the eye can rank rows */
.rp .sh{display:block;height:4px;border-radius:2px;background:var(--sunk);
        margin-top:6px;overflow:hidden}
.rp .sh i{display:block;height:100%;background:var(--t,var(--accent))}

/* ── SAVE AS PDF ──────────────────────────────────────────────────────────
   The browser's own print, which is Save as PDF on every phone and every
   desktop, and is how the rest of this system makes its documents. */
.rp-x{display:flex;align-items:center;gap:12px;margin-top:18px}
.rp-x-t{flex:1;min-width:0;font-size:11.5px;color:var(--mut)}
.rp-pdf{flex:none;height:40px;padding:0 16px;border:1px solid var(--hair);border-radius:11px;
        background:var(--card);font-family:inherit;font-size:13px;font-weight:650;
        color:var(--ink)}
@media (hover:hover){ .rp-pdf:hover{background:var(--sunk)} }

/* ── THE DISCLAIMER ───────────────────────────────────────────────────────
   At the foot of every page in this room, on screen and on paper. It is meant
   to be read, so it is not grey six-point mouse type. */
.dis{margin:22px 0 34px;padding:15px 15px 16px;border:1px solid var(--hair);
     border-radius:var(--r);background:#FFFBFB}
.dis-h{font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;
       color:#b3123c;margin-bottom:9px}
.dis ul{margin:0;padding-left:17px}
.dis li{font-size:11.5px;color:var(--soft);line-height:1.65;margin-bottom:6px}
.dis li b{font-weight:700;color:var(--ink)}
.dis-f{margin-top:10px;padding-top:9px;border-top:1px solid var(--hair);
       font-size:10.5px;color:var(--mut)}

/* the letterhead: nothing on screen, the head of the page on paper */
.pr-h{display:none}

@media print {
  /* ONLY THE REPORT GOES ON THE PAPER. Everything else on this page is a way
     of getting to it. */
  body{background:#fff}
  .hd, .ft, #home, #all, #mine, #floor, #rep-gate, .rp-x, .toast, #sheet, #boot{display:none !important}
  .wrap{max-width:none;padding:0}
  #rep{display:block !important}
  .fh{margin:0 0 4px}
  .pr-h{display:block;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #111}
  .pr-t{font-size:17px;font-weight:750;letter-spacing:-.02em}
  .pr-p{font-size:12.5px;margin-top:3px}
  .pr-d{font-size:10.5px;color:#555;margin-top:3px}
  .rp .card, .rp .b, .rp .row{border:1px solid #ddd;background:#fff !important;
                              break-inside:avoid}
  .rp .row{page-break-inside:avoid}
  .rp h2{margin:14px 0 6px;color:#333}
  .rp table{font-size:10.5px}
  .rp td{padding:6px 0 6px 8px}
  .dis{break-inside:avoid;background:#fff}
  /* colour is meaning here — a Hold and a Sold must not print as the same
     grey pill, so the browser is told to keep the ink */
  .rp .pill, .rp .r-d, .rp .sh i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr, .dis li{page-break-inside:avoid}
}

/* ── the whole building ──────────────────────────────────────────────────
   A different question from a floor, so a different chip: lighter, wider,
/* MY RESERVATIONS, AT THE TOP. It was a panel that listed the newest six
   requests, and below it a card that opened a screen listing all of them — the
   same report twice, and the top copy the less useful one. The panel is gone
   and the card took its place at the head of the screen, where the one thing a
   dealer opens this page to check now sits above everything else.

   Slim on purpose: it is a doorway, not the report. */
#myq{margin-bottom:16px}
/* TELLING THE TWO DOORS APART. They are the same card in the same place on
   the same ground, so the eye has nothing to sort them by. A tint each, both
   taken from the palette rather than invented: the accent's own pale wash for
   the one that is about YOU, and the held sand for the one that is about the
   building. Quiet enough to read as paper in sunlight, different enough to
   find without reading.

   The 3px edge does most of the work. A tint alone at this lightness
   disappears on a dim phone; a coloured edge survives it. */
#myq .all-chip{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
@media (hover:hover){ #myq .all-chip:hover{background:#E5EDFD} }
#myq .all-chip:active{background:#DCE7FC}
#allrow .all-chip{background:var(--held-bg);box-shadow:inset 3px 0 0 var(--held)}
@media (hover:hover){ #allrow .all-chip:hover{background:#EFE8DC} }
#allrow .all-chip:active{background:#EAE1D2}
/* The count badge sits on a tinted card now, so it takes the accent rather
   than the ink it wore on white. */
#myq .all-chip .ac-n{background:var(--accent)}

/* ── the report, floor by floor ── */
.myq-f{display:flex;align-items:baseline;gap:9px;padding:13px 16px 9px;
       border-top:1px solid var(--hair)}
.myq-f:first-child{border-top:0}
.myq-f .fn{font-size:13.5px;font-weight:650;letter-spacing:-.01em;color:var(--ink)}
.myq-f .fs{flex:1;min-width:0;font-size:11.5px;color:var(--mut);
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ── what is about to let go ── */
.myq-a{margin:0 0 14px;padding:13px 15px;border-radius:var(--r);
       background:var(--held-bg);box-shadow:inset 3px 0 0 var(--held)}
.myq-a .t{font-size:13px;font-weight:650;color:var(--held);letter-spacing:-.01em}
.myq-a .r{margin-top:7px;font-size:12.5px;color:var(--soft);line-height:1.55}
.myq-a .r b{color:var(--ink);font-weight:650}
#allrow{margin-top:9px}
.all-chip .ac-n{display:inline-flex;align-items:center;justify-content:center;
                min-width:18px;height:18px;padding:0 5px;margin-left:6px;
                border-radius:999px;background:var(--ink);color:var(--card);
                font-size:10.5px;font-weight:700;letter-spacing:0;vertical-align:1px}
.all-chip{width:100%;padding:12px 14px;border:0;border-radius:var(--r);
          background:var(--card);text-align:left;
          display:flex;align-items:center;gap:12px;
          transition:background var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
@media (hover:hover){ .all-chip:hover{background:#FDFDFD} }
.all-chip:active{transform:scale(.985);background:var(--sunk)}
.all-chip .ac-w{flex:1;min-width:0}
.all-chip .ac-t{display:block;font-size:14.5px;font-weight:650;letter-spacing:-.015em;
                line-height:1.25;color:var(--ink)}
.all-chip .ac-m{display:block;font-size:11.5px;color:var(--mut);line-height:1.4;
                margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.all-chip .ac-m b{font-weight:650;color:var(--soft)}
.all-chip .ac-m.soon{color:var(--held);font-weight:650}
.all-chip .ac-x{flex:none;display:flex;align-items:center;color:var(--mut)}
.all-chip .ac-x i{width:7px;height:7px;border-right:1.5px solid currentColor;
                  border-top:1.5px solid currentColor;transform:rotate(45deg);display:block}

/* the four numbers this screen exists to state */
.ah{margin:10px 0 14px}
.ah-r{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ah-c{background:var(--card);border-radius:var(--r);padding:11px 12px}
.ah-l{font-size:9.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;
      color:var(--mut);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ah-v{font-size:19px;font-weight:650;letter-spacing:-.02em;line-height:1.25;margin-top:4px}
.ah-v.held{color:var(--held)}

/* Cuts the list rather than tinting it: the way to find eleven held units
   among 1,467 on a phone is to be shown eleven. */
.af{display:flex;gap:7px;margin-bottom:16px}
.af button{flex:1;height:44px;border-radius:var(--r);background:var(--card);
           font-size:13px;font-weight:600;color:var(--soft);
           transition:background var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.af button:active{transform:scale(.97)}
.af button.on{background:var(--ink);color:var(--card)}

/* The floor's own numbers ride with the floor. Stuck to the top while you
   are inside it, because three hundred identical chips with no heading in
   sight are three hundred anonymous chips. */
.as{margin-bottom:22px}
.as-h{position:sticky;top:0;z-index:5;background:var(--bg);
      padding:9px 0 8px;margin-bottom:8px}
.as-n{display:block;font-size:15px;font-weight:650;letter-spacing:-.015em;line-height:1.3}
.as-m{display:block;font-size:11.5px;color:var(--mut);line-height:1.5;margin-top:2px}
.as-m b{font-weight:650;color:var(--soft)}
.as-m b.held{color:var(--held)}

/* ── the request sheet ──────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(14,16,19,.44);opacity:0;
       pointer-events:none;transition:opacity var(--t) var(--ease);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
/* A CLOSED SHEET MUST NOT BE ABLE TO BE CLICKED. Below it is only moved or
   faded, and a faded element still takes the pointer — which is how an
   invisible box came to eat half the unit grid on a laptop. */
.sheet{pointer-events:none}
.sheet.on{pointer-events:auto}
/* A COLUMN, NOT A BLOCK. The sheet is anchored to the bottom of the phone, so
   anything that makes it taller pushes its own HEAD off the top of the screen —
   the unit number and the ✕ that closes it. The unit list inside it did exactly
   that: 850px of sheet on a 780px screen, with the first 70px above the glass.

   So the middle scrolls and the two ends do not. Whatever is added here later,
   the heading stays reachable and the send button stays on the screen. */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  background:var(--card);
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:22px var(--pad) calc(22px + env(safe-area-inset-bottom));
  transform:translateY(101%);
  transition:transform 220ms var(--ease);
  max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;max-height:92vh
}
/* min-height:0 is what lets a flex child actually shrink and scroll rather
   than growing its parent past the cap above it. */
.sh-b{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
      margin:0 calc(var(--pad) * -1);padding:0 var(--pad)}
.sheet.on{transform:none}
@media (min-width:560px){
  .sheet{bottom:auto;top:50%;transform:translate(0,-46%) scale(.985);opacity:0;
         border-radius:var(--r-lg);
         left:50%;right:auto;margin-left:-260px;width:520px;
         transition:transform 220ms var(--ease), opacity var(--t) var(--ease)}
  .sheet.on{transform:translate(0,-50%);opacity:1}
}

.sh-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.sh-n{font-size:26px;font-weight:700;letter-spacing:-.028em;line-height:1.12}
.sh-x{width:44px;height:44px;margin:-8px -10px 0 0;border-radius:var(--r);
      color:var(--mut);font-size:18px;line-height:1;flex:none;
      transition:background var(--t-fast) var(--ease)}
@media (hover:hover){ .sh-x:hover{background:var(--sunk);color:var(--ink)} }
.sh-x:active{background:var(--sunk);color:var(--ink)}
.sh-m{font-size:13px;color:var(--soft);margin-top:6px;line-height:1.5}
/* THE PRICE GETS ITS OWN LINE. Run in with the floor and the size it wrapped
   mid-figure \u2014 "PKR" on one line and the number on the next \u2014 and a price cut
   in half is a price read twice. It carries no weight it does not need: it is
   the ink colour and a size up, which is enough on a line of its own. */
.sh-p{margin-top:8px;font-size:17px;letter-spacing:-.01em;color:var(--ink);
      white-space:nowrap}

.sh-l{font-size:10.5px;font-weight:650;letter-spacing:.11em;text-transform:uppercase;
      color:var(--mut);margin:24px 0 10px}
/* What the dealer is asking for. Sits above the duration because it decides
   whether there is a duration at all. */
/* FOUR CHOICES SHOULD NOT BE THREE AND A LONELY ONE. Three fit a phone's
   width; a fourth wraps and then stretches to the full width, where it reads
   as the main button rather than as one of four. An even number goes two by
   two. */
.ask-k{display:flex;gap:8px;flex-wrap:wrap}
.ask-k.two button{min-width:calc(50% - 4px)}
.ask-k button{flex:1;min-width:88px;height:46px;border:1px solid var(--line);
              border-radius:var(--r);background:var(--card);font-size:13.5px;
              font-weight:600;color:var(--soft);
              transition:background var(--t-fast) var(--ease),
                         border-color var(--t-fast) var(--ease),
                         transform var(--t-fast) var(--ease)}
.ask-k button:active{transform:scale(.96)}
.ask-k button.on{border-color:var(--ink);background:var(--ink);color:var(--card)}
.ask-n{margin-top:10px;font-size:12.5px;color:var(--mut);line-height:1.55}

/* MORE THAN ONE UNIT IN ONE ASK. A dealer taking a row of shops on the
   second floor was sending five separate requests, and the desk was reading
   them as five separate conversations. The tapped unit is a chip; anything
   typed or pasted after it becomes one too. */
.uc-r{display:flex;flex-wrap:wrap;gap:7px}
.uc{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 12px;
    border:1px solid var(--line);border-radius:999px;background:var(--card);
    font-size:13px;font-weight:650;color:var(--ink);max-width:100%}
.uc.bad{background:var(--sunk);color:var(--mut);border-style:dashed;
        text-decoration:line-through}
.uc button{width:22px;height:22px;flex:none;border:0;border-radius:50%;
           background:var(--sunk);color:var(--mut);font-size:14px;line-height:1;
           display:flex;align-items:center;justify-content:center;
           transition:background var(--t-fast) var(--ease)}
.uc button:active{background:#E3E3E2}
.uc-in{width:100%;height:46px;margin-top:9px;padding:0 13px;border:1px solid var(--line);
       border-radius:var(--r);background:var(--card);color:var(--ink);font:inherit;
       font-size:14px;font-weight:600;letter-spacing:.01em}
.uc-in:focus{outline:none;border-color:var(--ink)}
/* THE LIST INSIDE THE SHEET. Same rows as the search on the first screen,
   because a rep who has used one has used the other. Capped and scrollable:
   the sheet is anchored to the bottom of the phone and a list that grows
   without limit pushes the send button off the screen. */
.uc-sg{margin-top:9px;border-radius:var(--r);background:var(--sunk);overflow:auto;
       max-height:min(38vh,240px)}
.uc-sg button{display:flex;align-items:baseline;gap:12px;width:100%;padding:12px 14px;
              border:0;border-bottom:1px solid var(--hair);background:none;text-align:left;
              min-height:46px;font:inherit;color:var(--ink)}
.uc-sg button:last-child{border-bottom:0}
.uc-sg button:active{background:var(--card)}
.uc-sg .n{font-weight:650;font-size:14px;min-width:74px;letter-spacing:-.01em}
.uc-sg .f{flex:1;min-width:0;font-size:12px;color:var(--soft);
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uc-sg .a{font-size:11.5px;color:var(--mut);white-space:nowrap}
.uc-sg .more{padding:10px 14px;font-size:11.5px;color:var(--mut);border-top:1px solid var(--hair)}
.uc-s{margin-top:9px;font-size:12px;color:var(--mut);line-height:1.5}
.uc-s b{color:var(--soft);font-weight:650}

.dur{display:flex;gap:8px}
.dur button{flex:1;height:46px;border:1px solid var(--line);border-radius:var(--r);
            background:var(--card);font-size:13.5px;font-weight:600;color:var(--soft);
            transition:background var(--t-fast) var(--ease),
                       border-color var(--t-fast) var(--ease),
                       transform var(--t-fast) var(--ease)}
.dur button:active{transform:scale(.96)}
.dur button.on{border-color:var(--ink);background:var(--ink);color:var(--card)}
/* The same shape the desk uses for the same question, so a rep who has seen
   one recognises the other. Narrower than a chip because a number is short. */
.dur input{flex:0 0 66px;width:66px;height:46px;padding:0 8px;text-align:center;
           border:1px solid var(--line);border-radius:var(--r);background:var(--card);
           font-size:13.5px;font-weight:600;color:var(--ink);outline:none}
.dur input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}
.dur input.on{border-color:var(--ink);background:var(--ink);color:var(--card)}
.dur input::placeholder{color:var(--mut);font-weight:400}

/* The one accent action on the page. */
.go{width:100%;height:52px;margin-top:22px;border-radius:var(--r);
    background:var(--accent);color:#fff;font-size:15px;font-weight:650;letter-spacing:-.01em;
    transition:transform var(--t-fast) var(--ease),filter var(--t-fast) var(--ease)}
.go:active{transform:scale(.985)}
.go[disabled]{opacity:.45;cursor:default}
/* The button does not reserve anything, and neither does the sentence under it. */
.go-n{margin-top:12px;font-size:12px;color:var(--mut);text-align:center;line-height:1.55}

.acts{display:flex;gap:9px;margin-top:22px}
/* Not two equal choices: one is the thing you came to do, the other is the
   way out, so they are not the same size. */
.acts button{height:52px;border-radius:var(--r);background:var(--sunk);
             font-size:14px;font-weight:600;color:var(--soft);
             transition:transform var(--t-fast) var(--ease),
                        background var(--t-fast) var(--ease)}
.acts button:active{transform:scale(.985)}
.acts .prim{flex:1;background:var(--accent);color:#fff}
.acts .prim:active{background:var(--accent)}
.acts .prim:disabled{opacity:.45}
.acts #cx{flex:none;padding:0 20px}

.gone{margin-top:18px;padding:14px;border-radius:var(--r);background:var(--sunk);
      font-size:13px;color:var(--soft);line-height:1.55}

/* SENT. A moment of confirmation before the sheet goes, so the tap has an
   ending rather than just an absence. */
.done{padding:30px 8px 22px;text-align:center;animation:fade var(--t) var(--ease) both}
.done-k{width:46px;height:46px;margin:0 auto 16px;border-radius:50%;
        background:var(--accent-soft);display:grid;place-items:center}
.done-k i{width:15px;height:8px;border-left:2px solid var(--accent);
          border-bottom:2px solid var(--accent);transform:rotate(-45deg) translate(1px,-2px);
          display:block}
.done-t{font-size:17px;font-weight:650;letter-spacing:-.015em}
.done-s{font-size:13px;color:var(--mut);margin-top:7px;line-height:1.55}

/* ── the name, asked once ───────────────────────────────────────────────── */
.nm{border-radius:var(--r);background:var(--card);padding:14px;margin-bottom:15px}
.nm-t{font-size:14px;font-weight:650;margin-bottom:5px;letter-spacing:-.01em}
.nm-s{font-size:12.5px;color:var(--mut);margin-bottom:11px;line-height:1.5}
.nm-r{display:flex;gap:9px;align-items:center}
.nm-r input{min-width:0}
.nm-r input{flex:1;height:46px;padding:0 14px;border:1px solid var(--line);
            border-radius:var(--r);background:var(--card);font-size:15.5px;outline:none}
.nm-r input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}
.nm-r button{height:46px;padding:0 16px;flex:none;border-radius:var(--r);background:var(--accent);
             color:#fff;font-size:14px;font-weight:650;
             transition:transform var(--t-fast) var(--ease)}
.nm-r button:active{transform:scale(.97)}
/* Skip is not a second Save. */
.nm-r button.nm-sk{background:none;color:var(--mut);font-weight:500;padding:0 12px;flex:none}
.nm-r button.nm-sk:active{background:var(--sunk)}

/* ── boot and dead link ─────────────────────────────────────────────────── */
.boot{padding:22px var(--pad) 40px;max-width:520px;margin:0 auto}
@media (min-width:760px){ .boot{max-width:760px;padding:40px 28px 56px} }
.dead{max-width:340px;margin:22vh auto;text-align:center;padding:0 var(--pad)}
.dead b{display:block;font-size:17px;font-weight:650;color:var(--ink);margin-bottom:8px;
        letter-spacing:-.015em}
.dead span{font-size:13.5px;color:var(--mut);line-height:1.6}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);
       background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;
       font-size:13px;font-weight:500;opacity:0;pointer-events:none;
       transition:opacity var(--t) var(--ease),transform var(--t) var(--ease);
       z-index:60;max-width:90vw;line-height:1.4}
.toast.on{opacity:1;transform:translateX(-50%)}

/* NOTHING MOVES FOR ANYONE WHO HAS ASKED FOR THAT. One rule, at the end, so
   it cannot be forgotten by whatever is added above it. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-delay:0ms !important;
    transition-duration:.001ms !important;
  }
}

[hidden]{display:none !important}
</style>
</head>
<body>

<!-- Shaped like the thing it stands in for — same header, same 58px field,
     same seven chips at the same height — so the payload landing changes
     what the page says and not where anything sits. It does not shimmer: a
     loop on a first paint is the page asking to be watched while it has
     nothing to show. -->
<div class="boot" id="boot" aria-hidden="true">
  <div class="sk-line sk-hd"></div>
  <div class="sk-line sk-co"></div>
  <div class="sk-line sk-hero"></div>
  <div class="sk-line sk-bar"></div>
  <div class="sk-line sk-leg"></div>
  <div class="sk sk-sr"></div>
  <div class="sk-fl">
    <div class="sk sk-ch"></div><div class="sk sk-ch"></div>
    <div class="sk sk-ch"></div><div class="sk sk-ch"></div>
    <div class="sk sk-ch"></div><div class="sk sk-ch"></div>
    <div class="sk sk-ch"></div>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <div class="hd">
    <div>
      <div class="hd-t" id="ttl">—</div>
      <div class="hd-c" id="co">—</div>
    </div>
    <div class="hd-r">
      <div class="hd-u" id="upd"></div>
      <!-- THE DOOR TO THE OTHER ROOM. It sat here in the dealer's own grey and
           Rashid could not find it on his own page: "na nazr aaye… koi button
           banao chota sa k directors ko dashboard dekhnay pe nazar aaye". So it
           is a button now, in the one colour nothing else on this page uses.
           Small, because a dealer without the password still has no business
           in it — but findable, because a director should not have to be told
           twice where it is. -->
      <button class="hd-d" id="dir-open">Director’s Login</button>
    </div>
  </div>

  <div id="name-ask" hidden></div>

  <!-- SCREEN ONE ─────────────────────────────────────────────────────────
       Search first: most dealers already know the unit. Then the floors.
       No unit is rendered here, ever. -->
  <section id="home">
    <div id="myq" hidden></div>
    <!-- The single fact this page exists to state, said once and said large.
         It sits above the search because it is a reading, not an action — the
         search is still the first thing anyone can touch. -->
    <div class="hero" id="hero"></div>
    <div class="sr">
      <input id="q" type="search" inputmode="search" autocomplete="off"
             autocapitalize="characters" spellcheck="false"
             placeholder="Search unit — e.g. LG-12" aria-label="Search unit">
      <div id="res" hidden></div>
    </div>
    <div class="fl" id="floors"></div>
    <!-- Deliberately outside #floors: it is not a floor, and every check
         that counts floors would have counted it. -->
    <div id="allrow"></div>
  </section>

  <!-- SCREEN FIVE — THE ROOM BEHIND THE PASSWORD ───────────────────────────
       The same link, a different question. The dealer's screens answer "what
       can I sell"; this one answers "where does the building stand" — who is
       holding what, for how long, worth how much, and what that adds up to.
       It writes nothing and it books nothing: a password that leaks costs the
       company its numbers, not its inventory. -->
  <section id="rep" hidden>
    <div class="ft"><button class="bk" id="rep-back"><i></i>All floors</button></div>
    <div class="fh"><h1>Directors</h1><span id="rep-as"></span></div>
    <div id="rep-gate">
      <div class="dr-c">
        <div class="dr-t">This part is not for the link</div>
        <div class="dr-s">It shows who is holding what, and what the building is
          worth. Ask the office for the password.</div>
        <div class="dr-f">
          <input id="dir-pw" type="password" autocomplete="off" spellcheck="false"
                 placeholder="Password" aria-label="Directors password">
          <button id="dir-go">Open</button>
        </div>
        <div class="dr-e" id="dir-err" hidden></div>
      </div>
    </div>
    <div id="rep-body"></div>
  </section>

  <!-- SCREEN THREE — THE WHOLE BUILDING, WHEN SOMEBODY ASKS FOR IT ────────
       Everything else here exists to avoid rendering 1,467 units, and this
       renders 1,467 units. It is a deliberate exception, reached only by
       pressing a chip that says so, and it is the one screen on this page
       measured for how long it takes to draw. -->
  <section id="all" hidden>
    <div class="ft"><button class="bk" id="all-back"><i></i>All floors</button></div>
    <div class="ah" id="all-head"></div>
    <div class="af" id="all-filter"></div>
    <div id="all-body"></div>
    <div class="empty" id="all-empty" hidden></div>
  </section>

  <!-- SCREEN FOUR — WHAT IS YOURS ──────────────────────────────────────────
       Reached from a card that is always on screen one, because a panel that
       only appears once you have asked for something is a panel nobody can
       find before they have asked. It says the same things the band at the top
       says, and says them when there is nothing to say too. -->
  <section id="mine" hidden>
    <div class="ft"><button class="bk" id="mine-back"><i></i>All floors</button></div>
    <div class="fh"><h1>My Reservations</h1></div>
    <div id="mine-body"></div>
  </section>

  <!-- SCREEN TWO — one floor, and only ever one ─────────────────────────── -->
  <section id="floor" hidden>
    <div class="ft"><button class="bk" id="back"><i></i>All floors</button></div>
    <div class="fh"><h1 id="fname">—</h1><span id="fcount"></span></div>
    <!-- THE PLATE. One card: the floor at its head, the legend that is also
         the filter, a way to find a shop by number, and the architect’s own
         drawing under all of it. Everything here is laid over the drawing or
         around it — not one line of it is redrawn. -->
    <div class="pvw" id="pv-b" hidden>
      <div class="pvh">
        <div>
          <div class="t" id="pv-t">Floor plan</div>
          <div class="s" id="pv-s"></div>
        </div>
        <span class="sp"></span>
        <div class="seg">
          <button id="pv-plan" class="on">Plan</button>
          <button id="pv-list">List</button>
        </div>
      </div>
      <!-- THE LEGEND IS ALSO THE FILTER, and it now has one key per kind of
           hold rather than a single "taken". It is written by the page from
           the floor in front of you: a floor with nothing sold shows no Sold
           key, because a legend that names what is not there is furniture. -->
      <div class="pvc" id="pv-c">
        <span id="k-keys"></span>
        <span class="sp"></span>
        <div class="zc">
          <button id="pv-out" aria-label="Zoom out">−</button>
          <span id="pv-zoom">100%</span>
          <button id="pv-plus" aria-label="Zoom in">+</button>
        </div>

function pkParts(iso) {

/* ══ YOUR OWN POSITION ═══════════════════════════════════════════════════
   A dealer with fourteen units on this link could see fourteen request rows

    }

    /* ── FLOOR BY FLOOR, GROUND UPWARDS ────────────────────────────────────

          '<span class="fn">' + esc(g.floor) + '</span>' +
          '<span class="fs">' + esc(g.line) + '</span>' +
        '</div>' +
        g.rows.map(myqRow).join('');
    }).join('')
  );
}

/* Grouped and counted. The counts are of what is HELD \u2014 a request still
   waiting is somebody else's decision and belongs in neither column. */
function floorGroups() {
  var out = [], by = {}, rest = [];
  (P.floors || []).forEach(function (fl, i) {
    by[i] = { floor: fl.floor_label, i: i, rows: [] };
  });
  REQS.forEach(function (r) {
    var h = findUnit(r.unit);
    if (h && by[h.fi]) by[h.fi].rows.push(r); else rest.push(r);
  });
  Object.keys(by).forEach(function (k) {
    var g = by[k];
    if (!g.rows.length) return;
    g.rows.sort(function (a, b) {
      var na = parseInt(String(a.unit).replace(/\D+/g, ''), 10) || 0;
      var nb = parseInt(String(b.unit).replace(/\D+/g, ''), 10) || 0;
      return na - nb || String(a.unit).localeCompare(String(b.unit));
    });
    out.push(g);
  });
  if (rest.length) out.push({ floor: 'Elsewhere', rows: rest });

  out.forEach(function (g) {
    var tags = {}, order = [], wait = 0;
    g.rows.forEach(function (r) {
      var st = stateOf(r);
      if (st === 'pending') { wait++; return; }
      if (st !== 'held') return;
      var k = r.tag || r.asked || 'Held';
      if (!tags[k]) { tags[k] = 0; order.push(k); }
      tags[k]++;
    });
    var bits = order.map(function (k) { return tags[k] + ' ' + k; });
    if (wait) bits.push(wait + ' waiting');
    g.line = bits.length ? bits.join('  \u00b7  ')
                         : g.rows.length + (g.rows.length === 1 ? ' request' : ' requests');
  });
  return out;
}

/* One request, drawn the same way wherever it appears. */
function myqRow(r) {
      var st = stateOf(r);
      /* A HELD UNIT CAN STILL NEED SOMETHING. The deal matures, and until now
         the link had nothing to say about a unit that was already theirs — it
         could only ask for units that were FREE, so the moment one became
         theirs it fell out of the only channel they have. */
      var canAsk = (st === 'held' && r.kind !== 'change');
      /* A held row says what it IS now and when it goes, in place of what was
         asked for and how many days were asked for — both of which stopped
         being the news the moment the desk answered. */
      /* THE DAY IT GOES, not how many days that is. \u201c15 days left\u201d has to be
         counted forward against a calendar nobody has open; \u201creleases 24 Sep\u201d
         is the thing a rep writes in their diary. Near ones say the word
         instead of the date, and wear the held colour. */
      var soonN = (st === 'held' && r.until) ? daysToDate(r.until) : null;
      var when = (st === 'held')
        ? (r.until
            ? (soonN !== null && soonN <= 1
                ? '<b class="soon">releases ' + esc(dayName(r.until)) + '</b>'
                : 'releases ' + esc(dayName(r.until)))
            : 'no end date')
        : '';
      /* The tag is dropped when the chip on the right already says it.
         "Reserved \u00b7 releases 12 Sep" beside "Reserved for you" spends the width
         saying Reserved twice and then truncates the date, which is the only
         part of the line nobody can work out for themselves. */
      var tg = r.tag || r.asked || '';
      var mid = (st === 'held')
        ? ((tg && !/^reserved$/i.test(tg) ? esc(tg) + '  \u00b7  ' : '') + when)
        : ((r.days == null ? esc(r.asked || 'No end date')
                           : esc(r.days) + ' day' + (r.days === 1 ? '' : 's')) +
           '  \u00b7  ' + esc(initials(P && P.project)) + '-REQ-' + esc(r.ref));
      return '<div class="myq-r">' +
        '<span class="u">' + esc(r.unit) + '</span>' +
        '<span class="d">' + mid + '</span>' +
        '<span class="s s-' + esc(st) + '">' + esc(SAYS[st] || st) + '</span>' +
      '</div>' +
      (canAsk
        ? (ASKING === r.ref
            ? '<div class="myq-c open">' +
                '<div class="myq-h2">What has changed?</div>' +
                '<input id="ask-note" maxlength="120" ' +
                  'placeholder="e.g. Deal done \u2014 please mark it sold">' +
                '<div class="myq-b">' +
                  '<button id="ask-send" class="prim" data-send="' + esc(r.ref) + '">Send</button>' +
                  '<button data-ask="' + esc(r.ref) + '">Cancel</button>' +
                '</div>' +
                '<div class="myq-n">The desk decides the status. This just tells them why.</div>' +
              '</div>'
            : '<div class="myq-c"><button class="myq-ask" data-ask="' + esc(r.ref) + '">' +
              'Ask to change this</button></div>')
        : '');
}

/* Asks only about the refs this phone holds, through the link that made them.
   Folded into the same two-minute rhythm as the availability itself, so a
   decision reaches the dealer without them doing anything. */
/* ASKING FOR A CHANGE. The dealer says what happened; they do not choose a
   status. That is the same rule as everywhere else on this page and the
   reason a link like this can be handed to anybody: nothing here decides
   what a unit becomes. The desk reads the note and picks the tag. */
var ASKING = null;
function openAsk(ref) {
  if (ASKING === ref) { ASKING = null; paintMyReqs(); return; }
  ASKING = ref; paintMyReqs();
  var i = document.getElementById('ask-note'); if (i) { try { i.focus(); } catch (e) {} }
}

async function sendAsk(ref) {
  var i = document.getElementById('ask-note');
  var note = i ? String(i.value || '').trim() : '';
  var b = document.getElementById('ask-send');
  if (b) { b.disabled = true; b.textContent = 'Sending\u2026'; }
  var r;
  try {
    r = await sb.rpc('submit_change_request',
      { p_token: TOKEN, p_ref: ref, p_note: note || null });
  } catch (e) { r = null; }
  var d = r && r.data;
  if (b) { b.disabled = false; b.textContent = 'Send'; }
  if (!d || !d.success) {
    toast((d && d.message) || 'Could not send that. Please try again.');
    return;
  }
  /* Kept on this phone the same way a booking request is, so the answer
     comes back to the row rather than to nobody. */
  var list = readReqs();
  list.unshift({ ref: d.ref, unit: d.unit_no, days: 0, status: 'pending', kind: 'change' });
  REQS = list; writeReqs(list);
  ASKING = null;
  paintMyReqs();
  toast('Sent \u2014 the desk will answer on ' + esc(d.unit_no) + '.');
}

async function refreshMyReqs() {
  if (!REQS.length) return;
  /* Everything that can still change, not everything that has not changed
     yet. A held unit can be released at the desk at any moment, and that is
     precisely the news this band exists to carry. */
  var open = REQS.filter(function (r) { return !SETTLED[stateOf(r)]; });
  if (!open.length) return;
  try {
    var r = await sb.rpc('get_request_status',
      { p_token: TOKEN, p_refs: open.map(function (x) { return x.ref; }) });
    var d = r && r.data;
    if (!d || !d.success) return;
    var by = {};
    (d.requests || []).forEach(function (x) { by[x.ref] = x; });
    var changed = false;
    REQS.forEach(function (x) {
      var got = by[x.ref]; if (!got) return;
      /* An older server that does not send `state` still answers with
         `status`, and the row must not blank out because of it. */
      var st = got.state || got.status;
      if (st && st !== stateOf(x)) { x.state = st; x.status = got.status; changed = true; }
      if (got.held_until !== x.until) { x.until = got.held_until || null; changed = true; }
      if (got.asked && got.asked !== x.asked) { x.asked = got.asked; changed = true; }
      /* WHAT WAS GRANTED, not what was asked for. The desk answers a request
         for Hold with Pagri often enough that counting the asks would be a
         summary of the wrong thing. Cleared as well as set: a hold that ends
         must stop carrying the tag it had. */
      if ((got.tag || null) !== (x.tag || null)) { x.tag = got.tag || null; changed = true; }
    });
    if (changed) { writeReqs(REQS); paintMyReqs(); }
  } catch (e) { /* the receipt can wait; the board matters more */ }
}

function dead() {
  $('boot').hidden = true;
  document.body.innerHTML =
    '<div class="dead"><b>This link is not available</b>' +
    '<span>It may have been withdrawn, or replaced with a newer one. ' +
    'Ask whoever shared it for the current link.</span></div>';
}

function paintUpdated() {
  var el = $('upd');
  if (!FETCHED) { el.textContent = ''; return; }
  el.textContent = 'Updated ' + hhmm(FETCHED);
  el.classList.toggle('stale', STALE);
  el.title = STALE ? 'Could not refresh — showing the last known position' : '';
}

function schedule() {
  clearTimeout(TIMER);
  if (document.hidden) return;
  TIMER = setTimeout(function () { load(false).then(schedule); }, 120000);
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { clearTimeout(TIMER); return; }
  load(false).then(schedule);        // catch up the moment it comes back
});

/* ══ WHAT IS YOURS ═══════════════════════════════════════════════════════
   The same figures the band at the top of screen one carries, on a screen of
   their own that can be reached before there is anything on it. Everything
   here is this phone's own requests through this link \u2014 there is no login on
   a page anybody can forward, so it cannot be somebody else's position and
   does not pretend to be. The line at the bottom says so out loud. */
function renderMine() {
  $('home').hidden = true;
  $('res').hidden = true;
  $('floor').hidden = true;
  $('all').hidden = true;
  $('units').innerHTML = '';
  $('all-body').innerHTML = '';
  var opening = $('mine').hidden;
  $('mine').hidden = false;
  if (opening) playScr($('mine'), 'scr-in');

  var body = $('mine-body');
  if (!body.__askBound) { body.addEventListener('click', _myqClick); body.__askBound = true; }

  if (!REQS.length) {
    body.innerHTML =
      '<div class="empty">Nothing here yet.<br>' +
      'Ask for a unit and it will be listed here \u2014 what you hold, ' +
      'and how long before a hold releases itself.</div>';
    return;
  }
  body.innerHTML = '<div class="myq">' + myqHTML() + '</div>' +
    '<div class="mine-n">This is what has been asked for from this phone. ' +
    'The desk holds the record.</div>';
}

/* ── render ──────────────────────────────────────────────────────────────── */
function render() {
  $('ttl').textContent = P.project || 'Availability';
  $('co').textContent = P.company || '';
  paintUpdated();
  paintNameAsk();
  paintMyReqs();
  /* THE REPORT IS NOT REPAINTED BY THE CLOCK. Every other screen is a reading
     of the payload and can be redrawn under the reader without them noticing;
     the report is a separate call behind a password, and rebuilding the
     screens would shut the room every sixty seconds. It is read once and
     stays until it is left. */
  if (REPV) { if (SHEET) refreshSheet(); return; }
  if (MINEV) { renderMine(); }
  else if (ALLV) { renderAll(); }
  else if (FLOOR == null) { renderHome(); } else { renderFloor(); }
  if (SHEET) refreshSheet();
}

/* One animation class, taken off when it finishes so it can be given again.
   Reading offsetWidth in between is what makes the browser start it over
   rather than ignore a class it already had. */
function playScr(el, cls) {
  el.classList.remove('scr-in', 'scr-out');
  void el.offsetWidth;
  el.classList.add(cls);
}

function renderHome() {
  $('floor').hidden = true;
  $('all').hidden = true;
  $('mine').hidden = true;
  $('rep').hidden = true; REPV = false;
  /* THE CARD IS THIS SCREEN’S OWN FURNITURE, so this screen draws it. It was
     painted only by render(), which runs on a fetch — so coming back from the
     report left a card built before whatever had just been read there. A hold
     that aged into “releases tomorrow” while the reader was two taps away
     still said “With you” when they came back to it. */
  paintMyReqs();
  $('all-body').innerHTML = '';      // unmounted, like a floor
  /* UNMOUNTED, not hidden. The one hard rule of this page is that a floor's
     units are never in the document unless that floor is open. */
  $('units').innerHTML = '';
  $('home').hidden = false;
  if (BACKING) { BACKING = false; playScr($('home'), 'scr-out'); }

  var tot = 0, av = 0;
  $('floors').innerHTML = (P.floors || []).map(function (f, i) {
    tot += Number(f.total || 0); av += Number(f.available || 0);
    var n = Number(f.available || 0), t = Number(f.total || 0);
    /* The count is the headline of the chip and the floor name is the caption,
       because nobody scans this grid looking for the word "Second". */
    /* AND WHAT THE REST OF THE FLOOR IS. Rashid: "main dashboard pe b detail
       ho k har floor pe kitnay hold kitnay sold kitnay pagri etc aur phir
       cummulative detail b." A row of small coloured counts under the number,
       in the same colours the plate uses, so a floor reads at a glance. */
    var kinds = tally(f.units || []);
    return '<button data-f="' + i + '" style="--i:' + i + '"' +
      (n ? '' : ' class="empty"') + '>' +
      '<span class="fn">' + esc(f.floor_label) + '</span>' +
      '<span class="fr">' +
        (n ? '<span class="fv num">' + n + '</span>' +
             '<span class="fc">of ' + t + '</span>'
           : '<span class="fv">None free</span>' +
             '<span class="fc">of ' + t + '</span>') +
      '</span>' +
      (kinds.length ? '<span class="fk">' + kinds.map(function (k) {
          return '<span class="fk-i" style="--t:' + k.tint + '" title="' + esc(k.label) + '">' +
                 '<i></i>' + k.n + '</span>';
        }).join('') + '</span>' : '') +
      '</button>';
  }).join('');
