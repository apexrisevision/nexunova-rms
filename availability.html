<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Availability</title>
<link rel="icon" href="/assets/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/favicon-180.png">

<style>
/* ══ THE WHOLE POINT OF THIS PAGE ═════════════════════════════════════════
   A dealer opens it in a WhatsApp group on a mid-range Android phone. They
   already know the unit they want, or they know the floor. They must NEVER be
   shown 1,467 units — the building's size is our problem, not theirs.

   So: screen one is the building (a search box and seven floor chips, nothing
   else, no scrolling), screen two is ONE floor. No screen ever holds more than
   one floor's units, and switching floors unmounts the last one.

   Availability is signalled by weight and contrast, not by colour. There is one
   accent and it is used for the thing you press. No shadows, no gradients, no
   emoji — the type hierarchy does the work. ════════════════════════════════ */

:root{
  --bg:#FBFBFA; --card:#FFFFFF; --ink:#14181F; --soft:#5A6472; --mut:#8C95A3;
  --line:#E6E8EC; --line2:#F0F1F4; --tint:#F5F6F8;
  --accent:#1F5EFF; --accent-tint:#EEF3FF; --accent-line:#CFDDFF;
  --warn:#8A5300;
  --r:10px; --r-lg:14px;
  --pad:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1216; --card:#161A20; --ink:#EDEFF3; --soft:#A6AFBC; --mut:#79828F;
    --line:#252A32; --line2:#1C2027; --tint:#1A1E25;
    --accent:#6D9BFF; --accent-tint:#18202E; --accent-line:#2C3B57;
    --warn:#D9A441;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:0 0 env(safe-area-inset-bottom);
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.num{font-variant-numeric:tabular-nums}

/* ── the frame ──────────────────────────────────────────────────────────── */
.wrap{max-width:520px;margin:0 auto;padding:var(--pad) var(--pad) 28px}

.hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.hd-t{font-size:19px;font-weight:650;letter-spacing:-.015em;line-height:1.15}
.hd-c{font-size:12px;color:var(--mut);margin-top:2px}
.hd-u{font-size:11.5px;color:var(--mut);white-space:nowrap;flex:none}
/* A refetch that failed must SAY the data is old rather than keep a confident
   timestamp that quietly stopped being true. */
.hd-u.stale{color:var(--warn)}

/* ── search: the primary action, because most dealers know the number ───── */
.sr{position:relative;margin-bottom:16px}
.sr input{
  width:100%;height:50px;padding:0 14px;border:1px solid var(--line);
  border-radius:var(--r-lg);background:var(--card);font-size:16px;font-weight:500;
  outline:none;transition:border-color .12s
}
.sr input:focus{border-color:var(--accent)}
.sr input::placeholder{color:var(--mut);font-weight:400}

.res{margin-top:8px;border:1px solid var(--line);border-radius:var(--r-lg);
     background:var(--card);overflow:hidden}
.res-r{display:flex;align-items:baseline;gap:10px;width:100%;padding:11px 14px;
       border-bottom:1px solid var(--line2);text-align:left}
.res-r:last-child{border-bottom:0}
.res-r .n{font-weight:650;font-size:14px;min-width:72px}
.res-r .f{flex:1;min-width:0;font-size:12px;color:var(--soft);
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-r .a{font-size:12px;color:var(--mut);white-space:nowrap}
.res-r[disabled]{cursor:default}
.res-r[disabled] .n{color:var(--mut);font-weight:500}
.res-more{padding:9px 14px;font-size:11.5px;color:var(--mut);border-top:1px solid var(--line2)}
.res-none{padding:14px;font-size:13px;color:var(--mut)}

/* ── floor chips: two columns, seven of them, one screen ────────────────── */
.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fl button{
  padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--card);text-align:left;min-height:62px;
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  transition:border-color .12s,background .12s
}
.fl button:hover{border-color:var(--accent-line);background:var(--accent-tint)}
.fl .fn{font-size:13px;font-weight:650;letter-spacing:-.01em}
.fl .fc{font-size:11px;color:var(--soft)}
.fl .fc.none{color:var(--mut)}

.tot{margin-top:14px;font-size:12px;color:var(--mut);text-align:center}

/* What this phone has asked for, and what came back. Quiet: it is a receipt,
   not the point of the page. */
.myq{margin-bottom:16px;border:1px solid var(--line);border-radius:var(--r-lg);
     background:var(--card);overflow:hidden}
.myq-h{padding:9px 13px;font-size:10.5px;font-weight:600;letter-spacing:.07em;
       text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line2)}
.myq-r{display:flex;align-items:baseline;gap:9px;padding:9px 13px;
       border-bottom:1px solid var(--line2);font-size:12.5px}
.myq-r:last-child{border-bottom:0}
.myq-r .u{font-weight:650;min-width:66px}
.myq-r .d{flex:1;min-width:0;font-size:11.5px;color:var(--mut);
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.myq-r .s{font-size:11px;font-weight:650;white-space:nowrap}
.s-pending{color:var(--mut)}
.s-approved{color:#1C6B3F}
.s-declined{color:#8A2F26}
.s-stale,.s-expired{color:var(--mut);text-decoration:line-through}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .s-approved{color:#5FCB90}
  :root:not([data-theme="light"]) .s-declined{color:#E58A7E}
}

/* Asked in the sheet, at the moment it matters, if it was skipped earlier. */
.ask{margin-top:16px;padding:12px;border:1px solid var(--accent-line);
     border-radius:var(--r);background:var(--accent-tint)}
.ask-t{font-size:12.5px;font-weight:600;margin-bottom:8px}
.ask-r{display:flex;gap:8px}
.ask-r input{flex:1;height:42px;padding:0 12px;border:1px solid var(--line);
             border-radius:var(--r);background:var(--card);font-size:15px}
.ask-r input:focus{outline:none;border-color:var(--accent)}

/* Desktop is not a wider phone, and it is not a phone floating in a field
   either. Above 760px the column widens and the floors go to three across, so
   the seven of them read as a building rather than as a list that ran out. */
@media (min-width:760px){
  .wrap{max-width:720px;padding:26px 24px 40px}
  .hd-t{font-size:22px}
  .fl{grid-template-columns:repeat(3,1fr);gap:10px}
  .fl button{min-height:70px;padding:13px 14px}
  .sr input{height:54px}
  .ug{grid-template-columns:repeat(8,1fr);gap:7px}
}

/* ── one floor ──────────────────────────────────────────────────────────── */
.ft{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.bk{display:inline-flex;align-items:center;gap:6px;padding:7px 11px 7px 8px;
    margin-left:-8px;border-radius:var(--r);font-size:13px;color:var(--soft)}
.bk:hover{background:var(--tint);color:var(--ink)}
.bk i{width:7px;height:7px;border-left:1.5px solid currentColor;
      border-bottom:1.5px solid currentColor;transform:rotate(45deg);display:inline-block}
.fh{display:flex;align-items:baseline;gap:9px;margin:6px 0 12px}
.fh h1{margin:0;font-size:18px;font-weight:650;letter-spacing:-.015em}
.fh span{font-size:12.5px;color:var(--mut)}

.sw{display:flex;align-items:center;gap:8px;margin-bottom:14px;
    font-size:12px;color:var(--soft)}
.sw input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0}
.sw label{cursor:pointer;user-select:none}

.ug{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (min-width:440px){ .ug{grid-template-columns:repeat(5,1fr)} }
.ug button{
  padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  display:flex;flex-direction:column;align-items:center;gap:1px;min-height:46px;
  justify-content:center;transition:border-color .12s,background .12s
}
.ug button:hover{border-color:var(--accent-line);background:var(--accent-tint)}
.ug .un{font-size:12.5px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
.ug .ua{font-size:10px;color:var(--mut);line-height:1.2}
/* Not available: no colour, just less of everything. The dealer needs to know
   they cannot have it, not who has it. */
.ug button.off{background:var(--tint);border-color:var(--line2);cursor:default}
.ug button.off:hover{border-color:var(--line2);background:var(--tint)}
.ug button.off .un{color:var(--mut);font-weight:500}
.ug button.off .ua{color:var(--mut);opacity:.65}
.ug .off-l{font-size:9px;color:var(--mut);letter-spacing:.02em}

.empty{padding:26px 8px;text-align:center;color:var(--mut);font-size:13px}

/* ── the request sheet ──────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(15,18,22,.42);opacity:0;
       pointer-events:none;transition:opacity .16s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  background:var(--card);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:18px var(--pad) calc(18px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .2s cubic-bezier(.22,.61,.36,1);
  max-width:520px;margin:0 auto
}
.sheet.on{transform:none}
@media (min-width:560px){
  .sheet{bottom:auto;top:50%;transform:translate(0,-46%) scale(.98);opacity:0;
         border-radius:16px;border:1px solid var(--line);
         left:50%;right:auto;margin-left:-260px;width:520px}
  .sheet.on{transform:translate(0,-50%);opacity:1}
}
@media (prefers-reduced-motion:reduce){ .sheet,.scrim{transition:none} }

.sh-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sh-n{font-size:21px;font-weight:650;letter-spacing:-.02em}
.sh-x{width:32px;height:32px;border-radius:8px;color:var(--mut);font-size:17px;line-height:1;flex:none}
.sh-x:hover{background:var(--tint);color:var(--ink)}
.sh-m{font-size:12.5px;color:var(--soft);margin-top:2px}

.sh-l{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
      color:var(--mut);margin:18px 0 7px}
.dur{display:flex;gap:7px}
.dur button{flex:1;height:40px;border:1px solid var(--line);border-radius:var(--r);
            background:var(--card);font-size:13px;font-weight:600;color:var(--soft)}
.dur button.on{border-color:var(--accent);background:var(--accent-tint);color:var(--accent)}
/* The same shape the desk uses for the same question, so a rep who has seen
   one recognises the other. Narrower than a chip because a number is short. */
.dur input{flex:0 0 62px;width:62px;height:40px;padding:0 8px;text-align:center;
           border:1px solid var(--line);border-radius:var(--r);background:var(--card);
           font-size:13px;font-weight:600;color:var(--ink)}
.dur input:focus{outline:none;border-color:var(--accent)}
.dur input.on{border-color:var(--accent);background:var(--accent-tint);color:var(--accent)}
.dur input::placeholder{color:var(--mut);font-weight:400}

.go{width:100%;height:50px;margin-top:18px;border-radius:var(--r-lg);
    background:var(--accent);color:#fff;font-size:15px;font-weight:650;letter-spacing:-.01em}
.go[disabled]{opacity:.4;cursor:default}
/* The button does not reserve anything, and neither does the sentence under it. */
.go-n{margin-top:9px;font-size:11.5px;color:var(--mut);text-align:center;line-height:1.4}

.acts{display:flex;gap:8px;margin-top:14px}
/* Copy is NOT a fallback. On desktop wa.me opens a page that does nothing
   visible, so the two are the same size and sit side by side. */
.acts button{flex:1;height:44px;border:1px solid var(--line);border-radius:var(--r);
             background:var(--card);font-size:13.5px;font-weight:600}
.acts button:hover{border-color:var(--accent-line);background:var(--accent-tint)}

.gone{margin-top:16px;padding:11px 12px;border:1px solid var(--line);
      border-radius:var(--r);background:var(--tint);font-size:12.5px;color:var(--soft)}

/* ── the name, asked once ───────────────────────────────────────────────── */
.nm{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);
    padding:14px;margin-bottom:16px}
.nm-t{font-size:13px;font-weight:600;margin-bottom:3px}
.nm-s{font-size:11.5px;color:var(--mut);margin-bottom:10px;line-height:1.4}
.nm-r{display:flex;gap:8px}
.nm-r input{flex:1;height:42px;padding:0 12px;border:1px solid var(--line);
            border-radius:var(--r);background:var(--bg);font-size:15px}
.nm-r input:focus{outline:none;border-color:var(--accent)}
.nm-r button{height:42px;padding:0 15px;border-radius:var(--r);background:var(--accent);
             color:#fff;font-size:13.5px;font-weight:600}
/* Skip is not a second Save. .nm-r button already painted it accent blue and
   won on specificity, so the quiet choice looked like the loud one. */
.nm-r button.nm-sk{background:none;color:var(--mut);font-weight:500;padding:0 12px}
.nm-r button.nm-sk:hover{background:var(--tint);color:var(--soft)}

/* ── boot and dead link ─────────────────────────────────────────────────── */
.boot{min-height:70vh;display:grid;place-items:center;color:var(--mut);font-size:13.5px}
.dead{max-width:340px;margin:22vh auto;text-align:center;padding:0 var(--pad)}
.dead b{display:block;font-size:16px;font-weight:650;color:var(--ink);margin-bottom:6px}
.dead span{font-size:13px;color:var(--mut);line-height:1.5}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(14px);
       background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;
       font-size:13px;font-weight:500;opacity:0;pointer-events:none;
       transition:opacity .16s,transform .16s;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}

[hidden]{display:none !important}
</style>
</head>
<body>

<div class="boot" id="boot">Loading availability…</div>

<div class="wrap" id="app" hidden>
  <div class="hd">
    <div>
      <div class="hd-t" id="ttl">—</div>
      <div class="hd-c" id="co">—</div>
    </div>
    <div class="hd-u" id="upd"></div>
  </div>

  <div id="name-ask" hidden></div>

  <!-- SCREEN ONE ─────────────────────────────────────────────────────────
       Search first: most dealers already know the unit. Then the floors.
       No unit is rendered here, ever. -->
  <section id="home">
    <div id="myq" hidden></div>
    <div class="sr">
      <input id="q" type="search" inputmode="search" autocomplete="off"
             autocapitalize="characters" spellcheck="false"
             placeholder="Search unit — e.g. LG-12" aria-label="Search unit">
      <div id="res" hidden></div>
    </div>
    <div class="fl" id="floors"></div>
    <div class="tot" id="tot"></div>
  </section>

  <!-- SCREEN TWO — one floor, and only ever one ─────────────────────────── -->
  <section id="floor" hidden>
    <div class="ft"><button class="bk" id="back"><i></i>All floors</button></div>
    <div class="fh"><h1 id="fname">—</h1><span id="fcount"></span></div>
    <div class="sw">
      <input type="checkbox" id="showall"><label for="showall">Show unavailable units</label>
    </div>
    <div class="ug" id="units"></div>
    <div class="empty" id="fempty" hidden></div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-n"></aside>
<div class="toast" id="toast"></div>

<script src="/js/vendor/supabase-js-2.34.0.umd.js?v=20260616"></script>
<script src="/js/portal-copy.js?v=20260908a"></script>
<script>
/* ── the only server call this page can make ──────────────────────────────
   get_public_availability(token) returns, per unit, its number, its area and
   whether it can be bought. Not the price — that was removed from the SERVER,
   not from this page, so reading the network tab does not bring it back. Not
   the buyer, not the amount, not who holds a unit that is taken: 'available'
   and 'not_available' are the only two answers, and a reserved unit is
   indistinguishable from a sold one.

   No session is created. Nothing is written. reserve_unit is unreachable from
   here — the button on this page composes a WhatsApp message and does not book
   anything, which is why it says "Request Reservation" and not "Reserve". */
const SUPABASE_URL = 'https://itqxljtfbrppntgyfush.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_OkIT2ttNgBiOm-E4HJLnFw_OmIz-8VG';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY,
  { auth: { persistSession: false } });

/* the token rides in the path (/a/<token>) or as ?t=<token> */
const TOKEN = (function () {
  var q = new URLSearchParams(location.search).get('t');
  if (q) return q;
  var m = location.pathname.match(/\/a\/([A-Za-z0-9_-]{8,})/);
  return m ? m[1] : '';
})();

var P = null;              // the payload, exactly as the server sent it
var FLOOR = null;          // index into P.floors, or null on screen one
var SHOWALL = false;
var SHEET = null;          // { unit, floorIdx, days, ref }
var FETCHED = 0;           // ms of the last SUCCESSFUL fetch
var STALE = false;
var NAME = '';

var $ = function (id) { return document.getElementById(id); };
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function norm(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function area(u) {
  var n = Number(u.a || 0);
  if (!n) return '';
  return n.toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' ' + (P.area_unit || 'sqft');
}
function hhmm(ms) {
  var d = new Date(ms);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
var TT;
function toast(msg) {
  var t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(TT); TT = setTimeout(function () { t.classList.remove('on'); }, 2400);
}

/* ── the name, stored here and nowhere else ──────────────────────────────
   localStorage only: no account, no server write, nothing that could identify
   a dealer to anyone but themselves. Skipping is a real choice — the whole flow
   works without it and the message simply omits the line. Every access is
   guarded because a private window, cleared site data or a browser set to block
   storage all THROW here rather than return empty. */
function readName() {
  try { return localStorage.getItem('avail.name') || ''; } catch (e) { return ''; }
}
function writeName(v) {
  try { localStorage.setItem('avail.name', v); } catch (e) {}
}
/* THE REQUESTS THIS PHONE HAS MADE.
   Refs only — six readable characters each. Not the unit id, not the request
   id, nothing that identifies the dealer to anyone but themselves. They are
   kept so the page can ask what happened: pending, approved, or declined by
   management. Capped so a busy week does not grow this list forever. */
var REQS = [];
function readReqs() {
  try { return JSON.parse(localStorage.getItem('avail.reqs') || '[]') || []; }
  catch (e) { return []; }
}
function writeReqs(list) {
  try { localStorage.setItem('avail.reqs', JSON.stringify(list.slice(0, 25))); } catch (e) {}
}

function nameAsked() {
  try { return localStorage.getItem('avail.name.asked') === '1'; } catch (e) { return true; }
}
function markAsked() {
  try { localStorage.setItem('avail.name.asked', '1'); } catch (e) {}
}

function paintNameAsk() {
  var box = $('name-ask');
  if (NAME || nameAsked()) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.className = 'nm';
  box.innerHTML =
    '<div class="nm-t">Your name</div>' +
    '<div class="nm-s">Added to the reservation requests you send, so the desk knows ' +
      'who asked. Stored on this phone only.</div>' +
    '<div class="nm-r">' +
      '<input id="nm-in" type="text" autocomplete="name" placeholder="e.g. Fawad khan">' +
      '<button id="nm-ok">Save</button>' +
      '<button class="nm-sk" id="nm-skip">Skip</button>' +
    '</div>';
  $('nm-ok').onclick = function () {
    NAME = String($('nm-in').value || '').trim();
    if (NAME) writeName(NAME);
    markAsked(); paintNameAsk();
  };
  $('nm-skip').onclick = function () { markAsked(); paintNameAsk(); };
  $('nm-in').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('nm-ok').click(); }
  });
}

/* ── fetching ──────────────────────────────────────────────────────────────
   One call on load, then every two minutes WHILE THE PAGE IS VISIBLE. A phone
   in a pocket must not poll. A failed refetch keeps the last good data on
   screen and marks the timestamp instead — a dealer reading a stale figure that
   admits it is stale is fine; a blank screen in a WhatsApp group is not. */
var TIMER = null;
async function load(first) {
  var r;
  try { r = await sb.rpc('get_public_availability', { p_token: TOKEN }); }
  catch (e) { r = null; }
  var d = r && r.data;

  if (!d || !d.success) {
    if (first) return dead();
    STALE = true; paintUpdated();          // keep what is on screen
    return;
  }

  P = d; FETCHED = Date.now(); STALE = false;
  refreshMyReqs();          // a decision reaches the dealer on the same rhythm

  if (first) {
    $('boot').hidden = true;
    $('app').hidden = false;
    document.title = (P.project || 'Availability');
  }
  render();
}

var SAYS = { pending: 'Waiting', approved: 'Reserved for you',
             declined: 'Declined by Management', stale: 'Unit was taken',
             expired: 'Expired' };

function paintMyReqs() {
  var box = $('myq');
  if (!box) return;
  if (!REQS.length) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.className = 'myq';
  box.innerHTML = '<div class="myq-h">Your requests</div>' +
    REQS.slice(0, 6).map(function (r) {
      var st = r.status || 'pending';
      return '<div class="myq-r">' +
        '<span class="u">' + esc(r.unit) + '</span>' +
        '<span class="d">' + esc(r.days) + ' day' + (r.days === 1 ? '' : 's') +
          '  \u00b7  ' + esc(initials(P && P.project)) + '-REQ-' + esc(r.ref) + '</span>' +
        '<span class="s s-' + esc(st) + '">' + esc(SAYS[st] || st) + '</span>' +
      '</div>';
    }).join('');
}

/* Asks only about the refs this phone holds, through the link that made them.
   Folded into the same two-minute rhythm as the availability itself, so a
   decision reaches the dealer without them doing anything. */
async function refreshMyReqs() {
  if (!REQS.length) return;
  var open = REQS.filter(function (r) { return (r.status || 'pending') === 'pending'; });
  if (!open.length) return;
  try {
    var r = await sb.rpc('get_request_status',
      { p_token: TOKEN, p_refs: open.map(function (x) { return x.ref; }) });
    var d = r && r.data;
    if (!d || !d.success) return;
    var by = {};
    (d.requests || []).forEach(function (x) { by[x.ref] = x.status; });
    var changed = false;
    REQS.forEach(function (x) {
      if (by[x.ref] && by[x.ref] !== x.status) { x.status = by[x.ref]; changed = true; }
    });
    if (changed) { writeReqs(REQS); paintMyReqs(); }
  } catch (e) { /* the receipt can wait; the board matters more */ }
}

function dead() {
  $('boot').hidden = true;
  document.body.innerHTML =
    '<div class="dead"><b>This link is not available</b>' +
    '<span>It may have been withdrawn, or replaced with a newer one. ' +
    'Ask whoever shared it for the current link.</span></div>';
}

function paintUpdated() {
  var el = $('upd');
  if (!FETCHED) { el.textContent = ''; return; }
  el.textContent = 'Updated ' + hhmm(FETCHED);
  el.classList.toggle('stale', STALE);
  el.title = STALE ? 'Could not refresh — showing the last known position' : '';
}

function schedule() {
  clearTimeout(TIMER);
  if (document.hidden) return;
  TIMER = setTimeout(function () { load(false).then(schedule); }, 120000);
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { clearTimeout(TIMER); return; }
  load(false).then(schedule);        // catch up the moment it comes back
});

/* ── render ──────────────────────────────────────────────────────────────── */
function render() {
  $('ttl').textContent = P.project || 'Availability';
  $('co').textContent = P.company || '';
  paintUpdated();
  paintNameAsk();
  paintMyReqs();
  if (FLOOR == null) { renderHome(); } else { renderFloor(); }
  if (SHEET) refreshSheet();
}

function renderHome() {
  $('floor').hidden = true;
  /* UNMOUNTED, not hidden. The one hard rule of this page is that a floor's
     units are never in the document unless that floor is open. */
  $('units').innerHTML = '';
  $('home').hidden = false;

  var tot = 0, av = 0;
  $('floors').innerHTML = (P.floors || []).map(function (f, i) {
    tot += Number(f.total || 0); av += Number(f.available || 0);
    var n = Number(f.available || 0);
    return '<button data-f="' + i + '">' +
      '<span class="fn">' + esc(f.floor_label) + '</span>' +
      '<span class="fc' + (n ? '' : ' none') + '">' +
        (n ? '<span class="num">' + n + '</span> available' : 'none available') +
      '</span></button>';
  }).join('');

  $('tot').innerHTML = '<span class="num">' + av + '</span> of <span class="num">' +
    tot + '</span> units available';

  runSearch();          // keep any query alive across a refetch
}

function renderFloor() {
  var f = P.floors[FLOOR];
  if (!f) { FLOOR = null; return renderHome(); }
  $('home').hidden = true;
  $('res').hidden = true;
  $('floor').hidden = false;
  $('fname').textContent = f.floor_label;
  $('fcount').innerHTML = '<span class="num">' + Number(f.available || 0) + '</span> of ' +
    '<span class="num">' + Number(f.total || 0) + '</span> available';
  $('showall').checked = SHOWALL;

  var list = (f.units || []).filter(function (u) {
    return SHOWALL || u.s === 'available';
  });

  $('units').innerHTML = list.map(function (u) {
    var off = u.s !== 'available';
    return '<button data-u="' + esc(u.n) + '"' + (off ? ' class="off" disabled' : '') + '>' +
      '<span class="un">' + esc(u.n) + '</span>' +
      (off ? '<span class="off-l">Not Available</span>'
           : '<span class="ua">' + esc(area(u)) + '</span>') +
    '</button>';
  }).join('');

  var none = !list.length;
  $('fempty').hidden = !none;
  if (none) {
    $('fempty').textContent = SHOWALL
      ? 'No units on this floor.'
      : 'Nothing available on this floor right now.';
  }
}

/* ── search: across every floor, entirely in the browser ─────────────────
   The payload is already here; a keystroke must never become a request. Empty
   query shows nothing at all — a list that appears before you have typed is
   noise, not help. */
function runSearch() {
  var q = String($('q').value || '').trim();
  var box = $('res');
  if (!q) { box.hidden = true; box.innerHTML = ''; return; }

  var k = norm(q), out = [];
  (P.floors || []).forEach(function (f, fi) {
    (f.units || []).forEach(function (u) {
      if (norm(u.n).indexOf(k) === 0) out.push({ u: u, f: f, fi: fi });
    });
  });
  /* Available first — this page exists to find something to sell. Within that,
     the order the payload already has, which is the order the building is
     walked. */
  out.sort(function (a, b) {
    var aa = a.u.s === 'available' ? 0 : 1, bb = b.u.s === 'available' ? 0 : 1;
    return aa - bb;
  });

  box.hidden = false;
  if (!out.length) {
    box.innerHTML = '<div class="res-none">No unit starts with ' + esc(q) + '.</div>';
    return;
  }
  var show = out.slice(0, 8);
  box.innerHTML = show.map(function (r, i) {
    var off = r.u.s !== 'available';
    return '<button class="res-r" data-i="' + i + '"' + (off ? ' disabled' : '') + '>' +
      '<span class="n">' + esc(r.u.n) + '</span>' +
      '<span class="f">' + esc(r.f.floor_label) + '</span>' +
      '<span class="a">' + (off ? 'Not Available' : esc(area(r.u))) + '</span>' +
    '</button>';
  }).join('') +
    (out.length > show.length
      ? '<div class="res-more">' + (out.length - show.length) + ' more — keep typing</div>'
      : '');
  box.__hits = show;
}

/* ── the request sheet ───────────────────────────────────────────────────── */
/* refCode() is gone. The ref is issued by the server when the request is
   written, so the number in the WhatsApp message is the number the desk holds.
   A ref invented in the browser was a number nobody could look up. */
/* Is this duration one of the chips, or something the rep typed? */
function CUSTOM(d) { return [1, 3, 7].indexOf(Number(d)) < 0; }

/* One place decides which control is lit, so a chip and the box can never
   both look chosen. */
function markDur() {
  var box = $('dur'); if (!box) return;
  var all = box.querySelectorAll('button');
  for (var i = 0; i < all.length; i++) {
    all[i].classList.toggle('on', Number(all[i].getAttribute('data-d')) === Number(SHEET.days));
  }
  var cu = $('dcust');
  if (cu) cu.classList.toggle('on', CUSTOM(SHEET.days));
}

function initials(name) {
  var w = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!w.length) return 'AV';
  return (w[0][0] + (w.length > 1 ? w[w.length - 1][0] : (w[0][1] || ''))).toUpperCase();
}

function openSheet(unitNo, floorIdx) {
  var f = P.floors[floorIdx];
  var u = (f.units || []).filter(function (x) { return x.n === unitNo; })[0];
  /* Tapping an unavailable unit does nothing at all — no sheet, no message. */
  if (!u || u.s !== 'available') return;
  SHEET = { n: unitNo, fi: floorIdx, days: 7, ref: null };
  paintSheet();
  $('scrim').classList.add('on');
  $('sheet').classList.add('on');
}
function closeSheet() {
  SHEET = null;
  $('scrim').classList.remove('on');
  $('sheet').classList.remove('on');
}

function sheetUnit() {
  if (!SHEET) return null;
  var f = P.floors[SHEET.fi]; if (!f) return null;
  return (f.units || []).filter(function (x) { return x.n === SHEET.n; })[0] || null;
}

function message() {
  var u = sheetUnit(), f = P.floors[SHEET.fi];
  var L = [];
  L.push((P.project || 'Availability') + ' — Reservation Request');
  /* The server's ref, not one invented here. Without it the request did not
     register, and the line says so instead of printing a number nobody holds. */
  L.push(SHEET.ref ? ('Ref: ' + initials(P.project) + '-REQ-' + SHEET.ref)
                   : 'Ref: not registered \u2014 please confirm in the group');
  L.push('');
  L.push('Unit: ' + SHEET.n);
  L.push('Floor: ' + f.floor_label);
  L.push('Size: ' + (u ? area(u) : '—'));
  L.push('Duration: ' + SHEET.days + ' day' + (SHEET.days === 1 ? '' : 's'));
  if (NAME) L.push('Requested by: ' + NAME);
  L.push('');
  L.push('Please confirm.');
  return L.join('\n');
}

function paintSheet() {
  if (!SHEET) return;
  var u = sheetUnit(), f = P.floors[SHEET.fi];
  var gone = !u || u.s !== 'available';

  $('sheet').innerHTML =
    '<div class="sh-h"><div>' +
      '<div class="sh-n" id="sh-n">' + esc(SHEET.n) + '</div>' +
      '<div class="sh-m">' + esc(f.floor_label) +
        (u && area(u) ? ' · ' + esc(area(u)) : '') + '</div>' +
    '</div><button class="sh-x" id="sh-x" aria-label="Close">✕</button></div>' +

    (gone
      ? '<div class="gone">This unit is no longer available. It was taken while ' +
        'this was open.</div>'
      : '<div class="sh-l">Hold for</div>' +
        '<div class="dur" id="dur">' +
          [1, 3, 7].map(function (d) {
            return '<button data-d="' + d + '"' + (SHEET.days === d ? ' class="on"' : '') +
                   '>' + d + ' day' + (d === 1 ? '' : 's') + '</button>';
          }).join('') +
          /* Anything else the rep needs. inputmode=numeric so a phone opens the
             number pad rather than a keyboard. */
          '<input id="dcust" inputmode="numeric" maxlength="2" placeholder="\u2026" ' +
            'title="Any number of days, 1 to 90" ' +
            (CUSTOM(SHEET.days) ? 'class="on" value="' + SHEET.days + '"' : '') + '>' +
        '</div>') +

    '<button class="go" id="go"' + (gone ? ' disabled' : '') + '>Request Reservation</button>' +
    '<div class="go-n">The unit is only held once you receive a confirmation.</div>' +

    '<div class="acts">' +
      '<button id="wa"' + (gone ? ' disabled' : '') + '>WhatsApp</button>' +
      '<button id="cp"' + (gone ? ' disabled' : '') + '>Copy</button>' +
    '</div>';

  $('sh-x').onclick = closeSheet;
  if (!gone) {
    $('dur').onclick = function (e) {
      var b = e.target.closest('button[data-d]'); if (!b) return;
      SHEET.days = Number(b.getAttribute('data-d'));
      var cu = $('dcust'); if (cu) { cu.value = ''; cu.classList.remove('on'); }
      markDur();
    };
    var cust = $('dcust');
    if (cust) cust.addEventListener('input', function () {
      /* Out of range does not silently become something else: the box keeps
         what was typed until it is a number this can honour, and the chips
         only let go once it is. */
      var n = parseInt(cust.value, 10);
      if (!(n >= 1 && n <= 90)) { cust.classList.remove('on'); return; }
      SHEET.days = n;
      markDur();
    });
    /* Leaving an unusable number behind would send a duration nobody chose. */
    if (cust) cust.addEventListener('blur', function () {
      var n = parseInt(cust.value, 10);
      if (!(n >= 1 && n <= 90)) { cust.value = ''; cust.classList.remove('on'); markDur(); }
    });
    /* All three do the same thing: register the request, then hand the dealer
       the message. Copy is not a lesser path \u2014 on desktop it is the only one
       that visibly works. */
    $('go').onclick = function () { requestAndSend('wa'); };
    $('wa').onclick = function () { requestAndSend('wa'); };
    $('cp').onclick = function () { requestAndSend('copy'); };
  }
}

/* THE REQUEST REACHES THE DESK, and the WhatsApp message is the receipt.

   The row is written FIRST so the Ref printed in the message is the one the
   desk holds — a ref invented here and never registered would be a number the
   dealer reads out that nobody can find.

   If the write fails, the message still goes. That is exactly how this worked
   before the queue existed, so a dealer is never blocked by our server being
   unreachable — but the message says so, and a toast says so, rather than
   letting them believe a request is waiting when it is not. */
var SENDING = false;
async function submitRequest() {
  if (!SHEET) return null;
  try {
    var r = await sb.rpc('submit_availability_request', {
      p_token: TOKEN, p_unit_no: SHEET.n, p_days: SHEET.days, p_name: NAME || null });
    var d = r && r.data;
    if (d && d.success) {
      SHEET.ref = d.ref;
      var list = readReqs().filter(function (x) { return x.ref !== d.ref; });
      list.unshift({ ref: d.ref, unit: SHEET.n, days: SHEET.days, status: 'pending' });
      REQS = list; writeReqs(list); paintMyReqs();
      return { ok: true, already: !!d.already };
    }
    return { ok: false, error: (d && d.error) || 'failed',
             message: (d && d.message) || null };
  } catch (e) { return { ok: false, error: 'offline' }; }
}

async function requestAndSend(how) {
  if (!SHEET || SENDING) return;
  /* If the name was skipped earlier, ask HERE — this is the moment it means
     something, and the desk is useless without it. Once given it is final,
     the same as if it had been given on the first screen. */
  if (!NAME) { askNameInSheet(how); return; }

  SENDING = true;
  var go = document.getElementById('go');
  if (go) { go.disabled = true; go.textContent = 'Sending\u2026'; }
  var res = await submitRequest();
  SENDING = false;
  if (go) { go.disabled = false; go.textContent = 'Request Reservation'; }

  if (res && !res.ok) {
    if (res.error === 'unit_unavailable') { toast('That unit has just been taken.'); return refreshSheet(); }
    if (res.error === 'queue_full' || res.error === 'too_many') { toast(res.message); return; }
    if (res.error === 'not_available') { toast('This link is no longer active.'); return; }
    /* offline or unknown: send anyway, and say the desk has not got it */
    toast('Sent, but the desk has not registered it \u2014 please confirm in the group.');
    SHEET.ref = null;
  } else if (res && res.already) {
    toast('A request for this unit is already waiting.');
  }
  if (how === 'copy') {
    window._portalCopy(message(),
      'Request copied \u2014 paste it into the group.',
      'Could not copy. Select the text and copy it by hand.');
  } else { sendWhatsApp(); }
  paintSheet();
}

function askNameInSheet(how) {
  var host = document.getElementById('sheet');
  if (document.getElementById('ask-in')) { document.getElementById('ask-in').focus(); return; }
  var box = document.createElement('div');
  box.className = 'ask';
  box.innerHTML =
    '<div class="ask-t">Your name, so the desk knows who asked</div>' +
    '<div class="ask-r"><input id="ask-in" type="text" autocomplete="name" ' +
      'placeholder="e.g. Fawad khan"><button class="go" id="ask-ok" ' +
      'style="width:auto;margin:0;padding:0 18px;height:42px">Save</button></div>';
  host.appendChild(box);
  var input = document.getElementById('ask-in');
  try { input.focus(); } catch (e) {}
  function save() {
    var v = String(input.value || '').trim();
    if (!v) { try { input.focus(); } catch (e) {} return; }
    NAME = v; writeName(v); markAsked(); paintNameAsk();
    box.remove();
    requestAndSend(how);
  }
  document.getElementById('ask-ok').onclick = save;
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
  });
}

function sendWhatsApp() {
  /* No number in the URL, so WhatsApp asks which chat — the dealer picks their
     own group. On desktop this opens a page that may do nothing visible, which
     is exactly why Copy sits beside it at the same size rather than behind a
     failure. */
  var url = 'https://wa.me/?text=' + encodeURIComponent(message());
  try { window.open(url, '_blank', 'noopener'); } catch (e) { location.href = url; }
}

/* A refetch can land while the sheet is open. If the unit went in the meantime
   the sheet must say so and the button must stop working — sending a request
   for a unit that is already gone wastes a reply from the desk. */
function refreshSheet() { paintSheet(); }

/* ── wiring ──────────────────────────────────────────────────────────────── */
$('q').addEventListener('input', runSearch);
$('res').addEventListener('click', function (e) {
  var b = e.target.closest('.res-r'); if (!b || b.disabled) return;
  var hits = $('res').__hits || [];
  var r = hits[Number(b.getAttribute('data-i'))]; if (!r) return;
  openSheet(r.u.n, r.fi);
});
$('floors').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-f]'); if (!b) return;
  FLOOR = Number(b.getAttribute('data-f'));
  SHOWALL = false;
  $('q').value = ''; runSearch();
  renderFloor();
  window.scrollTo(0, 0);
});
$('back').onclick = function () { FLOOR = null; renderHome(); window.scrollTo(0, 0); };
$('showall').addEventListener('change', function () {
  SHOWALL = !!$('showall').checked;
  renderFloor();
});
$('units').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-u]'); if (!b || b.disabled) return;
  openSheet(b.getAttribute('data-u'), FLOOR);
});
$('scrim').onclick = closeSheet;
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && SHEET) closeSheet();
});

/* ── go ──────────────────────────────────────────────────────────────────── */
NAME = readName();
REQS = readReqs();
/* The screenshot harness renders a CAPTURED payload so the scale screens can be
   photographed without an Awami link being created. ?preview=1 only stops this
   page from fetching on its own — it grants nothing, reveals nothing, and
   leaves the page blank until a script hands it data. */
var PREVIEW = new URLSearchParams(location.search).get('preview') === '1';
if (PREVIEW) { /* wait for _availPreview */ }
else if (!TOKEN) { dead(); }
else { load(true).then(schedule); }

/* the harness renders against a captured payload so the scale screens can be
   photographed without an Awami link being created */
window._availPreview = function (payload) {
  P = payload; FETCHED = Date.now(); STALE = false;
  $('boot').hidden = true; $('app').hidden = false;
  FLOOR = null; SHEET = null; SHOWALL = false;
  REQS = readReqs();
  render();
  return (P.floors || []).length;
};
</script>
</body>
</html>
