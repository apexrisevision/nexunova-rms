# Supabase project config — pushed to remote via `supabase config push`.
# Only the sections present here are synced. Values for fields where the
# CLI's default differs from what's already on the remote are pinned here
# to PRESERVE the existing remote behaviour (don't clobber).
project_id = "nexunova-rms"

[auth]
site_url = "https://rms.nexunova.com"
# Every URL that confirmation / reset / 2FA links are allowed to redirect to.
# Includes the Electron `nexunovarms://` deep-link scheme.
additional_redirect_urls = [
  "https://rms.nexunova.com",
  "https://rms.nexunova.com/login.html",
  "https://rms.nexunova.com/login.html?flow=confirm",
  "https://rms.nexunova.com/login.html?flow=reset",
  "nexunovarms://auth/callback",
  "nexunovarms://auth/callback?flow=confirm",
  "nexunovarms://auth/callback?flow=reset",
  # Local dev origins (so confirmation/reset links work during testing)
  "http://localhost:3000/**",
  "http://localhost:5500/**",
  "http://127.0.0.1:3000/**",
  "http://127.0.0.1:5500/**"
]

# Preserve currently-enabled TOTP MFA (CLI defaults this to false).
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup       = true
enable_confirmations = true
# Preserve current email rate limit + OTP length (CLI defaults: 1s / 6).
max_frequency = "1m0s"
otp_length    = 8
