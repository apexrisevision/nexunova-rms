<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexuFinance — Daily Closing</title>
<meta name="robots" content="noindex, nofollow">

<!-- ═══════════════════════════════════════════════════════════════════════
     NEXUFINANCE v1 — the daily cash & bank closing, rebuilt small.
     docs/PLAN.md is the spec this was built from; docs/reference/
     awami-daily-closing.html is the approved design this screen ports.

     Same session as RMS (this page never shows a login form — sign in at
     /login.html and this page is simply already signed in, same as v0 was).
     Everything else about a person — role, which company, the chart of
     accounts, floors — comes from ONE server call, nf_get_context(), never
     assumed here. A feature flag is not part of that answer: whether
     somebody has a cash book is answered by nf_members, nothing else.
     ═══════════════════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/nf/nf.css?v=20260917a">
<link rel="stylesheet" href="css/nf/nf-print.css?v=20260917a" media="print">
<script>
try { var t = localStorage.getItem('nf-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  #nf-root{min-height:60vh}
  .nf-topbar{display:flex;align-items:center;gap:12px;padding:8px 16px;font-size:12px;color:var(--muted);max-width:1200px;margin:0 auto}
  .nf-topbar a{color:inherit}
  /* Outside .sheet, so the print CSS's own zoom never touches it — an
     unscaled strip above an already page-tight sheet was enough by itself
     to spill a second, nearly blank page. Navigation chrome has no business
     on a printed cash book regardless. */
  @media print{.nf-topbar{display:none}}
</style>
</head>
<body>
<div class="nf-topbar"><a href="/login.html">&larr; Back to RMS</a></div>
<div id="nf-root">
  <div class="nf-gate" style="max-width:520px;margin:80px auto;text-align:center">
    <h2>Loading…</h2>
    <p>Opening the cash book.</p>
  </div>
</div>

<script src="js/vendor/supabase-js-2.34.0.umd.js?v=20260917a"></script>
<script src="js/supabase.js?v=20260917a"></script>
<script src="js/nf/nf-format.js?v=20260917a"></script>
<script src="js/nf/nf-api.js?v=20260917a"></script>
<script src="js/nf/nf-messages.js?v=20260917a"></script>
<script src="js/nf/nf-sheet.js?v=20260917a"></script>
<script>
(function () {
  'use strict';
  var root = document.getElementById('nf-root');
  var params = new URLSearchParams(location.search);

  function gate(title, message, actionHtml) {
    root.innerHTML = '<div class="nf-gate"><h2>' + title + '</h2><p>' + message + '</p>' + (actionHtml || '') + '</div>';
  }
  function fail(what, e) {
    try { console.error('[nexufinance]', what, e); } catch (_) {}
    gate(what, (e && e.message) ? e.message : 'The page could not finish loading.',
      '<a class="btn primary" href="' + location.pathname + location.search + '" style="text-decoration:none;display:inline-block">Try again</a>');
  }

  // The database client and the module. Read once, passed by value — see
  // js/supabase.js and the trap it documents (a script-scope const is not on
  // window). Nothing below this line reaches for the global again.
  var SB = null;
  try { SB = (typeof supabase !== 'undefined' && supabase && typeof supabase.rpc === 'function') ? supabase : null; }
  catch (e) { SB = null; }

  if (!SB) return fail('Could not reach the database', new Error('The Supabase client did not load. Reload the page.'));
  if (!window.NfFmt || !window.NfApi || !window.NfMsg || !window.NfSheet) {
    return fail('Could not load the cash book', new Error('A module file did not load. Reload the page.'));
  }

  var api = window.NfApi.build(SB);

  // ONE session path. There is no "fresh login" branch — nobody logs in
  // here. There is a session or there is not.
  SB.auth.getSession()
    .then(function (s) {
      var session = s && s.data && s.data.session;
      if (!session) {
        gate('Sign in first', 'NexuFinance uses your RMS sign-in. Sign in there and open this page again.',
          '<a class="btn primary" href="/login.html" style="text-decoration:none;display:inline-block">Go to sign in</a>');
        return null;
      }
      return api.getContext();
    })
    .then(function (ctx) {
      if (!ctx) return;
      var memberships = ctx.memberships || [];
      if (!memberships.length) {
        return gate('You do not have a cash book here',
          'Your account is not set up for Daily Closing on any company. A director can add you.');
      }
      var wantedId = params.get('company');
      var m = memberships.filter(function (x) { return x.company_id === wantedId; })[0] || memberships[0];

      document.title = 'NexuFinance — ' + (m.company_name || 'Daily Closing');

      return window.NfSheet.mount(root, {
        api: api,
        companyId: m.company_id,
        role: m.role,
        displayName: m.display_name,
        companyName: m.company_name,
        settings: m.settings || {},
      });
    })
    .catch(function (e) { fail('Could not open the cash book', e); });
})();
</script>
</body>
</html>
