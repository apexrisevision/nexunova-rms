<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexunova</title>
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="preload" as="image" href="/assets/nexunova-splash.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- ═══════════════════════════════════════════════════════════════════════
     NEXUNOVA — the one front door.

     Three products, three separate logins, and until now three URLs somebody
     had to know by heart. This is the layer in front of them.

     IT ASKS EVERY TIME. Open the app, watch the splash, choose one of the
     three, sign in — that is the whole shape of it, on every launch. It was
     built to remember instead, and that turned out to be the wrong thing: one
     memory cannot serve three products, so the person who had last opened RMS
     found the Self Service Portal's own icon opening the RMS login. Three
     doors on every open costs one tap and can never send anybody to the wrong
     place.

     It reaches the installed app without anybody reinstalling: the manifest
     keeps its id, so Chrome treats it as the same app and simply updates
     start_url. And the portal sends a plain launch here even on installs whose
     start_url has not been rewritten yet, so this is what happens on every
     open, today, without a reinstall.

     THE SPLASH is the desktop app's splash, rebuilt for the web: the same
     breathing logo, the same two counter-rotating arcs, the same pulse rings
     and the same typed NEXUNOVA. It plays first and hands over to the doors.

     WHY NOT ONE LOGIN. RMS signs in with a company code, a username and a
     password; the portal with a phone and a PIN; attendance with an email and
     a password on a different database entirely. They are three identity
     systems, not one behind three buttons, and pretending otherwise would mean
     merging user tables that have no business being merged. So each door opens
     its own login — which is what was asked for.
     ═══════════════════════════════════════════════════════════════════════ -->
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0b1020; --card:#141a2e; --card-h:#1a2138; --line:rgba(255,255,255,.09);
    --t1:#eef1f8; --t2:#a6b0c8; --t3:#6f7b96;
    --brand:#6366f1; --ok:#22c55e; --sh:0 10px 34px rgba(0,0,0,.42);
  }
  html,body{min-height:100%}
  body{
    background:
      radial-gradient(1100px 620px at 12% -8%, rgba(99,102,241,.20), transparent 62%),
      radial-gradient(900px 520px at 92% 4%, rgba(139,92,246,.16), transparent 60%),
      var(--bg);
    color:var(--t1); font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased; user-select:none;
    display:flex; align-items:center; justify-content:center;
    padding:24px 18px calc(24px + env(safe-area-inset-bottom));
    min-height:100dvh; overflow:hidden;
  }

  /* ══ SPLASH ══════════════════════════════════════════════════════════
     A copy of electron/splash.html, not an interpretation of it. Every value
     below — 260px, 26px, 21px, 0.38em, every inset, every duration and every
     rgba — is the desktop app's own. The only thing that could not cross over
     is the transparent window: on Windows the desktop shows through behind the
     logo, and a web page has no such thing, so it sits on this page's own
     background instead. Nothing else differs, including the logo, which is the
     identical 2290px file copied byte for byte out of the desktop build.
     ══════════════════════════════════════════════════════════════════════ */
  #splash{
    position:fixed; inset:0; z-index:10; display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:26px;
    background:inherit;
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
    transition:background-color .5s ease;
  }
  /* ── the logo does not leave; it shrinks into the doors ──────────────────
     It used to fade out and the doors faded in behind it, two things dissolving
     past each other. Now the ground under it turns clear, the doors rise behind
     it, and the mark itself flies down to the top of them and stays — the same
     mark, still breathing, still turning, only smaller. The flight is a plain
     transform on the shell, so nothing reflows while it moves and the rings and
     the aura come along at exactly their own proportions. */
  #splash.zoom{background-color:transparent;pointer-events:none}
  #splash.zoom .typewriter{opacity:0}
  .typewriter{transition:opacity .3s ease}
  #splash .logo-shell{transition:transform .95s cubic-bezier(.22,1,.36,1)}
  #splash.gone{display:none}
  .sp-in{
    display:flex;flex-direction:column;align-items:center;gap:26px;opacity:0;
    animation:wrapIn .65s cubic-bezier(.22,1,.36,1) .05s forwards;
  }
  @keyframes wrapIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  /* 260px, exactly as on the desktop. On a narrow phone it steps down only far
     enough to stay on the screen — never smaller than it has to be. */
  .logo-shell{position:relative;width:260px;height:260px;max-width:82vw;max-height:82vw;
    display:flex;align-items:center;justify-content:center}
  .ring-spin{position:absolute;inset:-14px;border-radius:50%;
    background:conic-gradient(from 0deg,transparent 0%,rgba(56,189,248,.90) 18%,rgba(129,140,248,.70) 30%,rgba(192,132,252,.50) 40%,transparent 55%);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#fff calc(100% - 2px));
            mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#fff calc(100% - 2px));
    animation:spinRing 2.4s linear infinite}
  .ring-spin-2{position:absolute;inset:-26px;border-radius:50%;
    background:conic-gradient(from 180deg,transparent 0%,rgba(192,132,252,.55) 14%,rgba(56,189,248,.30) 24%,transparent 38%);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#fff calc(100% - 1px));
            mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#fff calc(100% - 1px));
    animation:spinRing 3.8s linear infinite reverse}
  @keyframes spinRing{to{transform:rotate(360deg)}}
  .logo-aura{position:absolute;inset:-40px;border-radius:50%;
    background:radial-gradient(circle,rgba(56,189,248,.18) 0%,rgba(168,85,247,.12) 45%,transparent 70%);
    filter:blur(22px);animation:aura 3.6s ease-in-out infinite}
  @keyframes aura{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.20);opacity:1}}
  .ring-pulse,.ring-pulse-2{position:absolute;inset:-6px;border-radius:50%;animation:pulse 2.8s ease-out infinite}
  .ring-pulse{border:1px solid rgba(56,189,248,.25)}
  .ring-pulse-2{border:1px solid rgba(168,85,247,.20);animation-delay:1.4s}
  @keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.55);opacity:0}}
  .logo{width:100%;height:100%;object-fit:contain;position:relative;z-index:1;
    filter:drop-shadow(0 0 28px rgba(56,189,248,.65)) drop-shadow(0 0 65px rgba(168,85,247,.42));
    animation:logoBreathe 3.6s ease-in-out infinite}
  @keyframes logoBreathe{
    0%,100%{transform:scale(1) translateY(0);filter:drop-shadow(0 0 28px rgba(56,189,248,.65)) drop-shadow(0 0 65px rgba(168,85,247,.42))}
    50%{transform:scale(1.03) translateY(-6px);filter:drop-shadow(0 0 42px rgba(56,189,248,.85)) drop-shadow(0 0 88px rgba(168,85,247,.58))}}
  .typewriter{font-size:21px;font-weight:800;letter-spacing:.38em;
    min-height:32px;text-align:center;text-indent:.38em;
    background:linear-gradient(90deg,#38bdf8 0%,#818cf8 50%,#c084fc 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 0 10px rgba(56,189,248,.38))}

  /* the moment somebody presses a door, the splash comes back as the hop */
  @media (prefers-reduced-motion:reduce){
    .ring-spin,.ring-spin-2,.logo-aura,.ring-pulse,.ring-pulse-2,.logo{animation:none!important}
    .sp-in{animation-duration:.01s}
    #splash .logo-shell{transition:none!important}
  }

  /* Where the mark lands. It is the identical shell — same image, same two
     arcs, same pulses, same aura, same breathing — held at 46px by one scale on
     the shell itself, so every inset and every blur shrinks with it rather than
     being redrawn by hand at a small size. It is invisible until the flying
     copy arrives on top of it, and the swap happens with the two at the same
     size in the same place. */
  .logo-mini{position:relative;width:46px;height:46px;flex:0 0 46px;
    opacity:0;transition:opacity .2s ease}
  .wrap.landed .logo-mini{opacity:1}
  .logo-mini .logo-shell{position:absolute;left:50%;top:50%;
    width:260px;height:260px;max-width:none;max-height:none;
    transform:translate(-50%,-50%) scale(.1769);transform-origin:50% 50%}

  /* ══ THE DOORS ═══════════════════════════════════════════════════════ */
  .wrap{width:100%;max-width:460px;opacity:0;transition:opacity .45s ease}
  .wrap.show{opacity:1}
  .brand{display:flex;align-items:center;gap:11px;justify-content:center;margin-bottom:6px}
  /* .brand img used to size the flat 38px icon that sat here. The mark is the
     splash's own shell now, and that rule outranked .logo's width:100% — it
     squeezed the image to 38px inside a 260px shell that is then scaled down,
     so the logo arrived as a seven-pixel speck. The shell sizes itself. */
  .brand .n{font-size:19px;font-weight:800;letter-spacing:-.2px}
  .brand .n span{background:linear-gradient(120deg,#a5b4fc,#c4b5fd);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{text-align:center;color:var(--t2);font-size:13.5px;margin-bottom:22px}

  .card{display:flex;align-items:center;gap:14px;width:100%;
    background:var(--card);border:1px solid var(--line);border-radius:15px;
    padding:15px 16px;margin-bottom:11px;cursor:pointer;text-align:left;
    color:inherit;font:inherit;box-shadow:var(--sh);
    transition:transform .16s ease,background .16s ease,border-color .16s ease}
  .card:hover{background:var(--card-h);border-color:rgba(255,255,255,.16);transform:translateY(-1px)}
  .card:active{transform:translateY(0) scale(.995)}
  .card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .ic{width:44px;height:44px;flex:0 0 44px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(140deg,rgba(99,102,241,.24),rgba(139,92,246,.16));
    border:1px solid rgba(255,255,255,.10)}
  .ic svg{width:21px;height:21px;stroke:#c7d2fe;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  /* the label parts are spans (a button may not contain divs), so they are
     told to stack — left inline they run together into one sentence */
  .tx{flex:1;min-width:0;display:block}
  .tt{display:block;font-size:15px;font-weight:700;letter-spacing:-.1px}
  .ds{display:block;font-size:12.5px;color:var(--t3);margin-top:2px;line-height:1.35}
  .go{color:var(--t3);flex:0 0 auto}
  .go svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .who{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:11.5px;font-weight:600;color:var(--ok)}
  .who[hidden]{display:none}
  .foot{margin-top:16px;text-align:center;color:var(--t3);font-size:11.5px;line-height:1.6}
</style>
</head>
<body>

<!-- The splash covers everything until the doors are ready, and comes back over
     them the moment one is pressed — so the last thing seen before an app loads
     is the same logo the desktop app shows. -->
<div id="splash">
  <div class="sp-in">
    <div class="logo-shell">
      <div class="logo-aura"></div>
      <div class="ring-spin-2"></div>
      <div class="ring-spin"></div>
      <div class="ring-pulse"></div>
      <div class="ring-pulse-2"></div>
      <img class="logo" src="/assets/nexunova-splash.png" alt="">
    </div>
    <div class="typewriter" id="tw"></div>
  </div>
</div>

<div class="wrap" id="wrap">
  <div class="brand">
    <!-- the same shell as the splash, at 46px — this is where the mark lands -->
    <span class="logo-mini" id="mini" aria-hidden="true">
      <span class="logo-shell">
        <span class="logo-aura"></span>
        <span class="ring-spin-2"></span>
        <span class="ring-spin"></span>
        <span class="ring-pulse"></span>
        <span class="ring-pulse-2"></span>
        <img class="logo" src="/assets/nexunova-splash.png" alt="">
      </span>
    </span>
    <div class="n">Nexu<span>nova</span></div>
  </div>
  <div class="sub" id="sub">Which one are you opening?</div>

  <button class="card" id="c-rms" onclick="go('rms')">
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg></span>
    <span class="tx">
      <span class="tt">RMS</span>
      <span class="ds">Sales, recovery, payments and reports</span>
      <span class="who" id="w-rms" hidden><i></i><span></span></span>
    </span>
    <span class="go"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
  </button>

  <button class="card" id="c-portal" onclick="go('portal')">
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
    <span class="tx">
      <span class="tt">Self Service Portal</span>
      <span class="ds">Your leads, attendance, leave and payslips</span>
      <span class="who" id="w-portal" hidden><i></i><span></span></span>
    </span>
    <span class="go"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
  </button>

  <button class="card" id="c-attend" onclick="go('attend')">
    <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/></svg></span>
    <span class="tx">
      <span class="tt">Attendance</span>
      <span class="ds">Register, gate log, leave and payroll</span>
    </span>
    <span class="go"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
  </button>

  <div class="foot">
    Each one keeps its own sign-in.<br>
    This screen appears again after you sign out.
  </div>
</div>

<script>
(function () {
  'use strict';

  var APPS = {
    rms:    { url: '/login.html',        name: 'RMS' },
    portal: { url: '/sales-portal.html', name: 'Self Service Portal' },
    attend: { url: 'https://attend.nexunova.com/login.html', name: 'Attendance' }
  };
  var splash = document.getElementById('splash');

  function ls(fn, dflt) { try { return fn(); } catch (e) { return dflt; } }
  var params = new URLSearchParams(location.search);

  /* Nothing is remembered and nothing is skipped: every launch shows the
     doors. An old install may still carry the key this once wrote, so it is
     cleared on the way past rather than left to sit in people's browsers. */
  ls(function () { localStorage.removeItem('nx.hub.app'); });

  // ── the typed word, exactly as the desktop splash types it ──────────────
  var WORD = 'NEXUNOVA', tw = document.getElementById('tw'), i = 0, done = null;
  (function typeNext() {
    if (i <= WORD.length) { tw.textContent = WORD.slice(0, i); i++; return setTimeout(typeNext, i <= 1 ? 80 : 60); }
    setTimeout(function () { if (done) done(); }, 300);
  })();

  var wrap  = document.getElementById('wrap');
  var shell = splash.querySelector('.logo-shell');
  var mini  = document.getElementById('mini');
  var slow  = !window.matchMedia || !matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Where the mark has to end up: the centre of the 46px slot at the top of the
     doors, and the size of it. Measured rather than assumed, because the shell
     is 260px on a desk and 82vw on a narrow phone, and the slot moves with the
     text beside it. */
  function flightTo(el) {
    var a = shell.getBoundingClientRect(), b = el.getBoundingClientRect();
    if (!a.width || !b.width) return null;
    return 'translate(' + ((b.left + b.width / 2) - (a.left + a.width / 2)) + 'px,' +
                          ((b.top + b.height / 2) - (a.top + a.height / 2)) + 'px)' +
           ' scale(' + (b.width / a.width) + ')';
  }

  var revealed = false;
  function reveal() {
    if (revealed) return; revealed = true;
    // the ground turns clear and the doors rise behind the mark, not after it
    splash.classList.add('zoom');
    wrap.classList.add('show');
    var to = slow ? flightTo(mini) : null;
    if (!to) {                       // reduced motion, or nothing to measure
      wrap.classList.add('landed');
      splash.classList.add('gone');
      return;
    }
    requestAnimationFrame(function () { shell.style.transform = to; });
    // it arrives, the one that lives there fades up underneath it, and the
    // flying copy is taken away — same mark, same size, same place, no blink
    setTimeout(function () { wrap.classList.add('landed'); }, 820);
    setTimeout(function () { splash.classList.add('gone'); }, 1050);
  }
  /* The doors are the whole point of this page, so nothing is allowed to leave
     somebody staring at a splash that never lifts — not a stalled timer, not a
     throw further down this file. Two and a half seconds and they open,
     whatever else happened. */
  setTimeout(reveal, 2500);

  /* A same-origin door is opened with #hub on it. The portal's installed
     start_url still points at the portal itself, so that page sends a plain
     launch back here — which is what makes the splash play on every open. The
     marker is how it knows the hub has ALREADY played and it should stay put;
     without it the two would bounce off each other forever. */
  function land(url) { return url.charAt(0) === '/' ? url + '#hub' : url; }

  window.go = function (which) {
    var a = APPS[which]; if (!a) return;
    var url = land(a.url);
    /* The mark grows back out of the header to cover the hop, so the last thing
       seen before an app loads is the same logo the desktop app shows. It is
       the flight run backwards: the flying copy is put back exactly where the
       small one sits, then let go. */
    if (!shell.style.transform) {
      // never flew (still on the splash, or reduced motion) — the splash simply
      // comes back over the doors, which is what covered the hop before
      if (revealed) { splash.classList.remove('gone', 'zoom'); }
      location.href = url; return;
    }
    wrap.classList.remove('landed');
    splash.classList.remove('gone');
    shell.style.transition = 'transform .42s cubic-bezier(.22,1,.36,1)';
    // the ground has to be solid again before the page changes under it, so it
    // comes back quicker than it went
    splash.style.transition = 'background-color .26s ease';
    requestAnimationFrame(function () {
      splash.classList.remove('zoom');   // the ground comes back under it
      shell.style.transform = '';        // and it returns to the centre, full size
    });
    setTimeout(function () { location.href = url; }, 330);
  };

  if (params.has('logout')) document.getElementById('sub').textContent = 'Signed out. Which one now?';
  done = reveal;

  /* A small courtesy, and only where it is honest: RMS and the portal are on
     this same origin, so a live session here is readable. Attendance is a
     different site and a different database — nothing is claimed about it. */
  function say(id, txt) {
    var el = document.getElementById(id); if (!el) return;
    el.querySelector('span').textContent = txt; el.hidden = false;
  }
  ls(function () { if (localStorage.getItem('rms.sales.token')) say('w-portal', 'Already signed in'); });
  ls(function () { if (sessionStorage.getItem('nxn_sess'))      say('w-rms',    'Already signed in'); });
})();
</script>
</body>
</html>
