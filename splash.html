<!DOCTYPE html>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 280px; height: 310px;

<style id="nx-price-panel-css">

</style>
</head>

<script>
const text = 'NEXUNOVA';
const el = document.getElementById('tw');

function runLoop() {
  el.textContent = '';
  let i = 0;
  function type() {
    if (i < text.length) {
      el.textContent += (i > 0 ? ' ' : '') + text[i];
      i++;
      setTimeout(type, 160);
    } else {
      setTimeout(runLoop, 800);
    }
  }
  setTimeout(type, 300);
}

runLoop();
</script>
