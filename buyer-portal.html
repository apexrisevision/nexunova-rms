<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mera Hisaab — Buyer Portal</title>
<link rel="icon" href="data:,">
<!-- Buyer Portal · Mera Hisaab · build 2026-06-14 (warmth kit, session-gated) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Design tokens: SINGLE SOURCE — shared with the admin app (no inline duplicate). -->
<link rel="stylesheet" href="css/foundation/tokens.css">
<!-- supabase-js 2.34.0 vendored locally — jsDelivr .min.js path 301-loops (see login.html). -->
<script src="js/vendor/supabase-js-2.34.0.umd.js?v=20260616"></script>
<style>
/* ════ Design tokens — SINGLE SOURCE: css/foundation/tokens.css (linked in <head>).
   The inline token duplicate was removed on 2026-06-20 (token unification).
   Only the buyer-portal-local dark tuning below is kept ON PURPOSE. ════ */
html[data-theme="dark"]{
  /* INTENTIONAL buyer-portal dark tuning — NOT a token duplicate.
     tokens.css dark keeps brand + shadow fixed; the portal needs a lifted indigo
     and visible card float on dark backgrounds. Do NOT delete this as "drift". */
  --fk-primary:#6366F1;
  --fk-primary-hover:#818CF8;
  --fk-primary-tint:rgba(99,102,241,.16);
  --fk-shadow:0 1px 3px rgba(0,0,0,.4);
  --fk-shadow-raised:0 8px 28px rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--fk-bg-page);color:var(--fk-text);font-family:var(--fk-font);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
a{color:var(--fk-primary);text-decoration:none}

/* ════ Screens ════ */
.screen{display:none}
.screen.active{display:block}

/* ════ Auth ════ */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-card{width:100%;max-width:400px;background:var(--fk-bg-card);border:1px solid var(--fk-border);
  border-radius:var(--fk-radius-card);padding:28px 24px;box-shadow:var(--fk-shadow-raised)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.brand-mark{width:36px;height:36px;border-radius:9px;background:var(--fk-primary-tint);
  display:flex;align-items:center;justify-content:center;color:var(--fk-primary)}
.brand-name{font-size:14px;font-weight:600;letter-spacing:-.2px}
.brand-sub{font-size:11px;color:var(--fk-text-muted);letter-spacing:.4px;text-transform:uppercase}
.auth-title{font-size:20px;font-weight:600;letter-spacing:-.3px;margin-bottom:4px}
.auth-sub{font-size:13px;color:var(--fk-text-muted);margin-bottom:20px}
.field{margin-bottom:14px}
.label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;
  color:var(--fk-text-muted);margin-bottom:6px}
.input{width:100%;height:40px;padding:0 13px;background:var(--fk-bg-subtle);border:1px solid var(--fk-border);
  border-radius:var(--fk-radius-control);color:var(--fk-text);font-size:14px;font-family:inherit;outline:none;
  transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--fk-primary);box-shadow:0 0 0 3px var(--fk-primary-tint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;
  border-radius:var(--fk-radius-control);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
  border:1px solid transparent;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn--primary{background:var(--fk-primary);color:#fff;width:100%}
.btn--primary:hover{background:var(--fk-primary-hover)}
.btn--primary:disabled{opacity:.55;cursor:not-allowed}
.btn--ghost{background:transparent;color:var(--fk-text-muted)}
.btn--ghost:hover{background:var(--fk-subtle-hover);color:var(--fk-text)}
.btn--sm{height:32px;padding:0 12px;font-size:13px}
.banner{border-radius:var(--fk-radius-control);padding:10px 13px;font-size:13px;margin-bottom:14px;display:none}
.banner.show{display:block}
.banner--danger{background:var(--fk-danger-surface);border:1px solid var(--fk-danger-edge);color:var(--fk-danger)}
.muted-note{font-size:12px;color:var(--fk-text-muted);text-align:center;margin-top:14px}

/* ════ App shell ════ */
.topbar{position:sticky;top:0;z-index:50;height:56px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:var(--fk-bg-card);border-bottom:1px solid var(--fk-border)}
.topbar .who{font-size:13px;color:var(--fk-text-muted);max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .who b{color:var(--fk-text);font-weight:600}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--fk-border);background:var(--fk-bg-subtle);
  color:var(--fk-text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:var(--fk-subtle-hover);color:var(--fk-text)}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 56px}

/* ════ Cards / sections ════ */
.card{background:var(--fk-bg-card);border:1px solid var(--fk-border);border-radius:var(--fk-radius-card);
  box-shadow:var(--fk-shadow);margin-bottom:14px;overflow:hidden}
.ichip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:var(--fk-primary-tint);color:var(--fk-primary)}
.ichip--success{background:var(--fk-success-surface);color:var(--fk-success)}
.ichip--warning{background:var(--fk-warning-surface);color:var(--fk-warning)}
.card-bd{padding:16px}

/* unit switcher */
.switcher{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.switcher::-webkit-scrollbar{display:none}
.switch-pill{flex-shrink:0;padding:8px 14px;border-radius:999px;border:1px solid var(--fk-border);
  background:var(--fk-bg-card);font-size:13px;font-weight:600;color:var(--fk-text-muted);cursor:pointer;white-space:nowrap}
.switch-pill.active{background:var(--fk-primary-tint);border-color:var(--fk-primary);color:var(--fk-primary)}

/* hero summary */
.hero-head{font-size:13px;color:var(--fk-text-muted)}
.hero-unit{font-size:22px;font-weight:700;letter-spacing:-.5px;margin:2px 0 1px}
.hero-proj{font-size:13px;color:var(--fk-text-muted);margin-bottom:16px}
.journey{height:14px;border-radius:999px;background:var(--fk-muted-fill);overflow:hidden;display:flex}
.journey .paid{height:100%;background:var(--fk-success);border-radius:999px 0 0 999px;transition:width .9s cubic-bezier(.16,1,.3,1)}
.journey-legend{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--fk-text-muted)}
.journey-legend .pc{font-weight:700;color:var(--fk-success)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.kpi{background:var(--fk-bg-subtle);border:1px solid var(--fk-border);border-radius:10px;padding:12px}
.kpi-l{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--fk-text-muted);margin-bottom:5px}
.kpi-v{font-size:16px;font-weight:700;letter-spacing:-.3px}
.kpi-v.green{color:var(--fk-success)} .kpi-v.red{color:var(--fk-danger)}
.due-strip{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:10px;
  background:var(--fk-warning-surface);border:1px solid var(--fk-warning-edge)}
.due-strip .t{font-size:12px;color:var(--fk-text-muted)} .due-strip .t b{color:var(--fk-text)}
.due-strip .amt{margin-left:auto;font-size:17px;font-weight:700;color:var(--fk-warning)}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--fk-bg-subtle);border:1px solid var(--fk-border);border-radius:10px;
  padding:4px;margin-bottom:14px}
.tab{flex:1;height:34px;border:none;background:transparent;border-radius:7px;font-size:13px;font-weight:600;
  color:var(--fk-text-muted);font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.tab.active{background:var(--fk-bg-card);color:var(--fk-primary);box-shadow:var(--fk-shadow)}
.tab-chip{font-size:11px;background:var(--fk-primary-tint);color:var(--fk-primary);border-radius:999px;padding:1px 7px}
.pane{display:none} .pane.active{display:block}

/* tables / lists */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;
  color:var(--fk-text-muted);padding:9px 12px;background:var(--fk-bg-subtle);border-bottom:1px solid var(--fk-border);white-space:nowrap}
.tbl td{padding:11px 12px;font-size:13px;border-bottom:1px solid var(--fk-border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl td.r,.tbl th.r{text-align:right}
.tbl-scroll{overflow-x:auto}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.badge--green{background:var(--fk-success-surface);border:1px solid var(--fk-success-edge);color:var(--fk-success)}
.badge--amber{background:var(--fk-warning-surface);border:1px solid var(--fk-warning-edge);color:var(--fk-warning)}
.badge--red{background:var(--fk-danger-surface);border:1px solid var(--fk-danger-edge);color:var(--fk-danger)}
.badge--muted{background:var(--fk-bg-subtle);border:1px solid var(--fk-border);color:var(--fk-text-muted)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
tr.od td{background:var(--fk-danger-surface)}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.info-grid .il{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--fk-text-muted);margin-bottom:3px}
.info-grid .iv{font-size:14px;font-weight:600}

.pay-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--fk-border)}
.pay-row:last-child{border-bottom:none}
.pay-ic{width:34px;height:34px;border-radius:9px;background:var(--fk-success-surface);color:var(--fk-success);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pay-main{flex:1;min-width:0}
.pay-rcpt{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pay-meta{font-size:11.5px;color:var(--fk-text-muted)}
.pay-amt{font-size:14px;font-weight:700;color:var(--fk-success);white-space:nowrap}

.empty{padding:34px 18px;text-align:center}
.empty .ei{width:46px;height:46px;border-radius:12px;background:var(--fk-bg-subtle);color:var(--fk-text-muted);
  display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.empty .et{font-size:13.5px;font-weight:600;margin-bottom:3px}
.empty .es{font-size:12px;color:var(--fk-text-muted)}

.loading{padding:40px;text-align:center;color:var(--fk-text-muted);font-size:13px}
.spin{width:28px;height:28px;border:3px solid var(--fk-border);border-top-color:var(--fk-primary);border-radius:50%;
  animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(min-width:560px){ .wrap{padding:22px 18px 60px} }
@media(max-width:420px){ .kpis{grid-template-columns:1fr} .info-grid{grid-template-columns:1fr} .hero-unit{font-size:20px} }
@media(prefers-reduced-motion:reduce){ .journey .paid{transition:none} .spin{animation:none} }
</style>
</head>
<body>

<!-- ════ LOGIN (fallback; magic link bypasses this) ════ -->
<div id="screen-login" class="screen active">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/><path d="M9 21v-6h6v6"/></svg>
        </div>
        <div><div class="brand-name">Mera Hisaab</div><div class="brand-sub">Buyer Portal</div></div>
      </div>
      <div class="auth-title">Sign in</div>
      <div class="auth-sub">Open the access link your developer shared, or sign in below.</div>
      <div class="banner banner--danger" id="login-err"></div>
      <div class="field"><label class="label">Company Code</label>
        <input class="input" id="i-co" placeholder="e.g. 14groupofcompanies" autocomplete="off" style="text-transform:uppercase"></div>
      <div class="field"><label class="label">Email</label>
        <input class="input" id="i-email" type="email" placeholder="you@example.com" autocomplete="email"></div>
      <div class="field"><label class="label">Password</label>
        <input class="input" id="i-pw" type="password" placeholder="Your password" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn btn--primary" id="login-btn" onclick="doLogin()">Sign in</button>
      <div class="muted-note">Forgot your password? Contact your developer to re-send your access link.</div>
    </div>
  </div>
</div>

<!-- ════ PORTAL ════ -->
<div id="screen-app" class="screen">
  <div class="topbar">
    <div class="brand" style="margin:0;gap:8px">
      <div class="brand-mark" style="width:30px;height:30px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/><path d="M9 21v-6h6v6"/></svg>
      </div>
      <div><div class="brand-name" style="font-size:13px">Mera Hisaab</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="who" id="who"></span>
      <button class="icon-btn" title="Theme" onclick="toggleTheme()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
      <button class="icon-btn" title="Logout" onclick="doLogout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </div>
  <div class="wrap" id="app-body"><div class="loading"><div class="spin"></div>Loading your account…</div></div>
</div>

<script>
// ════════ CONFIG ════════
const SUPABASE_URL='https://itqxljtfbrppntgyfush.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_OkIT2ttNgBiOm-E4HJLnFw_OmIz-8VG';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false}});
const TOK_KEY='rms.portal.token';

// ════════ HELPERS ════════
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pkr=n=>'PKR '+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
function fdate(d){ if(!d) return '—'; const x=new Date(d); if(isNaN(x)) return esc(d);
  return x.toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'}); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); }
function toggleTheme(){ const h=document.documentElement; const d=h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme',d?'light':'dark'); try{localStorage.setItem('rms.portal.theme',d?'light':'dark')}catch(e){} }
(function initTheme(){ let t; try{t=localStorage.getItem('rms.portal.theme')}catch(e){}
  if(!t) t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.setAttribute('data-theme',t); })();

// ════════ STATE ════════
let TOKEN=null, SALES=[], CUR=null, TAB='schedule';

// ════════ AUTH ════════
async function bootstrap(){
  const params=new URLSearchParams(location.search);
  const magic=params.get('t');
  if(magic){
    const {data,error}=await sb.rpc('portal_magic_login',{p_token:magic});
    history.replaceState(null,'',location.pathname); // strip token from URL
    if(!error && data && data.success){ TOKEN=data.session_token; sessionStorage.setItem(TOK_KEY,TOKEN); return openApp(); }
  }
  const saved=sessionStorage.getItem(TOK_KEY);
  if(saved){ TOKEN=saved; return openApp(); }
  showScreen('screen-login');
}
async function doLogin(){
  const co=$('i-co').value.trim(), em=$('i-email').value.trim(), pw=$('i-pw').value;
  const err=$('login-err'); err.classList.remove('show');
  if(!co||!em||!pw){ err.textContent='Enter company code, email and password.'; err.classList.add('show'); return; }
  const btn=$('login-btn'); btn.disabled=true; btn.textContent='Signing in…';
  try{
    const {data,error}=await sb.rpc('portal_login',{p_company_code:co,p_email:em,p_password:pw});
    if(error) throw error;
    if(!data||!data.success) throw new Error(data&&data.error?data.error:'Invalid login');
    TOKEN=data.session_token; sessionStorage.setItem(TOK_KEY,TOKEN); openApp();
  }catch(e){ err.textContent=e.message||'Sign in failed'; err.classList.add('show'); }
  finally{ btn.disabled=false; btn.textContent='Sign in'; }
}
function doLogout(){ sessionStorage.removeItem(TOK_KEY); TOKEN=null; location.href=location.pathname; }
function sessionGone(){ sessionStorage.removeItem(TOK_KEY); TOKEN=null; showScreen('screen-login');
  const err=$('login-err'); err.textContent='Your session expired. Please open your access link again or sign in.'; err.classList.add('show'); }

// ════════ APP ════════
async function openApp(){
  showScreen('screen-app');
  const {data,error}=await sb.rpc('get_portal_sales',{p_session_token:TOKEN});
  if(error||!data||!data.success){ return sessionGone(); }
  SALES=data.sales||[];
  $('who').innerHTML='<b>'+esc(data.client&&data.client.full_name||'')+'</b>';
  if(!SALES.length){
    $('app-body').innerHTML='<div class="card"><div class="empty"><div class="ei">'
      +'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg></div>'
      +'<div class="et">No active unit found</div><div class="es">Your booking is not active yet. Please contact your developer.</div></div></div>';
    return;
  }
  CUR=SALES[0].unit_id;
  await renderUnit();
}
function switchUnit(uid){ CUR=uid; TAB='schedule'; renderUnit(); }
function setTab(t){ TAB=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.dataset.pane===t)); }

async function renderUnit(){
  const body=$('app-body');
  body.innerHTML='<div class="loading"><div class="spin"></div>Loading…</div>';
  let summary={}, schedule=[], receipts=[];
  try{
    const [s,sc,r]=await Promise.all([
      sb.rpc('get_buyer_sale_summary',{p_session_token:TOKEN,p_unit_id:CUR}),
      sb.rpc('get_buyer_payment_schedule',{p_session_token:TOKEN,p_unit_id:CUR}),
      sb.rpc('get_buyer_receipts',{p_session_token:TOKEN,p_unit_id:CUR})
    ]);
    if(s.error||sc.error||r.error){ const e=(s.error||sc.error||r.error); if(/JWT|expired|session/i.test(e.message||'')) return sessionGone(); throw e; }
    summary=s.data||{}; schedule=sc.data||[]; receipts=r.data||[];
    if(!summary||!summary.unit_number){ return sessionGone(); } // session invalid → empty {}
  }catch(e){
    body.innerHTML='<div class="card"><div class="empty"><div class="et">Could not load your account</div><div class="es">'+esc(e.message||'Error')+'</div></div></div>';
    return;
  }
  const price=+summary.total_price||0, paid=+summary.total_paid||0, out=+summary.total_outstanding||0;
  const pct=price>0?Math.min(100,Math.round(paid/price*100)):0;

  // switcher (multi-unit)
  const switcher=SALES.length>1 ? '<div class="switcher">'+SALES.map(x=>
    '<button class="switch-pill'+(x.unit_id===CUR?' active':'')+'" onclick="switchUnit(\''+x.unit_id+'\')">Unit '+esc(x.unit_no||'—')+'</button>').join('')+'</div>' : '';

  // hero + summary
  const due = summary.next_due_date ? '<div class="due-strip"><div class="ichip ichip--warning">'
      +'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>'
      +'<div class="t">Next installment due<br><b>'+fdate(summary.next_due_date)+'</b></div>'
      +'<div class="amt num">'+pkr(summary.next_due_amount)+'</div></div>' : '';
  const hero='<div class="card"><div class="card-bd">'
    +'<div class="hero-head">Unit '+esc(summary.unit_number||'—')+'</div>'
    +'<div class="hero-unit">'+pkr(paid)+' <span style="font-size:14px;color:var(--fk-text-muted);font-weight:500">of '+pkr(price)+' paid</span></div>'
    +'<div class="hero-proj">'+esc(summary.project_name||'')+'</div>'
    +'<div class="journey"><div class="paid" style="width:'+pct+'%"></div></div>'
    +'<div class="journey-legend"><span class="pc">'+pct+'% paid</span><span>'+pkr(out)+' remaining</span></div>'
    +'<div class="kpis">'
      +'<div class="kpi"><div class="kpi-l">Contracted</div><div class="kpi-v num">'+pkr(price)+'</div></div>'
      +'<div class="kpi"><div class="kpi-l">Paid</div><div class="kpi-v green num">'+pkr(paid)+'</div></div>'
      +'<div class="kpi"><div class="kpi-l">Remaining</div><div class="kpi-v red num">'+pkr(out)+'</div></div>'
    +'</div>'+due+'</div></div>';

  // tabs
  const tabs='<div class="tabs">'
    +'<button class="tab active" data-tab="schedule" onclick="setTab(\'schedule\')">Schedule <span class="tab-chip">'+schedule.length+'</span></button>'
    +'<button class="tab" data-tab="payments" onclick="setTab(\'payments\')">Payments <span class="tab-chip">'+receipts.length+'</span></button>'
    +'<button class="tab" data-tab="unit" onclick="setTab(\'unit\')">Unit</button>'
    +'</div>';

  // schedule pane
  const schRows=schedule.map(i=>{
    const bal=+i.balance||0;
    const st = bal<=0 ? '<span class="badge badge--green"><span class="dot"></span>Paid</span>'
      : i.is_overdue ? '<span class="badge badge--red"><span class="dot"></span>Overdue</span>'
      : (+i.amount_paid>0 ? '<span class="badge badge--amber"><span class="dot"></span>Partial</span>'
      : '<span class="badge badge--muted"><span class="dot"></span>Upcoming</span>');
    return '<tr'+(i.is_overdue?' class="od"':'')+'><td class="num">'+esc(i.installment_number)+'</td>'
      +'<td>'+fdate(i.due_date)+'</td>'
      +'<td class="r num">'+pkr(i.amount_due)+'</td>'
      +'<td class="r num">'+pkr(i.amount_paid)+'</td>'
      +'<td class="r num">'+pkr(bal)+'</td>'
      +'<td class="r">'+st+'</td></tr>';
  }).join('');
  const schedulePane='<div class="pane active" data-pane="schedule"><div class="card" style="margin:0"><div class="tbl-scroll">'
    +(schedule.length?('<table class="tbl"><thead><tr><th>#</th><th>Due date</th><th class="r">Amount</th><th class="r">Paid</th><th class="r">Balance</th><th class="r">Status</th></tr></thead><tbody>'+schRows+'</tbody></table>')
      :'<div class="empty"><div class="et">No schedule yet</div><div class="es">Your installment plan will appear here.</div></div>')
    +'</div></div></div>';

  // payments pane — date + amount + mode only (no bank/cheque)
  const payRows=receipts.map(p=>'<div class="pay-row"><div class="pay-ic">'
      +'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>'
      +'<div class="pay-main"><div class="pay-rcpt">Receipt '+esc(p.receipt_number||'—')+'</div>'
      +'<div class="pay-meta">'+fdate(p.payment_date)+' · '+esc((p.payment_mode||'').replace(/_/g,' '))+'</div></div>'
      +'<div class="pay-amt num">'+pkr(p.amount)+'</div></div>').join('');
  const paymentsPane='<div class="pane" data-pane="payments"><div class="card" style="margin:0">'
    +(receipts.length?payRows:'<div class="empty"><div class="et">No payments recorded yet</div><div class="es">Your receipts will appear here as payments are received.</div></div>')
    +'</div></div>';

  // unit pane
  const unitPane='<div class="pane" data-pane="unit"><div class="card" style="margin:0"><div class="card-bd"><div class="info-grid">'
    +'<div><div class="il">Unit</div><div class="iv">'+esc(summary.unit_number||'—')+'</div></div>'
    +'<div><div class="il">Project</div><div class="iv">'+esc(summary.project_name||'—')+'</div></div>'
    +'<div><div class="il">Booking #</div><div class="iv">'+esc(summary.sale_number||'—')+'</div></div>'
    +'<div><div class="il">Booking date</div><div class="iv">'+fdate(summary.booking_date)+'</div></div>'
    +'<div><div class="il">Down payment</div><div class="iv num">'+pkr(summary.down_payment)+'</div></div>'
    +'<div><div class="il">Total installments</div><div class="iv num">'+esc(summary.installment_count||'—')+'</div></div>'
    +'<div><div class="il">Buyer</div><div class="iv">'+esc(summary.buyer_name||'—')+'</div></div>'
    +'<div><div class="il">CNIC</div><div class="iv num">'+esc(summary.buyer_cnic||'—')+'</div></div>'
    +'</div></div></div></div>';

  body.innerHTML=switcher+hero+tabs+schedulePane+paymentsPane+unitPane;
  setTab(TAB);
}

bootstrap();
</script>
</body>
</html>
