<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Payment Receipt — Nexunova RMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#edf0f4;color:#111827;-webkit-font-smoothing:antialiased;min-height:100vh}

/* ── Toolbar ── */
.toolbar{position:fixed;top:0;left:0;right:0;background:#1e2d47;color:#fff;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.toolbar-title{font-size:13px;font-weight:600;opacity:.8;display:flex;align-items:center;gap:8px}
.toolbar-actions{display:flex;gap:8px}
.btn-print{background:#c9a84c;color:#1e2d47;border:none;padding:8px 18px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;letter-spacing:.3px;transition:background .15s}
.btn-close,.btn-lang{background:rgba(255,255,255,.1);color:#fff;border:none;padding:8px 14px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn-print:hover{background:#d4b55e}
.btn-close:hover,.btn-lang:hover{background:rgba(255,255,255,.2)}
/* ── Urdu / RTL mode ── */
body.lang-ur [data-ur],body.lang-ur .ur-text{font-family:'Noto Nastaliq Urdu',serif;line-height:1.9;direction:rtl}
body.lang-ur .page{direction:rtl;text-align:right}

/* ── A4 page ── */
.page-wrap{padding:74px 20px 40px;display:flex;justify-content:center}
.page{width:210mm;background:#fff;box-shadow:0 4px 40px rgba(0,0,0,.14);border-radius:4px;overflow:hidden}

/* ── Letterhead ── */
.lh{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lh-left{display:flex;align-items:center;gap:14px}
.lh-logo{height:50px;max-width:140px;object-fit:contain;display:block}
.lh-initials{width:50px;height:50px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex-shrink:0}
.lh-company{display:flex;flex-direction:column;gap:2px}
.lh-name{font-size:18px;font-weight:700;letter-spacing:.3px;line-height:1.2}
.lh-sub{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;opacity:.7}
.lh-right{text-align:right}
.lh-doctype{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.lh-meta{font-size:9px;opacity:.65;line-height:1.8}
.gold-bar{height:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ── Body ── */
.body{padding:24px 26px 22px}

/* ── Voucher title ── */
.vtitle{text-align:center;font-size:17px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#111827;border:2px solid #111827;border-radius:6px;padding:7px 0;margin:0 auto 20px;max-width:280px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.vcancel{text-align:center;color:#dc2626;font-weight:800;letter-spacing:3px;text-transform:uppercase;font-size:13px;border:2px dashed #dc2626;border-radius:6px;padding:6px;margin-bottom:16px}

/* ── Voucher field grid (FMH receipt-voucher style: labelled boxes) ── */
.vgrid2{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:-1px}
.vgrid1{display:grid;grid-template-columns:1fr;margin-bottom:-1px}
.vcell{border:1px solid #cbd5e1;padding:7px 12px;min-height:46px;margin-right:-1px}
.vlabel{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#64748b;margin-bottom:3px}
.vval{font-size:13px;font-weight:600;color:#111827;word-break:break-word;line-height:1.35}
.vmono{font-family:monospace;letter-spacing:.5px}

/* ── Amount band ── */
.vamtgrid{display:grid;grid-template-columns:200px 1fr;gap:0;margin:14px 0 -1px}
.vamtcell{border:1.5px solid #111827;padding:8px 12px;margin-right:-1.5px;background:#f8fafc;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.vamt{font-size:24px;font-weight:800;color:#15803d;font-variant-numeric:tabular-nums;line-height:1.1}
.vwords{font-size:12.5px;font-weight:600;color:#166534;font-style:italic;line-height:1.4;padding-top:4px}

/* ── Optional compact account line ── */
.vacct{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px;font-size:10.5px;color:#475569}
.vacct b{color:#111827;font-weight:700}

/* ── Signatures ── */
.sig-section{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:42px}
.sig-box{padding-top:6px;border-top:1.5px solid #374151}
.sig-lbl{font-size:10px;font-weight:700;color:#111827}
.sig-role{font-size:9px;color:#9ca3af;margin-top:2px}

/* ── Footer ── */
.doc-footer{margin-top:20px;padding-top:10px;border-top:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;font-size:9px;color:#9ca3af}

/* ── Fixed print footer (repeats on every printed page) ── */
.print-footer{display:none}

/* ── States ── */
.loading-state{padding:60px;text-align:center;color:#6b7280;font-size:14px}
.error-state{margin:24px;padding:20px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;color:#dc2626;font-size:13px;text-align:center}

/* ── Print ── */
@media print{
  @page{size:A4;margin:10mm 12mm;@bottom-right{content:"Page " counter(page) " of " counter(pages)}}
  body{background:#fff;padding-bottom:22mm}
  .toolbar{display:none!important}
  .page-wrap{padding:0}
  .page{width:100%;box-shadow:none;border-radius:0}
  .lh,.gold-bar,.vtitle,.vamtcell{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-footer{display:block;position:fixed;bottom:0;left:0;right:0;font-size:8px;line-height:1.5;color:#6b7280;text-align:center;padding:4px 0;border-top:1px solid #e5e7eb;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-title">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    Payment Receipt — Nexunova RMS
  </div>
  <div class="toolbar-actions">
    <button class="btn-lang" onclick="toggleLang()" id="lang-btn">اردو</button>
    <button class="btn-print" onclick="window.print()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Print / Save PDF
    </button>
    <button class="btn-close" onclick="window.close()">✕ Close</button>
  </div>
</div>

<div class="page-wrap">
  <div class="page" id="page">
    <div class="loading-state">Loading receipt…</div>
  </div>
</div>

<script>
const SUPA_URL = 'https://itqxljtfbrppntgyfush.supabase.co';
const SUPA_KEY = 'sb_publishable_OkIT2ttNgBiOm-E4HJLnFw_OmIz-8VG';
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

const P = new URLSearchParams(location.search);
const paymentId = P.get('id');
const cid       = P.get('cid');

const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = n  => Number(n||0).toLocaleString('en-IN');
const fmtD = d => { if(!d) return '—'; try{ return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){return d;} };

function amtWords(n){
  n=Math.round(Number(n)||0); if(!n) return 'Zero Rupees Only';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const w=n=>{if(n<20)return a[n];if(n<100)return b[Math.floor(n/10)]+(n%10?' '+a[n%10]:'');return a[Math.floor(n/100)]+' Hundred'+(n%100?' and '+w(n%100):'');};
  let s='';
  if(n>=10000000){s+=w(Math.floor(n/10000000))+' Crore ';n%=10000000;}
  if(n>=100000){s+=w(Math.floor(n/100000))+' Lakh ';n%=100000;}
  if(n>=1000){s+=w(Math.floor(n/1000))+' Thousand ';n%=1000;}
  if(n>0) s+=w(n);
  return s.trim()+' Rupees Only';
}

async function loadReport(){
  const page = document.getElementById('page');

  if(!paymentId || !cid){
    page.innerHTML = '<div class="error-state">Missing parameters. Please open this report from the RMS application.</div>';
    return;
  }

  try {
    const [pRes, brRes] = await Promise.all([
      sb.rpc('get_payment_full',     { p_id: paymentId,  p_company_id: cid }),
      sb.rpc('get_company_branding', { p_company_id: cid })
    ]);

    if(pRes.error) throw pRes.error;
    const p  = pRes.data;
    if(!p) throw new Error('Payment record not found.');

    const br      = brRes.data || {};
    const primary = br.doc_brand_color || '#1E2D47';
    const accent  = br.accent_color    || '#C9A84C';
    const coName  = br.company_name    || 'Company';

    // Sale + installment data
    let s = {}, installments = [];
    if(p.sale_id){
      const sRes = await sb.rpc('get_sale_detail', { p_sale_id: p.sale_id, p_company_id: cid });
      if(!sRes.error && sRes.data?.success){
        s            = sRes.data.sale        || {};
        installments = sRes.data.installments|| [];
      }
    }

    const totalPaid   = installments.reduce((sum,i) => sum + Number(i.amount_paid||0), 0);
    const netAmt      = Number(s.net_amount || s.total_amount || 0);
    const outstanding = Math.max(0, netAmt - totalPaid);
    const pct         = netAmt > 0 ? Math.min(100, Math.round(totalPaid / netAmt * 100)) : 0;
    const amt         = Number(p.amount || 0);
    // Owner-chosen official Receipt # = system voucher code (PRV-25xx-#####)
    const rcptNo      = p.voucher_code || p.payment_code || ('RCP-' + paymentId.slice(-8).toUpperCase());
    const cancelled   = p.status === 'cancelled';

    const methodMap   = {cash:'Cash',cheque:'Cheque',pdc:'Pay Order / PDC',bank_transfer:'Bank Transfer',online:'Online / Mobile',adjustment:'Adjustment',other:'Other'};
    const methodLabel = methodMap[p.payment_method] || p.payment_method || '—';
    // "By Cash / Pay Order / Cheque No" value
    let byLine = methodLabel;
    if (p.reference_no) byLine += ' — ' + p.reference_no;
    if (p.bank_name)    byLine += ' (' + p.bank_name + ')';
    if (p.cheque_date)  byLine += ' · ' + fmtD(p.cheque_date);
    // "Amount of" — what this payment is for
    const catMap   = {regular:'Installment', booking:'Booking', down_payment:'Down Payment', token:'Token', advance:'Advance', adjustment:'Adjustment'};
    const amountOf = catMap[p.payment_category] || (p.payment_category ? p.payment_category : 'Installment');
    const unitAddr = [s.unit_no, s.project_name].filter(Boolean).join(' · ') || '—';

    const logoHtml = br.logo_url
      ? `<img class="lh-logo" src="${esc(br.logo_url)}" alt="${esc(coName)}">`
      : `<div class="lh-initials">${esc(coName.charAt(0).toUpperCase())}</div>`;

    const html = `
    <div class="lh" style="background:${primary}">
      <div class="lh-left">
        ${logoHtml}
        <div class="lh-company">
          <div class="lh-name">${esc(coName)}</div>
          <div class="lh-sub">${esc(br.letterhead_subtitle||'Recovery Management System')}</div>
        </div>
      </div>
      <div class="lh-right">
        <div class="lh-doctype">Payment Receipt</div>
        <div style="font-size:11px;font-weight:700;color:#fff;letter-spacing:.3px;margin-bottom:5px;opacity:.92">${esc(s.project_name || s.unit_no || s.sale_number || rcptNo)}</div>
        <div class="lh-meta">
          ${fmtD(p.payment_date)}<br>
          ${br.address_full ? esc(br.address_full)+'<br>' : ''}
          ${br.business_phone ? esc(br.business_phone)+'<br>' : ''}
          ${br.business_email ? esc(br.business_email) : ''}
        </div>
      </div>
    </div>
    <div class="gold-bar" style="background:linear-gradient(90deg,${accent},#f0e09a,${accent})"></div>

    <div class="body">

      <div class="vtitle">Receipt Voucher</div>
      ${cancelled ? '<div class="vcancel">Cancelled</div>' : ''}

      <div class="vgrid2">
        <div class="vcell"><div class="vlabel">Receipt #</div><div class="vval vmono">${esc(rcptNo)}</div></div>
        <div class="vcell"><div class="vlabel">Date</div><div class="vval">${fmtD(p.payment_date)}</div></div>
      </div>
      <div class="vgrid2">
        <div class="vcell"><div class="vlabel">Booking No.</div><div class="vval">${esc(s.sale_number||'—')}</div></div>
        <div class="vcell"><div class="vlabel">Name</div><div class="vval">${esc(s.client_name||'—')}</div></div>
      </div>
      <div class="vgrid2">
        <div class="vcell"><div class="vlabel">By Cash / Pay Order / Cheque No.</div><div class="vval">${esc(byLine)}</div></div>
        <div class="vcell"><div class="vlabel">Amount of</div><div class="vval">${esc(amountOf)}</div></div>
      </div>

      <div class="vamtgrid">
        <div class="vamtcell"><div class="vlabel">Rs.</div><div class="vamt">${fmt(amt)}/-</div></div>
        <div class="vamtcell"><div class="vlabel">Rs. In Words</div><div class="vwords">${amtWords(amt)}</div></div>
      </div>

      <div class="vgrid2">
        <div class="vcell"><div class="vlabel">Remarks</div><div class="vval">${esc(p.notes||'—')}</div></div>
        <div class="vcell"><div class="vlabel">Unit Address</div><div class="vval">${esc(unitAddr)}</div></div>
      </div>

      ${netAmt > 0 ? `
      <div class="vacct">
        <span>Total: <b>PKR ${fmt(netAmt)}</b></span>
        <span>Paid to date: <b style="color:#16a34a">PKR ${fmt(totalPaid)}</b></span>
        <span>Outstanding: <b style="color:${outstanding>0?'#dc2626':'#16a34a'}">PKR ${fmt(outstanding)}</b></span>
      </div>` : ''}

      <div class="sig-section">
        <div class="sig-box">
          <div class="sig-lbl">User${p.created_by ? ' — ' + esc(p.created_by) : ''}</div>
          <div class="sig-role">Received / Recorded by</div>
        </div>
        <div class="sig-box">
          <div class="sig-lbl">${esc(br.signature_name||'Accountant')}</div>
          <div class="sig-role">${esc(br.signature_title||'Accountant')} — Signature &amp; Stamp</div>
        </div>
      </div>

      <div class="doc-footer">
        <span>
          ${[br.address_full, br.business_phone, br.ntn_number ? 'NTN: '+br.ntn_number : '', br.footer_text].filter(Boolean).map(esc).join(' · ') || 'Computer-generated receipt. Nexunova RMS.'}
        </span>
        <span>Printed: ${new Date().toLocaleString('en-IN')}</span>
      </div>
    </div>
    <div class="print-footer">
      ${[br.address_full, br.business_phone, br.ntn_number ? 'NTN: '+br.ntn_number : '', br.footer_text].filter(Boolean).map(esc).join(' · ') || esc(coName)}
    </div>`;

    page.innerHTML = html;
    document.title = 'Receipt ' + rcptNo + ' — ' + coName;

  } catch(e){
    document.getElementById('page').innerHTML = `<div class="error-state">Could not load receipt: ${esc(e.message)}</div>`;
    console.error(e);
  }
}

loadReport();

// ── Urdu / RTL language toggle ─────────────────────────────────────
function applyLang(lang){
  if(lang==='ur'){
    document.querySelectorAll('[data-ur]').forEach(el=>{
      if(!el.dataset.en) el.dataset.en=el.textContent;
      el.textContent=el.dataset.ur;
    });
    document.documentElement.setAttribute('lang','ur');
    document.body.classList.add('lang-ur');
  } else {
    document.querySelectorAll('[data-en]').forEach(el=>{ el.textContent=el.dataset.en; });
    document.documentElement.setAttribute('lang','en');
    document.body.classList.remove('lang-ur');
  }
  const btn=document.getElementById('lang-btn');
  if(btn) btn.textContent=lang==='ur'?'English':'اردو';
  document.documentElement.dataset.lang=lang;
}
function toggleLang(){
  const cur=document.documentElement.dataset.lang==='ur'?'en':'ur';
  applyLang(cur);
}
if(new URLSearchParams(location.search).get('lang')==='ur') applyLang('ur');
</script>
</body>
</html>
