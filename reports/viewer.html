<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Report Viewer — Nexunova RMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#edf0f4;color:#111827;-webkit-font-smoothing:antialiased;min-height:100vh}

/* ── Toolbar ── */
.toolbar{position:fixed;top:0;left:0;right:0;background:#1e2d47;color:#fff;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.toolbar-left{display:flex;align-items:center;gap:12px}
.toolbar-title{font-size:13px;font-weight:600;opacity:.85}
.toolbar-subtitle{font-size:11px;opacity:.5;font-weight:400}
.toolbar-actions{display:flex;gap:8px}
.btn-print{background:#c9a84c;color:#1e2d47;border:none;padding:8px 18px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;letter-spacing:.3px;transition:background .15s}
.btn-close{background:rgba(255,255,255,.1);color:#fff;border:none;padding:8px 14px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn-print:hover{background:#d4b55e}
.btn-close:hover{background:rgba(255,255,255,.2)}

/* ── A4 page ── */
.page-wrap{padding:74px 20px 40px;display:flex;flex-direction:column;align-items:center;gap:0}
.page{width:210mm;background:#fff;box-shadow:0 4px 40px rgba(0,0,0,.14);border-radius:4px;overflow:hidden;page-break-after:always}

/* ── Letterhead ── */
.lh{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lh-left{display:flex;align-items:center;gap:14px}
.lh-logo{height:48px;max-width:130px;object-fit:contain}
.lh-initials{width:48px;height:48px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0}
.lh-company{display:flex;flex-direction:column;gap:2px}
.lh-name{font-size:17px;font-weight:700;letter-spacing:.3px;line-height:1.2}
.lh-sub{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;opacity:.7}
.lh-right{text-align:right}
.lh-doctype{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.lh-meta{font-size:9px;opacity:.65;line-height:1.8}
.gold-bar{height:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ── Body ── */
.body{padding:22px 24px 20px}

/* ── Report title strip ── */
.report-title-strip{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid #f3f4f6}
.rts-left{}
.rts-heading{font-size:16px;font-weight:800;color:#111827;letter-spacing:-.3px}
.rts-period{font-size:11px;color:#6b7280;margin-top:3px;font-weight:500}
.rts-stamp{background:#f3f4f6;border-radius:6px;padding:6px 12px;text-align:right}
.rts-stamp-label{font-size:8px;color:#9ca3af;text-transform:uppercase;letter-spacing:.8px}
.rts-stamp-val{font-size:11px;font-weight:700;color:#374151;margin-top:1px}

/* ── KPI cards ── */
.kpi-row{display:grid;gap:10px;margin-bottom:18px}
.kpi-row.cols-2{grid-template-columns:repeat(2,1fr)}
.kpi-row.cols-3{grid-template-columns:repeat(3,1fr)}
.kpi-row.cols-4{grid-template-columns:repeat(4,1fr)}
.kpi{background:#f9fafb;border:1px solid #f0f1f3;border-radius:8px;padding:12px 14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.kpi-label{font-size:8.5px;color:#9ca3af;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;font-weight:600}
.kpi-val{font-size:18px;font-weight:800;color:#111827;line-height:1}
.kpi-sub{font-size:9px;color:#6b7280;margin-top:4px}
.kpi.accent{background:linear-gradient(135deg,#1e2d47,#2a3f63);color:#fff}
.kpi.accent .kpi-label{color:rgba(255,255,255,.6)}
.kpi.accent .kpi-val{color:#fff}
.kpi.accent .kpi-sub{color:rgba(255,255,255,.6)}
.kpi.green{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-color:#86efac}
.kpi.green .kpi-val{color:#16a34a}
.kpi.amber{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fcd34d}
.kpi.amber .kpi-val{color:#d97706}
.kpi.red{background:linear-gradient(135deg,#fff1f2,#ffe4e6);border-color:#fca5a5}
.kpi.red .kpi-val{color:#dc2626}

/* ── Data table ── */
.tbl-wrap{overflow:hidden;border-radius:8px;border:1px solid #f0f1f3;margin-bottom:16px}
.rpt-tbl{width:100%;border-collapse:collapse;font-size:10.5px}
.rpt-tbl thead th{background:#1e2d47;color:#fff;padding:9px 11px;text-align:left;font-weight:600;font-size:9px;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rpt-tbl thead th.right{text-align:right}
.rpt-tbl tbody tr:nth-child(even){background:#f9fafb;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rpt-tbl tbody tr:hover{background:#f0f4ff}
.rpt-tbl td{padding:8px 11px;border-bottom:1px solid #f0f1f3;color:#374151;line-height:1.3}
.rpt-tbl td.right{text-align:right;font-variant-numeric:tabular-nums}
.rpt-tbl td.mono{font-family:monospace;font-size:10px}
.rpt-tbl td.bold{font-weight:700;color:#111827}
.rpt-tbl .totals-row td{background:#1e2d47;color:#fff;font-weight:700;font-size:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rpt-tbl .totals-row td.right{text-align:right}

/* ── Badges ── */
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:8.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.badge-green{background:#dcfce7;color:#16a34a}
.badge-red{background:#fee2e2;color:#dc2626}
.badge-amber{background:#fef3c7;color:#d97706}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.badge-gray{background:#f3f4f6;color:#6b7280}
.badge-purple{background:#ede9fe;color:#7c3aed}

/* ── Footer ── */
.doc-footer{display:flex;justify-content:space-between;align-items:flex-end;padding-top:14px;border-top:1px solid #f0f1f3;margin-top:10px}
.footer-note{font-size:8.5px;color:#9ca3af;line-height:1.6;max-width:320px}
.footer-brand{text-align:right;font-size:8px;color:#d1d5db;font-weight:600;text-transform:uppercase;letter-spacing:.8px}

/* ── Loading / Error ── */
.state-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 40px;text-align:center;gap:12px}
.state-box svg{opacity:.3}
.state-title{font-size:15px;font-weight:700;color:#374151}
.state-sub{font-size:12px;color:#9ca3af}
.spinner{width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:#1e2d47;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── No data ── */
.empty-row td{text-align:center;padding:32px;color:#9ca3af;font-style:italic;font-size:11px}

/* ── Print ── */
@media print{
  .toolbar{display:none!important}
  .page-wrap{padding:0!important}
  .page{box-shadow:none!important;border-radius:0!important}
  @page{size:A4;margin:12mm 14mm}
  body{background:#fff!important}
}
</style>
</head>
<body>

<div class="toolbar" id="toolbar">
  <div class="toolbar-left">
    <div class="toolbar-title" id="toolbarTitle">Loading report…</div>
    <div class="toolbar-subtitle" id="toolbarSub"></div>
  </div>
  <div class="toolbar-actions">
    <button class="btn-print" onclick="window.print()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Print / PDF
    </button>
    <button class="btn-close" onclick="window.close()">Close</button>
  </div>
</div>

<div class="page-wrap" id="pageWrap">
  <div class="state-box" id="loadingState">
    <div class="spinner"></div>
    <div class="state-title">Loading report…</div>
    <div class="state-sub" id="loadingMsg">Fetching data from database</div>
  </div>
</div>

<script>
const SUPA_URL = 'https://itqxljtfbrppntgyfush.supabase.co';
const SUPA_KEY = 'sb_publishable_OkIT2ttNgBiOm-E4HJLnFw_OmIz-8VG';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

const REPORT_META = {
  get_collection_report: {
    title: 'Collection Report',
    icon: '💰',
    cols: [
      {key:'payment_date',label:'Date',fmt:'date'},
      {key:'receipt_no',label:'Receipt #',cls:'mono'},
      {key:'client_name',label:'Client',cls:'bold'},
      {key:'unit_ref',label:'Unit'},
      {key:'project_name',label:'Project'},
      {key:'payment_mode',label:'Mode',fmt:'mode'},
      {key:'amount',label:'Amount (PKR)',cls:'right',fmt:'pkr'},
      {key:'received_by',label:'Received By'},
    ],
    totals: [{key:'amount',label:'Total Collected'}],
    kpis: (rows) => {
      const total = rows.reduce((s,r)=>s+Number(r.amount||0),0);
      const byMode = {};
      rows.forEach(r=>{ byMode[r.payment_mode]=(byMode[r.payment_mode]||0)+Number(r.amount||0); });
      const topMode = Object.entries(byMode).sort((a,b)=>b[1]-a[1])[0];
      return [
        {label:'Total Collected',val:fmtPKR(total),cls:'accent',sub:rows.length+' transactions'},
        {label:'Cash',val:fmtPKR(byMode['cash']||byMode['Cash']||0),cls:'green'},
        {label:'Cheque / Transfer',val:fmtPKR((byMode['cheque']||byMode['Cheque']||0)+(byMode['bank_transfer']||byMode['Bank Transfer']||0)),cls:''},
        {label:'Top Mode',val:topMode?topMode[0]:'—',cls:'',sub:topMode?fmtPKR(topMode[1]):''},
      ];
    },
    kpiCols: 4
  },
  get_sales_register: {
    title: 'Sales Register',
    icon: '📋',
    cols: [
      {key:'booking_date',label:'Date',fmt:'date'},
      {key:'client_name',label:'Client',cls:'bold'},
      {key:'unit_ref',label:'Unit'},
      {key:'project_name',label:'Project'},
      {key:'unit_type',label:'Type'},
      {key:'total_price',label:'Total Price',cls:'right',fmt:'pkr'},
      {key:'total_paid',label:'Paid',cls:'right',fmt:'pkr'},
      {key:'balance_due',label:'Balance',cls:'right',fmt:'pkr'},
      {key:'sale_status',label:'Status',fmt:'sale_status'},
    ],
    totals: [{key:'total_price',label:'Total Value'},{key:'total_paid',label:'Total Collected'},{key:'balance_due',label:'Outstanding'}],
    kpis: (rows) => {
      const totalVal = rows.reduce((s,r)=>s+Number(r.total_price||0),0);
      const totalPaid = rows.reduce((s,r)=>s+Number(r.total_paid||0),0);
      const totalDue = rows.reduce((s,r)=>s+Number(r.balance_due||0),0);
      return [
        {label:'Sales Count',val:rows.length,cls:'accent',sub:fmtPKR(totalVal)+' total value'},
        {label:'Total Collected',val:fmtPKR(totalPaid),cls:'green'},
        {label:'Outstanding',val:fmtPKR(totalDue),cls:'amber'},
        {label:'Collection %',val:totalVal?Math.round(totalPaid/totalVal*100)+'%':'—',cls:''},
      ];
    },
    kpiCols: 4
  },
  get_outstanding_report: {
    title: 'Outstanding Dues Report',
    icon: '⚠️',
    cols: [
      {key:'client_name',label:'Client',cls:'bold'},
      {key:'client_phone',label:'Phone',cls:'mono'},
      {key:'unit_ref',label:'Unit'},
      {key:'project_name',label:'Project'},
      {key:'due_date',label:'Due Date',fmt:'date'},
      {key:'installment_no',label:'Inst #',cls:'right'},
      {key:'due_amount',label:'Due Amount',cls:'right',fmt:'pkr'},
      {key:'days_overdue',label:'Days Overdue',fmt:'days_overdue'},
    ],
    totals: [{key:'due_amount',label:'Total Outstanding'}],
    kpis: (rows) => {
      const total = rows.reduce((s,r)=>s+Number(r.due_amount||0),0);
      const critical = rows.filter(r=>Number(r.days_overdue)>90);
      const avgDays = rows.length ? Math.round(rows.reduce((s,r)=>s+Number(r.days_overdue),0)/rows.length) : 0;
      return [
        {label:'Total Outstanding',val:fmtPKR(total),cls:'red',sub:rows.length+' installments'},
        {label:'Clients Affected',val:new Set(rows.map(r=>r.client_name)).size,cls:'amber'},
        {label:'Critical (90+ days)',val:critical.length,cls:'red',sub:fmtPKR(critical.reduce((s,r)=>s+Number(r.due_amount||0),0))},
        {label:'Avg Days Overdue',val:avgDays,cls:''},
      ];
    },
    kpiCols: 4
  },
  get_unit_inventory: {
    title: 'Unit Inventory',
    icon: '🏢',
    cols: [
      {key:'unit_number',label:'Unit #',cls:'bold mono'},
      {key:'floor_no',label:'Floor'},
      {key:'unit_type',label:'Type'},
      {key:'area_sqft',label:'Area (sqft)',cls:'right'},
      {key:'price',label:'Listed Price',cls:'right',fmt:'pkr'},
      {key:'status',label:'Status',fmt:'unit_status'},
      {key:'project_name',label:'Project'},
      {key:'client_name',label:'Client'},
      {key:'booking_date',label:'Booking Date',fmt:'date'},
    ],
    totals: [],
    kpis: (rows) => {
      const avail = rows.filter(r=>r.status==='available'||r.status==='Available');
      const sold = rows.filter(r=>r.status==='sold'||r.status==='Sold');
      const hold = rows.filter(r=>r.status==='on_hold'||r.status==='hold'||r.status==='Hold');
      const totalVal = sold.reduce((s,r)=>s+Number(r.price||0),0);
      return [
        {label:'Total Units',val:rows.length,cls:'accent'},
        {label:'Available',val:avail.length,cls:'green',sub:'Ready to sell'},
        {label:'Sold / Booked',val:sold.length,cls:'amber',sub:fmtPKR(totalVal)},
        {label:'On Hold',val:hold.length,cls:''},
      ];
    },
    kpiCols: 4
  }
};

function fmtPKR(v){ if(!v && v!==0) return '—'; return 'PKR '+Number(v).toLocaleString('en-PK',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function fmtDate(v){ if(!v) return '—'; try{ const d=new Date(v); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }catch{return v;} }

function formatCell(row, col){
  const v = row[col.key];
  if(col.fmt === 'date') return fmtDate(v);
  if(col.fmt === 'pkr') return fmtPKR(v);
  if(col.fmt === 'mode'){
    const map={cash:'Cash',cheque:'Cheque',bank_transfer:'Bank Transfer',online:'Online',other:'Other'};
    return map[v]||v||'—';
  }
  if(col.fmt === 'sale_status'){
    const map={active:'Active',completed:'Completed',cancelled:'Cancelled',transferred:'Transferred',resale:'Resale',possession:'Possession'};
    const badgeMap={active:'badge-blue',completed:'badge-green',cancelled:'badge-red',transferred:'badge-purple',resale:'badge-amber',possession:'badge-green'};
    const lv=(v||'').toLowerCase();
    return `<span class="badge ${badgeMap[lv]||'badge-gray'}">${map[lv]||v||'—'}</span>`;
  }
  if(col.fmt === 'unit_status'){
    const lv=(v||'').toLowerCase();
    const map={available:'Available',sold:'Sold',on_hold:'On Hold',hold:'On Hold',reserved:'Reserved',cancelled:'Cancelled'};
    const badgeMap={available:'badge-green',sold:'badge-blue',on_hold:'badge-amber',hold:'badge-amber',reserved:'badge-purple',cancelled:'badge-red'};
    return `<span class="badge ${badgeMap[lv]||'badge-gray'}">${map[lv]||v||'—'}</span>`;
  }
  if(col.fmt === 'days_overdue'){
    const n = Number(v||0);
    const cls = n>90?'badge-red':n>30?'badge-amber':'badge-gray';
    return `<span class="badge ${cls}">${n} days</span>`;
  }
  if(v===null||v===undefined||v==='') return '—';
  return v;
}

async function loadReport(){
  const params = new URLSearchParams(location.search);
  const type   = params.get('type');
  const cid    = params.get('cid');
  const from   = params.get('from');
  const to     = params.get('to');
  const pid    = params.get('project_id')||null;
  const status = params.get('status')||null;

  if(!type || !cid){
    showError('Missing report type or company ID.', 'Check the URL parameters and try again.');
    return;
  }

  const meta = REPORT_META[type];
  if(!meta){ showError('Unknown report type: '+type, 'Supported: get_collection_report, get_sales_register, get_outstanding_report, get_unit_inventory'); return; }

  document.getElementById('loadingMsg').textContent = 'Fetching '+meta.title+'…';

  // Fetch branding
  const { data: brand } = await sb.rpc('get_company_branding', { p_company_id: cid });
  // get_company_branding returns a single JSON OBJECT (not an array) — read it directly.
  const b = brand || {};
  const color1 = b.doc_brand_color || '#1e2d47';
  const color2 = b.accent_color || '#c9a84c';

  // Fetch report data
  let rpcParams = { p_company_id: cid };
  if(from) rpcParams.p_from_date = from;
  if(to)   rpcParams.p_to_date   = to;
  if(pid)  rpcParams.p_project_id = pid;
  if(status) rpcParams.p_status   = status;

  const { data: rows, error } = await sb.rpc(type, rpcParams);
  if(error){ showError('Database error', error.message); return; }

  const data = rows || [];

  // Update toolbar
  document.getElementById('toolbarTitle').textContent = meta.icon + ' ' + meta.title;
  const periodStr = from&&to ? from+' – '+to : (from?'From '+from:(to?'Until '+to:'All dates'));
  document.getElementById('toolbarSub').textContent = (b.company_name||'') + (from||to?' · '+periodStr:'');

  // KPI summary
  const kpis = meta.kpis(data);
  const kpiHtml = kpis.map(k=>`
    <div class="kpi ${k.cls||''}">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-val">${k.val}</div>
      ${k.sub?`<div class="kpi-sub">${k.sub}</div>`:''}
    </div>`).join('');

  // Table rows
  const tbodyRows = data.length===0
    ? `<tr class="empty-row"><td colspan="${meta.cols.length}">No records found for the selected filters.</td></tr>`
    : data.map(row=>`<tr>${meta.cols.map(col=>`<td class="${col.cls||''}">${formatCell(row,col)}</td>`).join('')}</tr>`).join('');

  // Totals row
  let totalsHtml = '';
  if(meta.totals && meta.totals.length){
    const cells = meta.cols.map(col=>{
      const t = meta.totals.find(tt=>tt.key===col.key);
      if(t){
        const sum = data.reduce((s,r)=>s+Number(r[col.key]||0),0);
        return `<td class="right">${fmtPKR(sum)}</td>`;
      }
      const isFirst = col===meta.cols[0];
      return `<td class="${col.cls||''}">${isFirst?'<strong>TOTALS</strong>':''}</td>`;
    }).join('');
    totalsHtml = `<tr class="totals-row">${cells}</tr>`;
  }

  // Period display
  const periodDisplay = from&&to
    ? `${fmtDate(from)} — ${fmtDate(to)}`
    : from ? `From ${fmtDate(from)}` : to ? `Until ${fmtDate(to)}` : 'All Dates';

  const pageHtml = `
  <div class="page">
    <div class="lh" style="background:linear-gradient(135deg,${color1},${color2}aa)">
      <div class="lh-left">
        ${b.logo_url
          ? `<img src="${b.logo_url}" alt="logo" class="lh-logo">`
          : `<div class="lh-initials">${(b.company_name||'RMS').substring(0,2).toUpperCase()}</div>`}
        <div class="lh-company">
          <div class="lh-name">${b.company_name||'Real Estate Company'}</div>
          <div class="lh-sub">${b.letterhead_subtitle||'Real Estate Management'}</div>
        </div>
      </div>
      <div class="lh-right">
        <div class="lh-doctype">${meta.title}</div>
        <div class="lh-meta">
          Generated: ${fmtDate(new Date().toISOString().slice(0,10))}<br>
          ${b.address_full||b.address||''}
        </div>
      </div>
    </div>
    <div class="gold-bar" style="background:${color2};-webkit-print-color-adjust:exact;print-color-adjust:exact"></div>

    <div class="body">
      <div class="report-title-strip">
        <div class="rts-left">
          <div class="rts-heading">${meta.title}</div>
          <div class="rts-period">${from||to ? 'Period: '+periodDisplay : 'Complete Record'}</div>
        </div>
        <div class="rts-stamp">
          <div class="rts-stamp-label">Total Records</div>
          <div class="rts-stamp-val">${data.length}</div>
        </div>
      </div>

      <div class="kpi-row cols-${meta.kpiCols}">
        ${kpiHtml}
      </div>

      <div class="tbl-wrap">
        <table class="rpt-tbl">
          <thead>
            <tr>${meta.cols.map(col=>`<th class="${col.cls&&col.cls.includes('right')?'right':''}">${col.label}</th>`).join('')}</tr>
          </thead>
          <tbody>
            ${tbodyRows}
            ${totalsHtml}
          </tbody>
        </table>
      </div>

      <div class="doc-footer">
        <div class="footer-note">
          This report was generated automatically by Nexunova RMS.<br>
          ${b.footer_text||'For queries, contact the accounts department.'}
        </div>
        <div class="footer-brand">Nexunova RMS · Powered by Nexunova</div>
      </div>
    </div>
  </div>`;

  document.getElementById('pageWrap').innerHTML = pageHtml;
}

function showError(title, msg){
  document.getElementById('pageWrap').innerHTML = `
    <div class="state-box">
      <svg width="48" height="48" fill="none" stroke="#374151" stroke-width="1.5" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r=".5" fill="#374151"/>
      </svg>
      <div class="state-title">${title}</div>
      <div class="state-sub">${msg||''}</div>
    </div>`;
}

loadReport();
</script>
</body>
</html>
