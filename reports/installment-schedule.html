<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Installment Schedule — Nexunova RMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#edf0f4;color:#111827;-webkit-font-smoothing:antialiased;min-height:100vh}

/* ── Toolbar ── */
.toolbar{position:fixed;top:0;left:0;right:0;background:#1e2d47;color:#fff;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.toolbar-title{font-size:13px;font-weight:600;opacity:.8;display:flex;align-items:center;gap:8px}
.toolbar-actions{display:flex;gap:8px}
.btn-print{background:#c9a84c;color:#1e2d47;border:none;padding:8px 18px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;letter-spacing:.3px;transition:background .15s}
.btn-close{background:rgba(255,255,255,.1);color:#fff;border:none;padding:8px 14px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn-print:hover{background:#d4b55e}
.btn-close:hover{background:rgba(255,255,255,.2)}

/* ── A4 page ── */
.page-wrap{padding:74px 20px 40px;display:flex;justify-content:center}
.page{width:210mm;background:#fff;box-shadow:0 4px 40px rgba(0,0,0,.14);border-radius:4px;overflow:hidden}

/* ── Letterhead ── */
.lh{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lh-left{display:flex;align-items:center;gap:14px}
.lh-logo{height:50px;max-width:140px;object-fit:contain}
.lh-initials{width:50px;height:50px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex-shrink:0}
.lh-company{display:flex;flex-direction:column;gap:2px}
.lh-name{font-size:18px;font-weight:700;letter-spacing:.3px;line-height:1.2}
.lh-sub{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;opacity:.7}
.lh-right{text-align:right}
.lh-doctype{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.lh-meta{font-size:9px;opacity:.65;line-height:1.8}
.gold-bar{height:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ── Body ── */
.body{padding:22px 24px 22px}

/* ── Title row ── */
.title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:2px solid #f3f4f6}
.title-main{font-size:16px;font-weight:800;color:#111827;letter-spacing:-.3px}
.title-sub{font-size:11px;color:#6b7280;margin-top:3px}
.booking-badge{background:#f3f4f6;border-radius:6px;padding:7px 12px;text-align:right}
.booking-label{font-size:8px;color:#9ca3af;text-transform:uppercase;letter-spacing:.8px}
.booking-val{font-size:12px;font-weight:700;color:#374151;margin-top:1px;font-family:monospace}

/* ── Info grid ── */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.info-card{background:#f9fafb;border:1px solid #f0f1f3;border-radius:8px;padding:12px 14px}
.info-card-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#6b7280;margin-bottom:8px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid #f3f4f6}
.info-row:last-child{border-bottom:none}
.info-key{font-size:10px;color:#6b7280;font-weight:500}
.info-val{font-size:10px;font-weight:700;color:#111827;text-align:right;max-width:55%}

/* ── Progress bar ── */
.progress-section{margin-bottom:16px}
.progress-label-row{display:flex;justify-content:space-between;margin-bottom:5px}
.prog-label{font-size:9px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.5px}
.prog-pct{font-size:11px;font-weight:800;color:#1e2d47}
.progress-bar{height:8px;background:#f0f1f3;border-radius:99px;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.progress-fill{height:100%;border-radius:99px;transition:width .4s;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ── KPI strip ── */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.kpi{background:#f9fafb;border:1px solid #f0f1f3;border-radius:8px;padding:10px 12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.kpi-label{font-size:8px;color:#9ca3af;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;font-weight:600}
.kpi-val{font-size:14px;font-weight:800;color:#111827;line-height:1}
.kpi-sub{font-size:8.5px;color:#6b7280;margin-top:3px}
.kpi.accent{background:linear-gradient(135deg,#1e2d47,#2a3f63);color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.kpi.accent .kpi-label,.kpi.accent .kpi-sub{color:rgba(255,255,255,.6)}
.kpi.accent .kpi-val{color:#fff}
.kpi.green{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-color:#86efac;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.kpi.green .kpi-val{color:#16a34a}
.kpi.amber{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fcd34d;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.kpi.amber .kpi-val{color:#d97706}
.kpi.red{background:linear-gradient(135deg,#fff1f2,#ffe4e6);border-color:#fca5a5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.kpi.red .kpi-val{color:#dc2626}

/* ── Schedule table ── */
.tbl-wrap{overflow:hidden;border-radius:8px;border:1px solid #f0f1f3;margin-bottom:16px}
.sched-tbl{width:100%;border-collapse:collapse;font-size:10px}
.sched-tbl thead th{background:#1e2d47;color:#fff;padding:8px 10px;text-align:left;font-weight:600;font-size:8.5px;text-transform:uppercase;letter-spacing:.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sched-tbl thead th.right{text-align:right}
.sched-tbl tbody tr.paid{background:#f0fdf4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sched-tbl tbody tr.overdue{background:#fff1f2;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sched-tbl tbody tr.pending{}
.sched-tbl tbody tr:nth-child(even):not(.paid):not(.overdue){background:#f9fafb;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sched-tbl td{padding:7px 10px;border-bottom:1px solid #f0f1f3;color:#374151;vertical-align:middle}
.sched-tbl td.right{text-align:right;font-variant-numeric:tabular-nums}
.sched-tbl td.mono{font-family:monospace;font-size:9px}
.sched-tbl .totals-row td{background:#1e2d47;color:#fff;font-weight:700;font-size:9.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sched-tbl .totals-row td.right{text-align:right}

/* ── Badge ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.badge-green{background:#dcfce7;color:#16a34a}
.badge-red{background:#fee2e2;color:#dc2626}
.badge-amber{background:#fef3c7;color:#d97706}
.badge-gray{background:#f3f4f6;color:#6b7280}
.badge-blue{background:#dbeafe;color:#1d4ed8}

/* ── Payment dots in row ── */
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dot-green{background:#22c55e}
.dot-red{background:#ef4444}
.dot-amber{background:#f59e0b}
.dot-gray{background:#d1d5db}

/* ── Signature ── */
.sig-row{display:flex;justify-content:space-between;align-items:flex-end;padding-top:16px;border-top:1px solid #f0f1f3;margin-top:4px}
.sig-block{text-align:center}
.sig-line{width:130px;border-top:1.5px solid #374151;margin:0 auto 5px;padding-top:4px}
.sig-name{font-size:9.5px;font-weight:700;color:#111827}
.sig-title{font-size:8px;color:#9ca3af;margin-top:1px}

/* ── Footer ── */
.doc-footer{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid #f0f1f3;margin-top:12px}
.footer-note{font-size:8px;color:#9ca3af;line-height:1.6}
.footer-brand{font-size:8px;color:#d1d5db;font-weight:600;text-transform:uppercase;letter-spacing:.8px}

/* ── Loading ── */
.state-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px;text-align:center;gap:14px}
.spinner{width:34px;height:34px;border:3px solid #e5e7eb;border-top-color:#1e2d47;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.state-title{font-size:14px;font-weight:700;color:#374151}
.state-sub{font-size:11px;color:#9ca3af}

/* ── Print ── */
@media print{
  .toolbar{display:none!important}
  .page-wrap{padding:0!important}
  .page{box-shadow:none!important;border-radius:0!important}
  @page{size:A4;margin:10mm 12mm}
  body{background:#fff!important}
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-title">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Installment Schedule
  </div>
  <div class="toolbar-actions">
    <button class="btn-print" onclick="window.print()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Print / PDF
    </button>
    <button class="btn-close" onclick="window.close()">Close</button>
  </div>
</div>

<div class="page-wrap" id="pageWrap">
  <div class="page">
    <div class="state-box" id="loadingState">
      <div class="spinner"></div>
      <div class="state-title">Loading Schedule…</div>
      <div class="state-sub">Fetching payment schedule from database</div>
    </div>
  </div>
</div>

<script>
const SUPA_URL = 'https://bcqqjcwxlxbcnlxuflqw.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjcXFqY3d4bHhiY25seHVmbHF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU3NDY4NTQsImV4cCI6MjA2MTMyMjg1NH0.9EHbABQGfHkWVGPyGfBJOyVVMY97pydUDQT1VGMBHwE';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

function fmtPKR(v){ return 'PKR '+Number(v||0).toLocaleString('en-PK',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function fmtDate(v){ if(!v) return '—'; try{ return new Date(v).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }catch{return v;} }

function getRowStatus(row){
  if(row.is_paid || row.status==='paid') return 'paid';
  const d = new Date(row.due_date); d.setHours(0,0,0,0);
  const now = new Date(); now.setHours(0,0,0,0);
  if(d < now) return 'overdue';
  return 'pending';
}

function statusBadge(st){
  if(st==='paid')    return '<span class="badge badge-green"><span class="dot dot-green"></span>Paid</span>';
  if(st==='overdue') return '<span class="badge badge-red"><span class="dot dot-red"></span>Overdue</span>';
  return '<span class="badge badge-gray"><span class="dot dot-gray"></span>Pending</span>';
}

async function load(){
  const p = new URLSearchParams(location.search);
  const saleId = p.get('sale_id');
  const cid    = p.get('cid');
  if(!saleId||!cid){ showError('Missing sale_id or cid.'); return; }

  const [saleRes, brandRes] = await Promise.all([
    sb.rpc('get_sale_detail', { p_sale_id: saleId }),
    sb.rpc('get_company_branding', { p_company_id: cid })
  ]);

  if(saleRes.error){ showError('Failed to load sale: '+saleRes.error.message); return; }
  const sale = saleRes.data;
  if(!sale){ showError('Sale record not found.'); return; }

  const b = (brandRes.data && brandRes.data[0]) || {};
  const color1 = b.doc_brand_color || '#1e2d47';
  const color2 = b.accent_color || '#c9a84c';

  const rawSched = Array.isArray(sale.schedule) ? sale.schedule
    : (sale.schedule_json ? JSON.parse(sale.schedule_json) : []);
  const schedule = rawSched.sort((a,b)=> new Date(a.due_date)-new Date(b.due_date));

  const totalAmt   = Number(sale.total_price||0);
  const downPay    = Number(sale.down_payment||0);
  const totalPaid  = schedule.filter(r=>getRowStatus(r)==='paid').reduce((s,r)=>s+Number(r.amount||0),0);
  const totalDue   = schedule.filter(r=>getRowStatus(r)==='overdue').reduce((s,r)=>s+Number(r.amount||0),0);
  const totalPend  = schedule.filter(r=>getRowStatus(r)==='pending').reduce((s,r)=>s+Number(r.amount||0),0);
  const paidCount  = schedule.filter(r=>getRowStatus(r)==='paid').length;
  const overdueCount = schedule.filter(r=>getRowStatus(r)==='overdue').length;
  const paidPct = totalAmt ? Math.round(totalPaid/totalAmt*100) : 0;

  // Progress color
  const progColor = paidPct >= 75 ? '#22c55e' : paidPct >= 40 ? '#f59e0b' : '#3b82f6';

  // Table rows
  const rows = schedule.map((row, i) => {
    const st = getRowStatus(row);
    const paidDate = row.paid_date||row.payment_date||null;
    const receiptNo = row.receipt_no||'';
    return `<tr class="${st}">
      <td>${row.installment_no||i+1}</td>
      <td>${fmtDate(row.due_date)}</td>
      <td>${row.installment_type||row.type||'Installment'}</td>
      <td class="right">${fmtPKR(row.amount)}</td>
      <td class="right">${paidDate ? fmtDate(paidDate) : '—'}</td>
      <td class="mono">${receiptNo||'—'}</td>
      <td>${statusBadge(st)}</td>
    </tr>`;
  }).join('');

  const totalScheduled = schedule.reduce((s,r)=>s+Number(r.amount||0),0);

  document.getElementById('pageWrap').innerHTML = `
  <div class="page">
    <div class="lh" style="background:linear-gradient(135deg,${color1},${color2}aa);-webkit-print-color-adjust:exact;print-color-adjust:exact">
      <div class="lh-left">
        ${b.logo_url
          ? `<img src="${b.logo_url}" alt="logo" class="lh-logo">`
          : `<div class="lh-initials">${(b.company_name||'RE').substring(0,2).toUpperCase()}</div>`}
        <div class="lh-company">
          <div class="lh-name">${b.company_name||'Real Estate Company'}</div>
          <div class="lh-sub">${b.company_tagline||'Real Estate Management'}</div>
        </div>
      </div>
      <div class="lh-right">
        <div class="lh-doctype">Installment Schedule</div>
        <div class="lh-meta">
          Printed: ${fmtDate(new Date().toISOString().slice(0,10))}<br>
          ${b.company_address||''}
        </div>
      </div>
    </div>
    <div class="gold-bar" style="background:${color2};-webkit-print-color-adjust:exact;print-color-adjust:exact"></div>

    <div class="body">
      <div class="title-row">
        <div>
          <div class="title-main">Payment Schedule</div>
          <div class="title-sub">${sale.client_name||'—'} · ${sale.unit_number||'—'}, ${sale.project_name||'—'}</div>
        </div>
        <div class="booking-badge">
          <div class="booking-label">Booking Ref</div>
          <div class="booking-val">${sale.booking_no||saleId.slice(-8).toUpperCase()}</div>
        </div>
      </div>

      <div class="info-grid">
        <div class="info-card">
          <div class="info-card-title">Client & Property</div>
          <div class="info-row"><span class="info-key">Client Name</span><span class="info-val">${sale.client_name||'—'}</span></div>
          <div class="info-row"><span class="info-key">Phone</span><span class="info-val">${sale.client_phone||'—'}</span></div>
          <div class="info-row"><span class="info-key">Unit No.</span><span class="info-val">${sale.unit_number||'—'}</span></div>
          <div class="info-row"><span class="info-key">Project</span><span class="info-val">${sale.project_name||'—'}</span></div>
          <div class="info-row"><span class="info-key">Type</span><span class="info-val">${sale.unit_type||'—'}</span></div>
          <div class="info-row"><span class="info-key">Booking Date</span><span class="info-val">${fmtDate(sale.booking_date)}</span></div>
        </div>
        <div class="info-card">
          <div class="info-card-title">Financial Summary</div>
          <div class="info-row"><span class="info-key">Total Sale Price</span><span class="info-val">${fmtPKR(totalAmt)}</span></div>
          <div class="info-row"><span class="info-key">Down Payment</span><span class="info-val">${fmtPKR(downPay)}</span></div>
          <div class="info-row"><span class="info-key">Total Installments</span><span class="info-val">${schedule.length}</span></div>
          <div class="info-row"><span class="info-key">Total Paid</span><span class="info-val" style="color:#16a34a">${fmtPKR(totalPaid)}</span></div>
          <div class="info-row"><span class="info-key">Overdue</span><span class="info-val" style="color:#dc2626">${fmtPKR(totalDue)}</span></div>
          <div class="info-row"><span class="info-key">Balance</span><span class="info-val">${fmtPKR(totalPend+totalDue)}</span></div>
        </div>
      </div>

      <div class="progress-section">
        <div class="progress-label-row">
          <span class="prog-label">Collection Progress</span>
          <span class="prog-pct">${paidPct}% Collected · ${paidCount}/${schedule.length} installments paid</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${paidPct}%;background:${progColor};-webkit-print-color-adjust:exact;print-color-adjust:exact"></div>
        </div>
      </div>

      <div class="kpi-strip">
        <div class="kpi accent">
          <div class="kpi-label">Total Value</div>
          <div class="kpi-val" style="font-size:11px">${fmtPKR(totalAmt)}</div>
          <div class="kpi-sub">${schedule.length} installments</div>
        </div>
        <div class="kpi green">
          <div class="kpi-label">Collected</div>
          <div class="kpi-val" style="font-size:11px">${fmtPKR(totalPaid)}</div>
          <div class="kpi-sub">${paidCount} paid</div>
        </div>
        <div class="kpi ${overdueCount>0?'red':'amber'}">
          <div class="kpi-label">Overdue</div>
          <div class="kpi-val" style="font-size:11px">${fmtPKR(totalDue)}</div>
          <div class="kpi-sub">${overdueCount} installments</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Pending</div>
          <div class="kpi-val" style="font-size:11px">${fmtPKR(totalPend)}</div>
          <div class="kpi-sub">${schedule.filter(r=>getRowStatus(r)==='pending').length} upcoming</div>
        </div>
      </div>

      <div class="tbl-wrap">
        <table class="sched-tbl">
          <thead>
            <tr>
              <th>#</th>
              <th>Due Date</th>
              <th>Description</th>
              <th class="right">Amount (PKR)</th>
              <th>Paid Date</th>
              <th>Receipt #</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
            <tr class="totals-row">
              <td colspan="3">TOTAL</td>
              <td class="right">${fmtPKR(totalScheduled)}</td>
              <td colspan="3"></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="sig-row">
        <div>
          <div class="sig-block" style="text-align:left">
            <div style="font-size:9px;color:#9ca3af;margin-bottom:4px">Client Acknowledgement</div>
            <div class="sig-line" style="margin:0 0 5px"></div>
            <div class="sig-name">${sale.client_name||'Client'}</div>
            <div class="sig-title">Buyer</div>
          </div>
        </div>
        <div class="sig-block">
          <div class="sig-line"></div>
          <div class="sig-name">${b.signature_name||b.company_name||'Authorized Signatory'}</div>
          <div class="sig-title">${b.signature_title||'Accounts Department'}</div>
        </div>
      </div>

      <div class="doc-footer">
        <div class="footer-note">${b.footer_text||'This schedule is computer-generated and subject to the terms of your sale agreement.'}</div>
        <div class="footer-brand">Nexunova RMS</div>
      </div>
    </div>
  </div>`;
}

function showError(msg){
  document.getElementById('pageWrap').innerHTML = `
  <div class="page">
    <div class="state-box">
      <div class="state-title">Error Loading Schedule</div>
      <div class="state-sub">${msg}</div>
    </div>
  </div>`;
}

load();
</script>
</body>
</html>
